<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>手相解码</title>
    <style>
        @font-face {
            font-family: 'MFSongHe';
            src: url('fonts/MFSongHe-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'AcidGrotesk';
            src: url('fonts/FFF-AcidGrotesk-Bold-TRIAL.otf') format('opentype');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'MFSongHe', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'PingFang TC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(197deg, #EEDFBA 5.46%, #EFDCD0 71.37%);
            min-height: 100vh;
            overflow: hidden;
        }
        .app { max-width: 414px; margin: 0 auto; height: 100vh; position: relative; display: flex; flex-direction: column; }
        .app.home-active {
            background: #faf8f6;
        }
        .app.camera-active,
        .app.scan-active {
            background: #EEF2FA;
            color: #000000;
        }
        /* 识别页文案：Acid Grotesk（拉丁）+ 系统无衬线中文，避免回退到 MFSongHe 宋体 */
        .app.camera-active .header h1,
        .app.camera-active .header p,
        .app.camera-active .camera-hint,
        .app.camera-active .upload-text,
        .app.camera-active .camera-placeholder-text,
        .app.scan-active .header h1,
        .app.scan-active .header p,
        .app.scan-active .scan-text {
            font-family: 'AcidGrotesk', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'SF Pro Display', 'Helvetica Neue', 'Microsoft YaHei UI', sans-serif;
            font-weight: 700;
            font-style: normal;
            color: #000000;
        }
        .app.camera-active .header h1,
        .app.scan-active .header h1 {
            font-size: 24px;
            line-height: 1.15;
            letter-spacing: -0.02em;
        }
        .app.camera-active .header p,
        .app.scan-active .header p {
            font-size: 13px;
            line-height: 1.45;
            letter-spacing: -0.01em;
        }
        .app.camera-active .camera-hint {
            font-size: 18px;
            letter-spacing: -0.02em;
        }
        .app.camera-active .upload-text {
            font-size: 16px;
            letter-spacing: -0.01em;
        }
        .app.scan-active .scan-text {
            font-size: 16px;
            letter-spacing: -0.01em;
        }
        .app.camera-active .close-btn,
        .app.scan-active .close-btn {
            background: rgba(255, 255, 255, 0.85);
            border-color: rgba(0, 0, 0, 0.1);
            color: #000000;
        }
        .app.camera-active .upload-icon,
        .app.camera-active .camera-placeholder {
            color: #000000;
        }
        /* 拍照 / 识别：顶栏浮在渐变上，与内容区共用 app 背景，减轻顶部分割感 */
        .app.camera-active .header,
        .app.scan-active .header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 30;
            background: transparent;
            pointer-events: none;
            padding-top: max(52px, calc(env(safe-area-inset-top, 0px) + 36px));
            padding-left: 24px;
            padding-right: 24px;
            padding-bottom: 10px;
        }
        .app.camera-active .header > div,
        .app.camera-active .header .close-btn,
        .app.scan-active .header > div,
        .app.scan-active .header .close-btn {
            pointer-events: auto;
        }
        .app.camera-active .section-camera,
        .app.scan-active .section-scan {
            background: transparent;
            padding-top: max(118px, calc(env(safe-area-inset-top, 0px) + 102px));
        }
        .app.camera-active .camera-container {
            margin-top: 4px;
        }
        .app.scan-active .scan-box {
            margin-top: 4px;
        }
        .app.result-active {
            background: linear-gradient(161.58deg, #0c0c0c 6.66%, #727272 150.26%);
        }
        .app.result-active .header h1 { color: #fff; }
        .app.result-active .header p { color: rgba(255,255,255,0.9); }
        .app.result-active .header > div:first-of-type {
            display: none;
        }
        /* 结果页：顶栏浮在内容之上，不占高度，与整页渐变融为一体 */
        .app.result-active .header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 30;
            background: transparent;
            pointer-events: none;
            justify-content: flex-end;
            align-items: flex-start;
            padding-top: max(48px, calc(env(safe-area-inset-top, 0px) + 36px));
            padding-left: 20px;
            padding-right: 20px;
            padding-bottom: 0;
        }
        .app.result-active .header .close-btn {
            pointer-events: auto;
        }
        .app.result-active .close-btn {
            background: rgba(255,255,255,0.07);
            border-color: rgba(255,255,255,0.18);
            color: #fff;
        }
        .app.home-active .header {
            opacity: 0;
            pointer-events: none;
            transform: translateY(-8px);
            position: absolute;
            inset: 0 0 auto 0;
            z-index: 1;
        }
        .app.home-active .sections-wrap {
            height: 100vh;
        }

        .header {
            padding: 60px 24px 20px;
            display: flex; justify-content: space-between; align-items: flex-start;
            flex-shrink: 0; position: relative; z-index: 10;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }
        .header h1 { font-size: 21px; font-weight: 700; color: #000; line-height: 1.2; margin-bottom: 4px; }
        .header p { font-size: 11px; color: #4a4a4a; }
        .close-btn {
            width: 34px; height: 34px; border-radius: 50%;
            background: rgba(255,255,255,0.55);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            border: 1.7px solid rgba(255,255,255,0.1);
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            transition: transform 0.2s;
        }
        .close-btn:active { transform: scale(0.92); }

        .sections-wrap {
            flex: 1; position: relative; overflow: hidden;
        }

        .section {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            opacity: 0;
            pointer-events: none;
        }
        .section.active {
            opacity: 1;
            pointer-events: auto;
        }
        .section.exiting {
            opacity: 0;
            pointer-events: none;
        }

        /* ===== HOME ===== */
        .section-home {
            position: relative;
            min-height: 100vh;
            background-color: #faf8f6;
            background-image: url('images/home-bg.png');
            background-repeat: no-repeat;
            background-position: center top;
            background-size: cover;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .section-home:active {
            opacity: 0.98;
        }
        .home-bg {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        /* ===== CAMERA ===== */
        .section-camera {
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            background: transparent;
        }
        .camera-container {
            position: relative;
            width: 100%; aspect-ratio: 674 / 982;
            margin: 14px auto 0;
            background: rgba(255,255,255,0.46);
            backdrop-filter: blur(7.8px); -webkit-backdrop-filter: blur(7.8px);
            border: 1px solid #e3ceee;
            border-radius: 20px; overflow: hidden;
        }
        .camera-video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; background: #000;
        }
        .camera-video.front-camera { transform: scaleX(-1); }
        .camera-placeholder {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #4a4a4a; z-index: 1;
        }
        .camera-placeholder-icon { width: 48px; height: 48px; margin-bottom: 12px; opacity: 0.5; }
        .camera-placeholder-text { font-size: 14px; opacity: 0.7; }
        .camera-frame {
            position: absolute; top: 8%; left: 8%; right: 8%; bottom: 8%;
            border: 2px dashed rgba(58,42,26,0.2);
            border-radius: 16px; pointer-events: none; z-index: 3;
        }
        .hand-guide {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 65%; max-width: 200px; height: auto; pointer-events: none; z-index: 2;
            transition: opacity 0.3s ease;
        }
        .hand-guide.detected { opacity: 0.1; }
        .detection-status {
            position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
            padding: 8px 16px; background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            border-radius: 20px; font-size: 12px; color: white; z-index: 10;
            opacity: 0; transition: opacity 0.25s; white-space: nowrap;
        }
        .detection-status.visible { opacity: 1; }
        .detection-status.success { background: rgba(76,175,80,0.85); }
        .camera-hint {
            text-align: center; margin-top: 24px;
            font-size: 18px; color: #000000; line-height: 1.5;
        }
        .upload-section {
            display: flex; align-items: center; justify-content: center;
            gap: 8px; margin-top: 20px; cursor: pointer; padding: 12px;
        }
        .upload-section:active { opacity: 0.7; }
        .upload-text { font-size: 16px; color: #000000; }
        .upload-icon { width: 18px; height: 18px; color: #000000; }
        #fileInput { display: none; }

        /* ===== SCAN ===== */
        .section-scan {
            padding: 0 20px;
            background: transparent;
        }
        .scan-box {
            position: relative; width: 100%; aspect-ratio: 674 / 982;
            margin: 10px auto 0;
            background: rgba(255,255,255,0.46);
            backdrop-filter: blur(7.8px); -webkit-backdrop-filter: blur(7.8px);
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 20px; overflow: hidden;
        }
        .scan-box img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        .scan-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
        .scan-grid {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(201,169,110,0.12) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(201,169,110,0.12) 1px, transparent 1px);
            background-size: 25% 25%;
        }
        .scan-line {
            position: absolute; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, transparent, #C9A96E, transparent);
            animation: scanMove 2.5s ease-in-out infinite;
            box-shadow: 0 0 20px rgba(201,169,110,0.6);
        }
        @keyframes scanMove { 0% { top: 0; } 50% { top: 95%; } 100% { top: 0; } }
        .scan-dots { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
        .scan-dot {
            position: absolute; width: 12px; height: 12px; border-radius: 50%;
            background: #FFD700; animation: dotPulse 1.5s ease-in-out infinite;
            box-shadow: 0 0 8px rgba(255,215,0,0.6);
        }
        .scan-dot:nth-child(1) { top: 35%; left: 40%; }
        .scan-dot:nth-child(2) { top: 40%; left: 60%; animation-delay: .3s; }
        .scan-dot:nth-child(3) { top: 55%; left: 35%; animation-delay: .6s; }
        .scan-dot:nth-child(4) { top: 60%; left: 55%; animation-delay: .9s; }
        .scan-dot:nth-child(5) { top: 70%; left: 45%; animation-delay: 1.2s; }
        @keyframes dotPulse { 0%,100% { transform: scale(1); opacity: .8; } 50% { transform: scale(1.5); opacity: 1; } }
        .scan-progress { margin-top: 20px; text-align: center; }
        .scan-text { font-size: 16px; color: #000000; margin-bottom: 12px; }
        .progress-bar { width: 80%; height: 4px; background: #E8DED0; border-radius: 2px; margin: 0 auto; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #C9A96E, #FFD700); border-radius: 2px; width: 0%; transition: width 0.3s ease; }

        /* ===== RESULT (dark) ===== */
        .app.result-active .section-result {
            background: transparent;
        }
        .section-result {
            padding: 0;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            background: linear-gradient(161.58deg, #0c0c0c 6.66%, #727272 150.26%);
        }
        .app.result-active .result-scroll {
            padding: 0 20px 48px;
            padding-top: max(4px, env(safe-area-inset-top, 0px));
        }
        .result-scroll { padding: 0 20px 48px; }
        .result-hero-block {
            margin: 0 -20px 12px;
            margin-top: max(0px, calc(env(safe-area-inset-top, 0px) - 8px));
        }
        /* 与 section-result 同一套渐变，避免顶部模块与下方出现色块分割 */
        .result-hero-premium {
            position: relative;
            padding: 12px 0 20px;
            background: transparent;
            border-radius: 0;
            overflow: visible;
        }
        .result-hero-triple {
            display: grid;
            grid-template-columns: minmax(28px, 1fr) minmax(0, 220px) minmax(28px, 1fr);
            align-items: center;
            gap: 12px 28px;
            padding: 0 14px;
            max-width: 100%;
        }
        .result-hero-side {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 0.28em;
            line-height: 1.75;
            color: rgba(255, 255, 255, 0.9);
            white-space: nowrap;
            padding: 8px 0;
            text-shadow: 0 1px 8px rgba(0, 0, 0, 0.45);
        }
        .result-hero-side--left {
            justify-self: end;
        }
        .result-hero-side--right {
            justify-self: start;
        }
        .result-hero-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 0;
            padding: 0 6px;
        }
        .result-hero-img {
            width: 100%;
            height: auto;
            max-height: min(42vh, 280px);
            object-fit: contain;
            object-position: center center;
            border-radius: 0;
            margin: 0 auto 6px;
            display: block;
            box-shadow: none;
            border: none;
            background: transparent;
            filter: drop-shadow(0 12px 28px rgba(0, 0, 0, 0.35));
        }
        .result-hero-caption {
            text-align: center;
            color: #fff;
            padding: 0 4px 4px;
            width: 100%;
        }
        .result-hero-title-main {
            font-size: clamp(30px, 8vw, 40px);
            font-weight: 700;
            letter-spacing: 0.12em;
            line-height: 1.25;
            text-shadow: 0 2px 24px rgba(0, 0, 0, 0.5);
        }
        .result-keywords-card {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 14px;
            background: #fff;
            border-radius: 18px;
            padding: 12px 14px 14px;
            margin-bottom: 14px;
            box-shadow: 0 8px 28px rgba(0,0,0,0.2);
        }
        .palm-thumb-inline {
            flex-shrink: 0;
            width: 104px;
            height: 104px;
            border-radius: 14px;
            display: block;
            background: #111;
            border: 1px solid rgba(0,0,0,0.08);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
        }
        .keywords-col {
            flex: 1;
            min-width: 0;
        }
        .keywords-title { font-size: 17px; font-weight: 700; color: #111; margin-bottom: 10px; }
        .keywords-grid { display: flex; gap: 12px; justify-content: space-between; }
        .keyword-item { display: flex; flex-direction: column; align-items: center; gap: 8px; flex: 1; min-width: 0; }
        .keyword-icon.keyword-orbit {
            width: 40px; height: 40px; border-radius: 50%;
            position: relative;
            background: radial-gradient(circle, rgba(255,255,255,1) 0 22%, rgba(240,240,240,1) 23% 38%, transparent 39%),
                radial-gradient(circle, transparent 48%, rgba(180,180,180,0.35) 49% 52%, transparent 53%),
                radial-gradient(circle, transparent 62%, rgba(120,120,120,0.25) 63% 68%, transparent 70%);
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06);
        }
        .keyword-icon.keyword-orbit::after {
            content: "";
            position: absolute;
            inset: 6px;
            border-radius: 50%;
            border: 1px solid rgba(0,0,0,0.12);
            opacity: 0.85;
        }
        .keyword-label { font-size: 12px; color: #333; text-align: center; line-height: 1.4; }
        .result-lines-card {
            background: #fff;
            border-radius: 18px;
            padding: 18px 16px 16px;
            box-shadow: 0 8px 28px rgba(0,0,0,0.2);
        }
        .lines-section { margin-top: 0; padding-top: 0; border-top: none; }
        .line-row { display: flex; margin-bottom: 14px; gap: 12px; line-height: 1.65; }
        .line-row:last-child { margin-bottom: 0; }
        .line-name { font-size: 15px; font-weight: 700; color: #111; min-width: 64px; flex-shrink: 0; padding-top: 1px; }
        .line-desc { font-size: 15px; color: #333; line-height: 1.65; }
        .traits-section { margin-top: 22px; }
        .traits-title { font-size: 22px; font-weight: 700; color: #fff; margin-bottom: 14px; padding-left: 2px; }
        .trait-card {
            background: #fff;
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 10px;
            display: flex; gap: 14px; align-items: flex-start;
            opacity: 0; transform: translateY(20px);
            transition: opacity 0.4s ease, transform 0.4s ease;
            box-shadow: 0 8px 24px rgba(0,0,0,0.18);
            border: 1px solid rgba(255,255,255,0.06);
        }
        .trait-card.visible { opacity: 1; transform: translateY(0); }
        .trait-icon {
            width: 42px; height: 42px; border-radius: 12px;
            background: linear-gradient(135deg, #f2f2f2, #e8e8e8);
            display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0;
        }
        .trait-title { font-size: 17px; font-weight: 700; color: #111; margin-bottom: 6px; }
        .trait-desc { font-size: 15px; color: #444; line-height: 1.65; }
        .share-section { margin-top: 24px; text-align: center; padding-bottom: 32px; }
        .share-btn {
            width: 100%; padding: 16px; border-radius: 28px;
            background: linear-gradient(135deg, #e8d4b8 0%, #c9a96e 100%);
            border: none; color: #1a1208; font-size: 17px; font-weight: 600;
            cursor: pointer; box-shadow: 0 10px 28px rgba(0,0,0,0.35);
        }
        .share-btn:active { transform: scale(0.98); }
        .disclaimer { margin-top: 14px; font-size: 12px; color: rgba(255,255,255,0.48); line-height: 1.65; }

        /* ===== PALM HERO GRAPHIC (unused in dark result layout) ===== */
        .palm-hero {
            display: none;
            position: relative;
            margin: 24px 0;
            border-radius: 24px;
            overflow: hidden;
            opacity: 0; transform: translateY(20px);
            transition: opacity 0.6s ease 0.3s, transform 0.6s ease 0.3s;
        }
        .palm-hero.visible { opacity: 1; transform: translateY(0); }

        .palm-hero-inner {
            position: relative;
            padding: 32px 20px 28px;
            background: rgba(255,255,255,0.35);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.4);
            border-radius: 24px;
            text-align: center;
            overflow: hidden;
        }

        .palm-hero-glow {
            position: absolute; top: 50%; left: 50%;
            width: 200px; height: 200px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.5;
            pointer-events: none;
            animation: glowPulse 4s ease-in-out infinite;
        }
        @keyframes glowPulse {
            0%, 100% { opacity: 0.35; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 0.55; transform: translate(-50%, -50%) scale(1.15); }
        }

        .palm-hero-svg-wrap {
            position: relative;
            width: 180px; height: 180px;
            margin: 0 auto 20px;
            z-index: 1;
        }
        .palm-hero-svg-wrap svg {
            width: 100%; height: 100%;
            filter: drop-shadow(0 0 12px var(--hero-glow-color, rgba(192,214,232,0.4)));
        }

        .palm-hero-label {
            position: relative; z-index: 1;
            font-size: 20px; font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 6px;
        }
        .palm-hero-sub {
            position: relative; z-index: 1;
            font-size: 12px; opacity: 0.7;
            letter-spacing: 1px;
        }

        /* --- Philosopher (long) --- */
        .palm-hero.type-long { --hero-glow-color: rgba(180, 210, 240, 0.5); }
        .palm-hero.type-long .palm-hero-inner {
            background: linear-gradient(160deg, rgba(230,240,252,0.45) 0%, rgba(210,225,245,0.3) 100%);
            border-color: rgba(200,220,245,0.5);
        }
        .palm-hero.type-long .palm-hero-glow {
            background: radial-gradient(circle, rgba(180,210,245,0.7), rgba(200,180,240,0.3), transparent);
        }
        .palm-hero.type-long .palm-hero-label { color: #4A6A8A; }
        .palm-hero.type-long .palm-hero-sub { color: #6A8AAA; }

        /* --- Practical (square) --- */
        .palm-hero.type-square { --hero-glow-color: rgba(210, 180, 140, 0.5); }
        .palm-hero.type-square .palm-hero-inner {
            background: linear-gradient(160deg, rgba(250,240,225,0.45) 0%, rgba(240,225,200,0.3) 100%);
            border-color: rgba(220,200,170,0.5);
        }
        .palm-hero.type-square .palm-hero-glow {
            background: radial-gradient(circle, rgba(220,190,140,0.7), rgba(200,170,120,0.3), transparent);
        }
        .palm-hero.type-square .palm-hero-label { color: #8A6A3A; }
        .palm-hero.type-square .palm-hero-sub { color: #A08050; }

        /* --- Balanced --- */

        .palm-hero.type-balanced .palm-hero-sub { color: #6A9A7A; }

        /* SVG animation keyframes */
        @keyframes heroSpin { to { transform: rotate(360deg); } }
        @keyframes heroSpinReverse { to { transform: rotate(-360deg); } }
        @keyframes heroBreathe {
            0%, 100% { transform: scale(1); opacity: 0.85; }

        @keyframes heroWave {
            0% { d: path("M20,100 C50,85 80,115 110,100 C140,85 170,115 200,100"); }
            50% { d: path("M20,100 C50,115 80,85 110,100 C140,115 170,85 200,100"); }
            100% { d: path("M20,100 C50,85 80,115 110,100 C140,85 170,115 200,100"); }

        @keyframes heroWave3 {

<body>
    <div class="app">
        <div class="header">
            <div><h1>手相解码</h1><p>读懂掌心纹路，读懂你的天生底色</p></div>

        <div class="sections-wrap">

                        <ellipse cx="55" cy="18" rx="8" ry="10" stroke="#3a2a1a" stroke-width="1" fill="none" opacity="0.25"/>
                        <ellipse cx="80" cy="8" rx="8" ry="10" stroke="#3a2a1a" stroke-width="1" fill="none" opacity="0.25"/>
                        <ellipse cx="100" cy="5" rx="8" ry="10" stroke="#3a2a1a" stroke-width="1" fill="none" opacity="0.25"/>

                        <path d="M60 160 C75 155 85 145 100 145 C115 145 125 155 140 160" stroke="#3a2a1a" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.2" stroke-dasharray="4 4"/>
                        <path d="M55 180 C70 175 85 165 100 165 C115 165 130 175 145 180" stroke="#3a2a1a" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.2" stroke-dasharray="4 4"/>
                        <path d="M50 200 C65 195 80 185 100 185 C120 185 135 195 150 200" stroke="#3a2a1a" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.2" stroke-dasharray="4 4"/>
                    </svg>

                <div class="upload-section" id="uploadSection">
                    <span class="upload-text">上传图片</span>
                    <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>

            <!-- SCAN -->
            <div class="section section-scan" id="sectionScan">
                <div class="scan-box">
                    <img id="scanImage" src="" alt="手掌照片">
                    <div class="scan-overlay">
                        <div class="scan-grid"></div>

                        <div class="scan-dots">
                            <div class="scan-dot"></div><div class="scan-dot"></div><div class="scan-dot"></div><div class="scan-dot"></div><div class="scan-dot"></div>
                        </div>

                    <p class="scan-text" id="scanText">正在分析掌纹...</p>
                    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

            <!-- RESULT -->
            <div class="section section-result" id="sectionResult">
                <div class="result-scroll">
                    <div class="result-hero-block">
                        <div class="result-hero-premium">
                            <div class="result-hero-triple">
                                <div id="resultHeroSideL" class="result-hero-side result-hero-side--left" aria-hidden="true"></div>
                                <div class="result-hero-center">
                                    <img id="resultHeroImg" class="result-hero-img" src="images/result-archetype-4.png" width="634" height="588" alt="" decoding="async">
                                    <div class="result-hero-caption">
                                        <div id="resultHeroTitleMain" class="result-hero-title-main"></div>
                                    </div>
                                </div>
                                <div id="resultHeroSideR" class="result-hero-side result-hero-side--right" aria-hidden="true"></div>
                            </div>
                        </div>
                    </div>
                    <div class="result-keywords-card">
                        <canvas id="palmThumbCanvas" class="palm-thumb-inline" width="208" height="208"></canvas>
                        <div class="keywords-col">
                            <div class="keywords-title">关键词</div>
                            <div class="keywords-grid" id="keywordsGrid"></div>
                        </div>
                    </div>

                        <div class="lines-section" id="linesSection"></div>
                    </div>

                        <h2 class="traits-title">你的基本特质</h2>
                        <div id="traitsContainer"></div>

                        <button class="share-btn" id="shareBtn">保存报告 · 分享给好友</button>

    <script type="module">
        // ==========================================
        // DOM refs
        // ==========================================
        const sectionHome = document.getElementById('sectionHome');
        const sectionCamera = document.getElementById('sectionCamera');
        const sectionScan = document.getElementById('sectionScan');
        const sectionResult = document.getElementById('sectionResult');
        const sections = [sectionHome, sectionCamera, sectionScan, sectionResult];
        const app = document.querySelector('.app');

        const closeBtn = document.getElementById('closeBtn');
        const cameraVideo = document.getElementById('cameraVideo');
        const cameraPlaceholder = document.getElementById('cameraPlaceholder');
        const handGuide = document.getElementById('handGuide');
        const detectionStatus = document.getElementById('detectionStatus');
        const uploadSection = document.getElementById('uploadSection');
        const fileInput = document.getElementById('fileInput');

        const scanImage = document.getElementById('scanImage');
        const scanText = document.getElementById('scanText');
        const progressFill = document.getElementById('progressFill');

        const palmThumbCanvas = document.getElementById('palmThumbCanvas');
        const keywordsGrid = document.getElementById('keywordsGrid');
        const linesSection = document.getElementById('linesSection');
        const traitsContainer = document.getElementById('traitsContainer');
        const resultHeroImg = document.getElementById('resultHeroImg');
        const resultHeroTitleMain = document.getElementById('resultHeroTitleMain');
        const resultHeroSideL = document.getElementById('resultHeroSideL');
        const resultHeroSideR = document.getElementById('resultHeroSideR');

        // ==========================================
        // Section transition
        // ==========================================
        let currentSection = sectionHome;

        function switchTo(target) {
            if (target === currentSection) return;
            const prev = currentSection;
            currentSection = target;

            prev.classList.remove('active');
            prev.classList.add('exiting');

            void target.offsetWidth;
            target.classList.remove('exiting');
            target.classList.add('active');

            setTimeout(() => prev.classList.remove('exiting'), 0);

            if (target === sectionHome) app.classList.add('home-active');
            else app.classList.remove('home-active');
            if (target === sectionCamera) app.classList.add('camera-active');
            else app.classList.remove('camera-active');
            if (target === sectionScan) app.classList.add('scan-active');
            else app.classList.remove('scan-active');
            if (target === sectionResult) app.classList.add('result-active');
            else app.classList.remove('result-active');
        }

        // ==========================================
        // Camera state
        // ==========================================
        let stream = null;
        let cameraHandLandmarker = null;
        let isDetecting = false;
        let palmDetectedCount = 0;
        let isFrontCamera = false;
        let lastPalmCenter = null;
        const DETECTION_THRESHOLD = 18;
        const STABILITY_THRESHOLD = 0.015;

        let uploadedImage = null;
        let handLandmarkerInstance = null;

        // ==========================================
        // Navigation handlers
        // ==========================================
        function goToRecognition() {
            if (currentSection !== sectionHome) return;
            switchTo(sectionCamera);
            initCamera();
        }

        sectionHome.addEventListener('click', goToRecognition);
        sectionHome.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                goToRecognition();
            }
        });

        closeBtn.addEventListener('click', () => {
            stopCamera();
            if (currentSection !== sectionHome) {
                switchTo(sectionHome);
                resetState();
            } else {
                history.back();
            }
        });

        uploadSection.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) processUploadedFile(file);
        });

        function resetState() {
            palmDetectedCount = 0;
            lastPalmCenter = null;
            isDetecting = false;
            progressFill.style.width = '0%';
            scanText.textContent = '正在分析掌纹...';
            traitsContainer.innerHTML = '';
            keywordsGrid.innerHTML = '';
            linesSection.innerHTML = '';
            if (resultHeroTitleMain) resultHeroTitleMain.textContent = '';
            if (resultHeroSideL) resultHeroSideL.textContent = '';
            if (resultHeroSideR) resultHeroSideR.textContent = '';
            document.getElementById('palmHero').classList.remove('visible');
            document.getElementById('palmHeroSvg').innerHTML = '';
            handGuide.classList.remove('detected');
            detectionStatus.classList.remove('visible', 'success');
            cameraPlaceholder.style.display = 'flex';
            cameraPlaceholder.querySelector('.camera-placeholder-text').textContent = '正在启动相机...';
        }

        // ==========================================
        // Camera
        // ==========================================
        async function initCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1440 } },
                    audio: false
                });
                const track = stream.getVideoTracks()[0];
                const settings = track.getSettings();
                isFrontCamera = settings.facingMode === 'user';
                if (isFrontCamera) cameraVideo.classList.add('front-camera');
                else cameraVideo.classList.remove('front-camera');

                cameraVideo.srcObject = stream;
                cameraVideo.onloadedmetadata = () => {
                    cameraPlaceholder.style.display = 'none';
                    initCameraHandDetection();
                };
            } catch (err) {
                console.error('Camera error:', err);
                try {
                    stream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: 'user', width: { ideal: 1920 }, height: { ideal: 1440 } },
                        audio: false
                    });
                    isFrontCamera = true;
                    cameraVideo.classList.add('front-camera');
                    cameraVideo.srcObject = stream;
                    cameraVideo.onloadedmetadata = () => {
                        cameraPlaceholder.style.display = 'none';
                        initCameraHandDetection();
                    };
                } catch (fallbackErr) {
                    console.error('Fallback camera error:', fallbackErr);
                    cameraPlaceholder.querySelector('.camera-placeholder-text').textContent = '无法访问相机，请上传图片';
                }
            }
        }

        async function initCameraHandDetection() {
            try {
                const { HandLandmarker, FilesetResolver } = await import(
                    'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm'
                );
                const fileset = await FilesetResolver.forVisionTasks(
                    'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
                );
                cameraHandLandmarker = await HandLandmarker.createFromOptions(fileset, {
                    baseOptions: {
                        modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
                        delegate: 'GPU'
                    },
                    runningMode: 'VIDEO',
                    numHands: 1
                });
                isDetecting = true;
                palmDetectedCount = 0;
                lastPalmCenter = null;
                detectLoop();
            } catch (err) {
                console.warn('Hand detection init failed:', err);
            }
        }

        function detectLoop() {
            if (!isDetecting || !cameraHandLandmarker || !cameraVideo.videoWidth) {
                if (isDetecting) requestAnimationFrame(detectLoop);
                return;
            }
            try {
                const result = cameraHandLandmarker.detectForVideo(cameraVideo, performance.now());
                if (result.landmarks && result.landmarks.length > 0) {
                    const landmarks = result.landmarks[0];
                    if (isPalmOpen(landmarks)) {
                        const palmCenter = getPalmCenter(landmarks);
                        const isStable = isPalmStable(palmCenter);
                        lastPalmCenter = palmCenter;
                        if (isStable) {
                            palmDetectedCount++;
                            handGuide.classList.add('detected');
                            detectionStatus.textContent = `手掌已识别，保持不动 (${palmDetectedCount}/${DETECTION_THRESHOLD})`;
                            detectionStatus.classList.add('visible', 'success');
                            if (palmDetectedCount >= DETECTION_THRESHOLD) {
                                captureAndProcess();
                                return;
                            }
                        } else {
                            palmDetectedCount = Math.max(0, palmDetectedCount - 2);
                            handGuide.classList.add('detected');
                            detectionStatus.textContent = '请保持手掌稳定';
                            detectionStatus.classList.add('visible');
                            detectionStatus.classList.remove('success');
                        }
                    } else {
                        palmDetectedCount = Math.max(0, palmDetectedCount - 1);
                        lastPalmCenter = null;
                        handGuide.classList.remove('detected');
                        detectionStatus.textContent = '请张开手掌';
                        detectionStatus.classList.add('visible');
                        detectionStatus.classList.remove('success');
                    }
                } else {
                    palmDetectedCount = Math.max(0, palmDetectedCount - 1);
                    lastPalmCenter = null;
                    handGuide.classList.remove('detected');
                    detectionStatus.textContent = '未检测到手掌';
                    detectionStatus.classList.add('visible');
                    detectionStatus.classList.remove('success');
                }
            } catch (err) { console.warn('Detection error:', err); }
            requestAnimationFrame(detectLoop);
        }

        function getPalmCenter(landmarks) {
            const w = landmarks[0], m = landmarks[9], i = landmarks[5], p = landmarks[17];
            return { x: (w.x + m.x + i.x + p.x) / 4, y: (w.y + m.y + i.y + p.y) / 4 };
        }

        function isPalmStable(currentCenter) {
            if (!lastPalmCenter) return true;
            const dx = currentCenter.x - lastPalmCenter.x;
            const dy = currentCenter.y - lastPalmCenter.y;
            return Math.sqrt(dx * dx + dy * dy) < STABILITY_THRESHOLD;
        }

        function isPalmOpen(landmarks) {
            if (!landmarks || landmarks.length < 21) return false;
            const wrist = landmarks[0], middleMcp = landmarks[9];
            const palmToMiddle = Math.hypot(middleMcp.x - wrist.x, middleMcp.y - wrist.y);
            const indexExtended = Math.hypot(landmarks[8].x - wrist.x, landmarks[8].y - wrist.y) > palmToMiddle * 1.3;
            const middleExtended = Math.hypot(landmarks[12].x - wrist.x, landmarks[12].y - wrist.y) > palmToMiddle * 1.3;
            const ringExtended = Math.hypot(landmarks[16].x - wrist.x, landmarks[16].y - wrist.y) > palmToMiddle * 1.3;
            const pinkyExtended = Math.hypot(landmarks[20].x - wrist.x, landmarks[20].y - wrist.y) > palmToMiddle * 1.2;
            const thumbExtended = Math.hypot(landmarks[4].x - landmarks[2].x, landmarks[4].y - landmarks[2].y) > palmToMiddle * 0.4;
            return [indexExtended, middleExtended, ringExtended, pinkyExtended, thumbExtended].filter(Boolean).length >= 4;
        }

        async function captureAndProcess() {
            isDetecting = false;
            detectionStatus.textContent = '已锁定，正在对焦...';
            detectionStatus.classList.add('visible', 'success');

            await new Promise(r => setTimeout(r, 800));

            const canvas = document.createElement('canvas');
            canvas.width = cameraVideo.videoWidth;
            canvas.height = cameraVideo.videoHeight;
            const ctx = canvas.getContext('2d');
            if (isFrontCamera) { ctx.translate(canvas.width, 0); ctx.scale(-1, 1); }
            ctx.drawImage(cameraVideo, 0, 0);

            const imageData = canvas.toDataURL('image/jpeg', 0.92);

            stopCamera();

            scanImage.src = imageData;
            uploadedImage = new Image();
            uploadedImage.onload = () => {
                switchTo(sectionScan);
                startScanProcess();
            };
            uploadedImage.src = imageData;
        }

        function processUploadedFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const imageData = e.target.result;
                stopCamera();
                scanImage.src = imageData;
                uploadedImage = new Image();
                uploadedImage.onload = () => {
                    switchTo(sectionScan);
                    startScanProcess();
                };
                uploadedImage.src = imageData;
            };
            reader.readAsDataURL(file);
        }

        function stopCamera() {
            isDetecting = false;
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
        }

        // ==========================================
        // API
        // ==========================================
        function getPalmApiBase() {
            const params = new URLSearchParams(location.search);
            let fromQuery = params.get('api');
            if (fromQuery) { try { fromQuery = decodeURIComponent(fromQuery.trim()); localStorage.setItem('palmApiBase', fromQuery); } catch (_) {} }
            if (!fromQuery && location.hash && location.hash.startsWith('#api=')) { try { fromQuery = decodeURIComponent(location.hash.slice(5).split('&')[0].trim()); if (fromQuery.startsWith('http')) localStorage.setItem('palmApiBase', fromQuery); } catch (_) {} }
            if (fromQuery) { try { const u = new URL(fromQuery); return u.origin + u.pathname.replace(/\/$/, ''); } catch (_) { return null; } }
            try { const saved = localStorage.getItem('palmApiBase'); if (saved) { const u = new URL(saved.trim()); return u.origin + u.pathname.replace(/\/$/, ''); } } catch (_) {}
            const { protocol, hostname, port } = location;
            const local = hostname === 'localhost' || hostname === '127.0.0.1';
            if (local && port === '5050') return '';
            if (protocol === 'file:') return 'http://127.0.0.1:5050';
            if (protocol === 'http:' && local) return 'http://127.0.0.1:5050';
            if (protocol === 'https:') return null;
            return 'http://127.0.0.1:5050';
        }

        function hasBackendResult(seg) {
            return seg && seg.success && !!(seg.features || seg.roi_image);
        }

        // ==========================================
        // MediaPipe IMAGE mode (for scan phase)
        // ==========================================
        async function detectHandLandmarks(imgEl) {
            if (!imgEl || !imgEl.naturalWidth) return null;
            if (!handLandmarkerInstance) {
                const { HandLandmarker, FilesetResolver } = await import(
                    'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm'
                );
                const fileset = await FilesetResolver.forVisionTasks(
                    'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
                );
                handLandmarkerInstance = await HandLandmarker.createFromOptions(fileset, {
                    baseOptions: {
                        modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
                        delegate: 'CPU'
                    },
                    runningMode: 'IMAGE',
                    numHands: 1
                });
            }
            const result = handLandmarkerInstance.detect(imgEl);
            const lm = result.landmarks && result.landmarks[0];
            if (!lm || lm.length < 21) return null;
            return lm.map(p => ({ x: p.x, y: p.y }));
        }

        // ==========================================
        // Scan process
        // ==========================================
        const scanTexts = [
            '加载手部关键点模型...', '检测 21 个手部关键点...',
            '旋转矫正图像...', '分割手部前景...',
            '定位掌心 ROI 区域...', '增强掌纹纹理...',

        // ==========================================
        // Palm analysis
        // ==========================================
        function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

        function analyzePalm(lm) {
            if (!lm || lm.length < 21) return null;
            const palmWidth = dist(lm[5], lm[17]);
            const palmHeight = dist(lm[0], lm[9]);
            const palmRatio = palmHeight / palmWidth;
            const indexLen = dist(lm[5], lm[6]) + dist(lm[6], lm[7]) + dist(lm[7], lm[8]);
            const middleLen = dist(lm[9], lm[10]) + dist(lm[10], lm[11]) + dist(lm[11], lm[12]);
            const ringLen = dist(lm[13], lm[14]) + dist(lm[14], lm[15]) + dist(lm[15], lm[16]);
            const pinkyLen = dist(lm[17], lm[18]) + dist(lm[18], lm[19]) + dist(lm[19], lm[20]);
            const thumbLen = dist(lm[1], lm[2]) + dist(lm[2], lm[3]) + dist(lm[3], lm[4]);
            const fingerTopalm = middleLen / palmHeight;
            const indexToRing = indexLen / ringLen;
            const pinkyToIndex = pinkyLen / indexLen;
            const thumbToIndex = thumbLen / indexLen;
            const heartY = (lm[5].y + lm[17].y) / 2;
            const headY = (lm[5].y + lm[0].y) * 0.45;
            const lifeArc = dist(lm[1], lm[0]);
            const seed = Math.round((palmRatio * 1000 + indexToRing * 1000 + pinkyToIndex * 1000 + fingerTopalm * 1000) % 100);
            const idxSpan = lm[12].x - lm[8].x;
            const heartEndT = Math.abs(idxSpan) > 1e-4 ? (lm[13].x - lm[8].x) / idxSpan : 0.5;
            const palmMidY = (lm[5].y + lm[17].y) / 2;
            const heartLift = (palmMidY - lm[13].y) / Math.max(palmHeight, 1e-6);
            const headIndep = dist(lm[2], lm[5]) / Math.max(palmWidth, 1e-6);
            const headSlump = (lm[13].y - (lm[5].y + lm[0].y) * 0.45) / Math.max(palmHeight, 1e-6);
            const fateVert = 1 - Math.min(1, Math.abs(lm[9].x - lm[0].x) / (palmWidth * 0.35 + 1e-6));
            return {
                palmRatio, fingerTopalm, indexToRing, pinkyToIndex, thumbToIndex, palmWidth, palmHeight,
                heartY, headY, lifeArc, seed, indexLen, middleLen, ringLen, pinkyLen, thumbLen,
                heartEndT, heartLift, headIndep, headSlump, fateVert
            };
        }

        function pickArchetypeIndex(analysis) {
            if (!analysis) return 0;

            const fingerBucket = a.fingerTopalm > 0.85 ? 3 : a.fingerTopalm < 0.7 ? 7 : 1;
            const n = a.seed * 17 + palmBucket * 11 + fingerBucket * 13
                + Math.round(a.heartEndT * 59) + Math.round(a.fateVert * 31)
                + Math.round(a.heartLift * 100) + (a.indexToRing > 1.02 ? 5 : 0) + (a.pinkyToIndex > 0.7 ? 9 : 0);
            return ((n % 12) + 12) % 12;
        }

        function getArchetypeDebugIndex() {
            try {

                let v = p.get('archetype');
                if ((v == null || v === '') && location.hash && location.hash.startsWith('#archetype=')) {
                    v = decodeURIComponent(location.hash.slice('#archetype='.length).split('&')[0].trim());
                }
                if (v == null || v === '') return null;
                const n = parseInt(String(v).trim(), 10);
                if (!Number.isFinite(n) || n < 0 || n > 11) return null;
                return n;
            } catch (_) {
                return null;
            }
        }

                const s = typeof v === 'number' ? (Number.isFinite(v) ? v.toFixed(2) : String(v)) : String(v);
                return `${k} ${s}`;

            return ` 结合本次云端辅助特征：${bit}。`;

        function drawPalmThumbWithLines(img, landmarks, _palmType) {
            const ctx = palmThumbCanvas.getContext('2d');
            const w = img.naturalWidth, h = img.naturalHeight;
            let sx, sy, sw, sh;
            if (landmarks && landmarks.length >= 21) {
                const palmPts = [0, 1, 2, 5, 9, 13, 17];
                let minX = Infinity, minY = Infinity, maxX = 0, maxY = 0;
                for (const i of palmPts) {
                    const px = landmarks[i].x * w, py = landmarks[i].y * h;
                    if (px < minX) minX = px; if (py < minY) minY = py;
                    if (px > maxX) maxX = px; if (py > maxY) maxY = py;
                }
                const padX = (maxX - minX) * 0.28, padY = (maxY - minY) * 0.28;
                minX = Math.max(0, minX - padX); minY = Math.max(0, minY - padY);
                maxX = Math.min(w, maxX + padX); maxY = Math.min(h, maxY + padY);
                const rw = maxX - minX, rh = maxY - minY;
                const side = Math.max(rw, rh);
                const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
                sx = Math.max(0, cx - side / 2); sy = Math.max(0, cy - side / 2);
                sw = Math.min(side, w - sx); sh = Math.min(side, h - sy);
            } else {
                const side = Math.min(w, h) * 0.45;
                sx = (w - side) / 2; sy = h * 0.25; sw = side; sh = side;
            }
            const displayPx = 104;
            const dpr = window.devicePixelRatio || 2;
            const cw = Math.round(displayPx * dpr), ch = Math.round(displayPx * dpr);
            palmThumbCanvas.width = cw;
            palmThumbCanvas.height = ch;
            palmThumbCanvas.style.width = displayPx + 'px';
            palmThumbCanvas.style.height = displayPx + 'px';
            ctx.drawImage(img, sx, sy, sw, sh, 0, 0, cw, ch);

            if (!landmarks || landmarks.length < 21) return;

            const lm = landmarks;
            /** 拇指在画面右侧 ≈ 右手（图1）；拇指在左侧 ≈ 左手（图2），对路径做水平镜像 */
            const thumbOnRight = lm[4].x > lm[9].x;

            const toC = (i) => ({
                x: (lm[i].x * w - sx) / sw * cw,
                y: (lm[i].y * h - sy) / sh * ch
            });
            const L = (i) => ({ x: lm[i].x * w, y: lm[i].y * h });

            const LINE_WHITE = { main: 'rgba(255,255,255,0.92)', glow: 'rgba(255,255,255,0.34)' };
            const LINE_LIFE = { main: 'rgba(255,213,78,0.96)', glow: 'rgba(255,185,40,0.45)' };

            function drawGlowLine(points, width, colors) {
                if (points.length < 2) return;
                const col = colors;
                ctx.save();
                ctx.strokeStyle = col.glow;
                ctx.lineWidth = width + 4;
                ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                ctx.filter = 'blur(3px)';
                ctx.beginPath();
                ctx.moveTo(points[0].x, points[0].y);
                for (let i = 1; i < points.length; i++) {
                    const prev = points[i - 1], curr = points[i];
                    const mx = (prev.x + curr.x) / 2, my = (prev.y + curr.y) / 2;
                    ctx.quadraticCurveTo(prev.x, prev.y, mx, my);
                }
                ctx.lineTo(points[points.length - 1].x, points[points.length - 1].y);
                ctx.stroke();
                ctx.restore();
                ctx.save();
                ctx.strokeStyle = col.main;
                ctx.lineWidth = width;
                ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                ctx.shadowColor = col.main;
                ctx.shadowBlur = 6;
                ctx.beginPath();
                ctx.moveTo(points[0].x, points[0].y);
                for (let i = 1; i < points.length; i++) {
                    const prev = points[i - 1], curr = points[i];
                    const mx = (prev.x + curr.x) / 2, my = (prev.y + curr.y) / 2;
                    ctx.quadraticCurveTo(prev.x, prev.y, mx, my);
                }
                ctx.lineTo(points[points.length - 1].x, points[points.length - 1].y);
                ctx.stroke();
                ctx.restore();
            }

            const lineCx = cw * 0.5, lineCy = ch * 0.5;
            const LINE_COMPACT = 0.85;
            const compact = (p) => ({
                x: lineCx + (p.x - lineCx) * LINE_COMPACT,
                y: lineCy + (p.y - lineCy) * LINE_COMPACT
            });
            const compactPoly = (pts) => pts.map(compact);
            const mirrorX = (pts) => pts.map((p) => ({ x: cw - p.x, y: p.y }));
            const orient = (pts) => (thumbOnRight ? pts : mirrorX(pts));

            const mapPt = (p) => ({
                x: (p.x - sx) / sw * cw,
                y: (p.y - sy) / sh * ch
            });

            let heartPts = [5, 9, 13, 17].map(i => toC(i));
            heartPts[1].y -= ch * 0.024;
            heartPts[1].x += cw * 0.028;
            heartPts[2].y -= ch * 0.012;
            drawGlowLine(orient(compactPoly(heartPts)), 1.65, LINE_WHITE);

            const headStart = {
                x: (L(5).x + L(1).x) / 2, y: (L(5).y + L(0).y) * 0.48
            };
            const headMid1 = { x: (L(5).x + L(9).x) / 2, y: (L(5).y + L(0).y) * 0.50 };
            const headMid2 = { x: (L(9).x + L(13).x) / 2, y: (L(9).y + L(0).y) * 0.52 };
            const headEnd = {
                x: L(13).x + (L(17).x - L(13).x) * 0.4,
                y: (L(13).y + L(0).y) * 0.54
            };
            drawGlowLine(orient(compactPoly([
                mapPt(headStart), mapPt(headMid1), mapPt(headMid2), mapPt(headEnd)
            ])), 1.45, LINE_WHITE);

            const lifeStart = {
                x: (L(5).x + L(1).x) / 2 - (L(5).x - L(1).x) * 0.1,
                y: (L(5).y + L(0).y) * 0.46
            };
            const lifeMid1 = {
                x: L(1).x + (L(0).x - L(1).x) * 0.3,
                y: L(1).y + (L(0).y - L(1).y) * 0.4
            };
            const lifeMid2 = {
                x: L(1).x + (L(0).x - L(1).x) * 0.15,
                y: L(1).y + (L(0).y - L(1).y) * 0.7
            };
            const lifeEnd = {
                x: L(0).x + (L(1).x - L(0).x) * 0.1,
                y: L(0).y - (L(0).y - L(1).y) * 0.05
            };
            drawGlowLine(orient(compactPoly([
                mapPt(lifeStart), mapPt(lifeMid1), mapPt(lifeMid2), mapPt(lifeEnd)
            ])), 1.75, LINE_LIFE);
        }

        // ==========================================
        // Palm Hero Graphic
        // ==========================================
        const palmHero = document.getElementById('palmHero');
        const palmHeroSvg = document.getElementById('palmHeroSvg');
        const palmHeroLabel = document.getElementById('palmHeroLabel');

        function renderPalmHero(palmType) {

                square: {

                    sub: '稳固的几何基石 · 行动的力量与秩序的结晶',
                    svg: `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                        <defs>

                                fill="rgba(230,210,175,0.12)" stroke="url(#earthA)" stroke-width="1" stroke-linejoin="round"/>
                            <line x1="100" y1="60" x2="100" y2="149" stroke="rgba(210,180,130,0.4)" stroke-width="0.6"/>
                            <line x1="55" y1="82" x2="145" y2="82" stroke="rgba(210,180,130,0.3)" stroke-width="0.5"/>

                        </g>
                        <!-- Outer square ring - slow rotate -->
                        <g style="transform-origin:100px 105px; animation: heroSpin 40s linear infinite">
                            <rect x="30" y="35" width="140" height="140" rx="4"
                                fill="none" stroke="url(#earthB)" stroke-width="0.6" opacity="0.5"

                            <line x1="100" y1="25" x2="100" y2="185" stroke="rgba(200,175,125,0.5)" stroke-width="0.4"/>

                        <g style="animation: heroBreathe 4s ease-in-out infinite">

                balanced: {

        // ==========================================
        // Result hero: 12 张手型图（与 PALM_ARCHETYPES 下标一致，可替换为正式素材）
        // ==========================================
        const RESULT_HERO_CONFIG = {
            long: { img: 'images/result-hero-long.png', w: 600, h: 580, titleMain: '哲学手', titleSub: '思想者气质' },

        const ARCHETYPE_HERO_ASSETS = [
            { img: 'images/result-archetype-0.png', w: 634, h: 588 },  // 抓财手

            { img: 'images/result-archetype-4.png', w: 634, h: 588 },  // 幸运手
            { img: 'images/result-archetype-5.png', w: 634, h: 588 },  // 聚福手
            { img: 'images/result-archetype-6.png', w: 634, h: 588 },  // 事业手

            { img: 'images/result-archetype-10.png', w: 634, h: 588 }, // 自愈手
            { img: 'images/result-archetype-11.png', w: 634, h: 588 }  // 解忧手
        ];

        function applyResultHero(reading, palmType) {
            const fb = RESULT_HERO_CONFIG[palmType] || RESULT_HERO_CONFIG.balanced;
            let idx = reading && reading.archetypeIndex != null ? reading.archetypeIndex : 4;
            idx = Math.max(0, Math.min(11, idx));
            const heroCfg = ARCHETYPE_HERO_ASSETS[idx] || ARCHETYPE_HERO_ASSETS[4];
            if (resultHeroImg) {
                resultHeroImg.onerror = () => {
                    resultHeroImg.onerror = null;
                    resultHeroImg.src = fb.img;
                    resultHeroImg.width = fb.w;
                    resultHeroImg.height = fb.h;
                };
                resultHeroImg.src = heroCfg.img;
                resultHeroImg.width = heroCfg.w;
                resultHeroImg.height = heroCfg.h;
            }
            const main = reading && reading.heroMain != null ? reading.heroMain : fb.titleMain;
            if (resultHeroTitleMain) resultHeroTitleMain.textContent = main;
            if (resultHeroSideL) resultHeroSideL.textContent = (reading && reading.heroSideL) ? reading.heroSideL : '';
            if (resultHeroSideR) resultHeroSideR.textContent = (reading && reading.heroSideR) ? reading.heroSideR : '';
        }

        // ==========================================
        // Result
        // ==========================================
        function showResult(segResult, landmarks) {
            traitsContainer.innerHTML = '';
            switchTo(sectionResult);

            const analysis = analyzePalm(landmarks);
            const reading = generateReading(analysis, segResult);
            const pt = reading.palmType || 'balanced';
            const dbgArch = getArchetypeDebugIndex();
            if (dbgArch !== null) {
                console.info('[palm] 联调 archetype=%d（%s）', dbgArch, PALM_ARCHETYPES[dbgArch].title);
            }

            applyResultHero(reading, pt);

            if (landmarks && uploadedImage) {
                drawPalmThumbWithLines(uploadedImage, landmarks, pt);
            } else if (segResult && segResult.roi_image) {
                const roiImg = new Image();
                roiImg.onload = () => {
                    const ctx = palmThumbCanvas.getContext('2d');
                    const dpr = window.devicePixelRatio || 2;
                    const displayPx = 104;
                    const cw = Math.round(displayPx * dpr), ch = Math.round(displayPx * dpr);
                    palmThumbCanvas.width = cw;
                    palmThumbCanvas.height = ch;
                    palmThumbCanvas.style.width = displayPx + 'px';
                    palmThumbCanvas.style.height = displayPx + 'px';
                    const rw = roiImg.naturalWidth, rh = roiImg.naturalHeight;
                    ctx.drawImage(roiImg, 0, 0, rw, rh, 0, 0, cw, ch);
                };
                roiImg.src = segResult.roi_image;
            } else if (uploadedImage) {
                drawPalmThumbWithLines(uploadedImage, null, pt);
            }

            keywordsGrid.innerHTML = reading.keywords.map((kw) =>
                `<div class="keyword-item">
                    <div class="keyword-icon keyword-orbit" aria-hidden="true"></div>
                    <span class="keyword-label">${kw}</span>
                </div>`
            ).join('');

            const lines = [
                { name: '感情线', desc: reading.heartDesc },
                { name: '头脑线', desc: reading.headDesc },
                { name: '命运线', desc: reading.fateDesc }
            ];
            linesSection.innerHTML = lines.map(l =>
                `<div class="line-row">
                    <span class="line-name">${l.name}</span>
                    <span class="line-desc">${l.desc}</span>
                </div>`
            ).join('');

            reading.traits.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'trait-card';
                card.innerHTML = `
                    <div class="trait-icon">${item.icon}</div>
                    <div>
                        <div class="trait-title">${item.title}</div>
                        <div class="trait-desc">${item.desc}</div>
                    </div>`;
                traitsContainer.appendChild(card);
                setTimeout(() => card.classList.add('visible'), 80 + index * 120);
            });
        }

        document.getElementById('shareBtn').addEventListener('click', () => {
            if (navigator.share) {
                navigator.share({ title: '手相解码', text: '我刚完成了手相解码分析！', url: location.href }).catch(() => {});
            } else {
                alert('报告已保存！长按图片即可分享给好友');
            }
        });

        app.classList.add('home-active');
    </script>
