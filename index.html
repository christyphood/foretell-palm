<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>手相解码</title>
    <style>
        @font-face {
            font-family: 'MFSongHe';
            src: url('fonts/MFSongHe-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'MFSongHe', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'PingFang TC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(197deg, #EEDFBA 5.46%, #EFDCD0 71.37%);
            min-height: 100vh;
            overflow: hidden;
        }
        .app { max-width: 414px; margin: 0 auto; height: 100vh; position: relative; display: flex; flex-direction: column; }
        .app.home-active {
            background: #faf8f6;
        }
        .app.camera-active,
        .app.scan-active {
            background: #EEF2FA;
            color: #000000;
        }
        /* 识别页：苹方；标题粗体放大，其余 Regular */
        .app.camera-active,
        .app.scan-active {
            font-family: 'PingFang SC', 'PingFang TC', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Microsoft YaHei', sans-serif;
        }
        .app.camera-active .header h1,
        .app.scan-active .header h1 {
            font-family: 'PingFang SC', 'PingFang TC', -apple-system, BlinkMacSystemFont, sans-serif;
            font-weight: 700;
            font-size: 32px;
            line-height: 1.15;
            letter-spacing: 0;
            color: #000000;
        }
        .app.camera-active .header p,
        .app.scan-active .header p,
        .app.camera-active .camera-hint,
        .app.camera-active .upload-text,
        .app.camera-active .camera-placeholder-text,
        .app.scan-active .scan-text {
            font-family: 'PingFang SC', 'PingFang TC', -apple-system, BlinkMacSystemFont, sans-serif;
            font-weight: 400;
            color: #000000;
        }
        .app.camera-active .header p,
        .app.scan-active .header p {
            font-size: 14px;
            line-height: 1.45;
        }
        .app.camera-active .camera-hint {
            font-size: 18px;
            line-height: 1.5;
        }
        .app.camera-active .upload-text {
            font-size: 16px;
        }
        .app.camera-active .camera-placeholder-text {
            font-size: 14px;
        }
        .app.scan-active .scan-text {
            font-size: 16px;
            line-height: 1.5;
        }
        .app.camera-active .close-btn,
        .app.scan-active .close-btn {
            background: rgba(255, 255, 255, 0.85);
            border-color: rgba(0, 0, 0, 0.1);
            color: #000000;
        }
        .app.camera-active .upload-icon,
        .app.camera-active .camera-placeholder {
            color: #000000;
        }
        /* 拍照 / 识别：顶栏浮在渐变上，与内容区共用 app 背景，减轻顶部分割感 */
        .app.camera-active .header,
        .app.scan-active .header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 30;
            background: transparent;
            pointer-events: none;
            padding-top: max(52px, calc(env(safe-area-inset-top, 0px) + 36px));
            padding-left: 24px;
            padding-right: 24px;
            padding-bottom: 10px;
        }
        .app.camera-active .header > div,
        .app.camera-active .header .close-btn,
        .app.scan-active .header > div,
        .app.scan-active .header .close-btn {
            pointer-events: auto;
        }
        .app.camera-active .section-camera,
        .app.scan-active .section-scan {
            background: transparent;
            padding-top: max(118px, calc(env(safe-area-inset-top, 0px) + 102px));
        }
        .app.camera-active .camera-container {
            margin-top: 4px;
        }
        .app.scan-active .scan-box {
            margin-top: 4px;
        }
        .app.result-active {
            background: #F5F5F9;
            font-family: 'PingFang SC', 'PingFang TC', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Microsoft YaHei', sans-serif;
        }
        .app.result-active .poster-title,
        .app.result-active .result-panel-tag,
        .app.result-active .result-detail-label,
        .app.result-active .trait-title {
            font-family: 'PingFang SC', 'PingFang TC', -apple-system, BlinkMacSystemFont, sans-serif;
            font-weight: 700;
        }
        .app.result-active .poster-title:not(.poster-title--semibold) {
            font-weight: 900;
        }
        .app.result-active .poster-title.poster-title--semibold {
            font-weight: 600;
        }
        .app.result-active .poster-subtitle,
        .app.result-active .poster-label,
        .app.result-active .result-panel-card,
        .app.result-active .result-detail-text,
        .app.result-active .trait-desc,
        .app.result-active .keyword-pill,
        .app.result-active .disclaimer,
        .app.result-active .share-btn {
            font-family: 'PingFang SC', 'PingFang TC', -apple-system, BlinkMacSystemFont, sans-serif;
            font-weight: 400;
        }
        .app.result-active .header h1 { color: #000; }
        .app.result-active .header p { color: rgba(0,0,0,0.7); }
        .app.result-active .header > div:first-of-type {
            display: none;
        }
        .app.result-active .header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 30;
            background: transparent;
            pointer-events: none;
            justify-content: flex-end;
            align-items: flex-start;
            padding-top: max(48px, calc(env(safe-area-inset-top, 0px) + 36px));
            padding-left: 20px;
            padding-right: 20px;
            padding-bottom: 0;
        }
        .app.result-active .header .close-btn {
            pointer-events: auto;
        }
        .app.result-active .close-btn {
            background: rgba(255,255,255,0.7);
            border-color: rgba(0,0,0,0.08);
            color: #000;
        }
        .app.home-active .header {
            opacity: 0;
            pointer-events: none;
            transform: translateY(-8px);
            position: absolute;
            inset: 0 0 auto 0;
            z-index: 1;
        }
        .app.home-active .sections-wrap {
            height: 100vh;
        }

        .header {
            padding: 60px 24px 20px;
            display: flex; justify-content: space-between; align-items: flex-start;
            flex-shrink: 0; position: relative; z-index: 10;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }
        .header h1 { font-size: 21px; font-weight: 700; color: #000; line-height: 1.2; margin-bottom: 4px; }
        .header p { font-size: 11px; color: #4a4a4a; }
        .close-btn {
            width: 34px; height: 34px; border-radius: 50%;
            background: rgba(255,255,255,0.55);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            border: 1.7px solid rgba(255,255,255,0.1);
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            transition: transform 0.2s;
        }
        .close-btn:active { transform: scale(0.92); }

        .sections-wrap {
            flex: 1; position: relative; overflow: hidden;
        }

        .section {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            opacity: 0;
            pointer-events: none;
        }
        .section.active {
            opacity: 1;
            pointer-events: auto;
        }
        .section.exiting {
            opacity: 0;
            pointer-events: none;
        }

        /* ===== HOME ===== */
        .section-home {
            position: relative;
            min-height: 100vh;
            background-color: #faf8f6;
            background-image: url('images/home-bg.png');
            background-repeat: no-repeat;
            background-position: center top;
            background-size: cover;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .section-home:active {
            opacity: 0.98;
        }
        .home-bg {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        /* ===== CAMERA ===== */
        .section-camera {
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            background: transparent;
        }
        .camera-container {
            position: relative;
            width: 100%; aspect-ratio: 674 / 982;
            margin: 14px auto 0;
            background: rgba(255,255,255,0.46);
            backdrop-filter: blur(7.8px); -webkit-backdrop-filter: blur(7.8px);
            border: 1px solid #e3ceee;
            border-radius: 20px; overflow: hidden;
        }
        .camera-video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; background: #000;
        }
        .camera-video.front-camera { transform: scaleX(-1); }
        .camera-placeholder {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #4a4a4a; z-index: 1;
        }
        .camera-placeholder-icon { width: 48px; height: 48px; margin-bottom: 12px; opacity: 0.5; }
        .camera-placeholder-text { font-size: 14px; opacity: 0.7; }
        .camera-frame {
            position: absolute; top: 8%; left: 8%; right: 8%; bottom: 8%;
            border: 2px dashed rgba(58,42,26,0.2);
            border-radius: 16px; pointer-events: none; z-index: 3;
        }
        .hand-guide {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 72%; max-width: 280px; height: auto; pointer-events: none; z-index: 2;
            object-fit: contain;
            opacity: 0.55;
            transition: opacity 0.3s ease;
        }
        .hand-guide.detected { opacity: 0.12; }
        .detection-status {
            position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
            padding: 8px 16px; background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            border-radius: 20px; font-size: 12px; color: white; z-index: 10;
            opacity: 0; transition: opacity 0.25s; white-space: nowrap;
        }
        .detection-status.visible { opacity: 1; }
        .detection-status.success { background: rgba(76,175,80,0.85); }
        .camera-hint {
            text-align: center; margin-top: 24px;
            font-size: 18px; color: #000000; line-height: 1.5;
        }
        .upload-section {
            display: flex; align-items: center; justify-content: center;
            gap: 8px; margin-top: 20px; cursor: pointer; padding: 12px;
        }
        .upload-section:active { opacity: 0.7; }
        .upload-text { font-size: 16px; color: #000000; }
        .upload-icon { width: 18px; height: 18px; color: #000000; }
        #fileInput { display: none; }

        /* ===== SCAN ===== */
        .section-scan {
            padding: 0 20px;
            background: transparent;
        }
        .scan-box {
            position: relative; width: 100%; aspect-ratio: 674 / 982;
            margin: 10px auto 0;
            background: rgba(255,255,255,0.46);
            backdrop-filter: blur(7.8px); -webkit-backdrop-filter: blur(7.8px);
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 20px; overflow: hidden;
        }
        .scan-box img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        .scan-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
        .scan-grid {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(201,169,110,0.12) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(201,169,110,0.12) 1px, transparent 1px);
            background-size: 25% 25%;
        }
        .scan-line {
            position: absolute; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, transparent, #C9A96E, transparent);
            animation: scanMove 2.5s ease-in-out infinite;
            box-shadow: 0 0 20px rgba(201,169,110,0.6);
        }
        @keyframes scanMove { 0% { top: 0; } 50% { top: 95%; } 100% { top: 0; } }
        .scan-dots { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
        .scan-dot {
            position: absolute; width: 12px; height: 12px; border-radius: 50%;
            background: #FFD700; animation: dotPulse 1.5s ease-in-out infinite;
            box-shadow: 0 0 8px rgba(255,215,0,0.6);
        }
        .scan-dot:nth-child(1) { top: 35%; left: 40%; }
        .scan-dot:nth-child(2) { top: 40%; left: 60%; animation-delay: .3s; }
        .scan-dot:nth-child(3) { top: 55%; left: 35%; animation-delay: .6s; }
        .scan-dot:nth-child(4) { top: 60%; left: 55%; animation-delay: .9s; }
        .scan-dot:nth-child(5) { top: 70%; left: 45%; animation-delay: 1.2s; }
        @keyframes dotPulse { 0%,100% { transform: scale(1); opacity: .8; } 50% { transform: scale(1.5); opacity: 1; } }
        .scan-progress { margin-top: 20px; text-align: center; }
        .scan-text { font-size: 16px; color: #000000; margin-bottom: 12px; }
        .progress-bar { width: 80%; height: 4px; background: #E8DED0; border-radius: 2px; margin: 0 auto; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #C9A96E, #FFD700); border-radius: 2px; width: 0%; transition: width 0.3s ease; }

        /* ===== RESULT ===== */
        .app.result-active .section-result {
            background: transparent;
        }
        .section-result {
            padding: 0;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            background: #F5F5F9;
        }
        .app.result-active .result-scroll {
            padding: 0;
        }
        .result-scroll { padding: 0; }

        /* --- Poster (full-viewport hero, coded background) --- */
        .result-poster {
            position: relative;
            isolation: isolate;
            min-height: 100vh;
            min-height: 100dvh;
            background: #F5F5F9;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: max(52px, calc(env(safe-area-inset-top, 0px) + 36px)) 24px 28px;
            overflow: hidden;
        }
        .result-poster > :not(.poster-bg) {
            position: relative;
            z-index: 1;
        }
        .poster-bg {
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .poster-bg-blob {
            position: absolute;
            left: 50%;
            top: 46%;
            width: min(92%, 360px);
            height: 62%;
            transform: translate(-50%, -50%) rotate(-5deg);
            background: rgba(210, 224, 248, 0.72);
            border-radius: 52% 48% 55% 45% / 48% 52% 46% 54%;
            box-shadow: 0 0 80px rgba(200, 218, 245, 0.35);
        }
        .poster-bg-dots {
            position: absolute;
            background-image: radial-gradient(circle, rgba(230, 150, 175, 0.55) 1.25px, transparent 1.25px);
            background-size: 11px 11px;
            opacity: 0.85;
        }
        .poster-bg-dots--tl {
            left: 4%;
            top: 30%;
            width: 32%;
            height: 26%;
            mask-image: radial-gradient(ellipse 85% 80% at 65% 55%, #000 25%, transparent 72%);
            -webkit-mask-image: radial-gradient(ellipse 85% 80% at 65% 55%, #000 25%, transparent 72%);
        }
        .poster-bg-dots--br {
            right: 2%;
            bottom: 34%;
            width: 34%;
            height: 28%;
            mask-image: radial-gradient(ellipse 80% 75% at 40% 50%, #000 20%, transparent 70%);
            -webkit-mask-image: radial-gradient(ellipse 80% 75% at 40% 50%, #000 20%, transparent 70%);
        }
        .poster-bg-art {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }
        .poster-bg-grain {
            position: absolute;
            inset: 0;
            opacity: 0.35;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.08'/%3E%3C/svg%3E");
            mix-blend-mode: multiply;
        }
        .poster-tag {
            align-self: flex-start;
            display: block;
            width: auto;
            height: 64px;
            margin-bottom: 10px;
            object-fit: contain;
            object-position: left center;
        }
        .poster-headline {
            width: 100%;
            text-align: center;
            margin-bottom: 12px;
        }
        .poster-title {
            font-size: clamp(48px, 14vw, 65px);
            font-weight: 900;
            color: #000;
            line-height: 1.15;
            letter-spacing: 0.02em;
            margin: 0 0 14px;
            text-align: center;
        }
        .poster-subtitle {
            text-align: center;
            font-size: 16px;
            color: #000;
            margin: 0;
            line-height: 1.45;
        }
        .poster-hand-wrap {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 0;
        }
        .poster-hand-img {
            width: 82%;
            max-width: 320px;
            height: auto;
            object-fit: contain;
            display: block;
            filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.12));
        }
        .poster-title--semibold {
            font-weight: 600;
        }
        .poster-label {
            position: absolute;
            background: #fff;
            border: 1px solid #000;
            padding: 6px 10px;
            font-size: 13px;
            color: #000;
            text-align: center;
            line-height: 1.2;
            width: auto;
            max-width: 80px;
            white-space: pre-line;
        }
        .poster-label--1 { top: 18%; left: 6%; transform: rotate(0deg); }
        .poster-label--2 { bottom: 28%; right: 4%; transform: rotate(30deg); }
        .poster-label--3 { bottom: 12%; left: 22%; transform: rotate(-14deg); }

        /* --- Reading summary at bottom of poster --- */
        .poster-reading {
            width: 100%;
            margin-top: auto;
            padding-top: 28px;
            margin-bottom: 0;
        }
        .result-panel-card,
        .poster-reading-card {
            position: relative;
            background: #fff;
            border-radius: 10px;
            padding: 34px 18px 18px;
            font-size: 15px;
            color: #000;
            line-height: 1.5;
        }
        #posterReadingText {
            line-height: 1.5;
            word-break: break-all;
        }
        .result-detail-text {
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
            overflow: hidden;
        }
        .result-panel-tag,
        .poster-reading-tag {
            position: absolute;
            left: 16px;
            top: 0;
            transform: translateY(-42%);
            display: inline-block;
            background: #e9edf9;
            border-radius: 6px;
            padding: 6px 14px;
            font-size: 16px;
            font-weight: 700;
            color: #000;
            margin: 0;
            z-index: 1;
        }
        .result-panel {
            width: 100%;
            padding-top: 14px;
            margin-bottom: 24px;
        }
        .result-panel:last-of-type {
            margin-bottom: 8px;
        }

        /* --- Content below poster --- */
        .result-content {
            padding: 0 20px 40px;
            background: #F5F5F9;
        }
        .result-content > .result-panel:first-child {
            padding-top: 6px;
            margin-bottom: 20px;
        }
        .result-panel-keywords-body {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }
        .palm-thumb-inline {
            flex-shrink: 0;
            width: 120px;
            height: 120px;
            border-radius: 12px;
            display: block;
            background: #111;
        }
        .keywords-grid {
            display: flex;
            width: 100%;
            gap: 8px;
            justify-content: center;
            align-items: stretch;
        }
        .keyword-pill {
            flex: 1;
            min-width: 0;
            padding: 10px 6px;
            border-radius: 999px;
            background: #ebebeb;
            font-size: 14px;
            color: #000;
            text-align: center;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .result-detail-item {
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }
        .result-detail-item + .result-detail-item {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid rgba(0, 0, 0, 0.06);
        }
        .result-detail-body {
            flex: 1;
            min-width: 0;
        }
        .result-detail-label {
            font-size: 15px;
            font-weight: 700;
            color: #000;
            margin-bottom: 6px;
        }
        .result-detail-text {
            font-size: 15px;
            color: #000;
            line-height: 1.5;
            margin: 0;
        }
        .traits-list {
            display: flex;
            flex-direction: column;
        }
        .trait-item {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            padding: 14px 0;
            opacity: 0;
            transform: translateY(12px);
            transition: opacity 0.35s ease, transform 0.35s ease;
        }
        .trait-item:first-child { padding-top: 0; }
        .trait-item:last-child { padding-bottom: 0; }
        .trait-item + .trait-item {
            border-top: 1px solid rgba(0, 0, 0, 0.06);
        }
        .trait-item.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .trait-icon,
        .result-detail-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: #f0f3fa;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }
        .trait-title {
            font-size: 15px;
            font-weight: 700;
            color: #000;
            margin-bottom: 6px;
        }
        .trait-desc {
            font-size: 15px;
            color: #000;
            line-height: 1.5;
        }
        .share-section {
            margin-top: 8px;
            text-align: center;
            padding-bottom: 24px;
        }
        .share-btn {
            width: 100%;
            padding: 14px 16px;
            border-radius: 10px;
            background: #fff;
            border: 1px solid rgba(0, 0, 0, 0.08);
            color: #000;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .share-btn:active { transform: scale(0.98); opacity: 0.85; }
        .disclaimer {
            margin-top: 12px;
            font-size: 12px;
            color: rgba(0, 0, 0, 0.4);
            line-height: 1.5;
        }

        /* ===== PALM HERO GRAPHIC (unused in dark result layout) ===== */
        .palm-hero {
            display: none;
            position: relative;
            margin: 24px 0;
            border-radius: 24px;
            overflow: hidden;
            opacity: 0; transform: translateY(20px);
            transition: opacity 0.6s ease 0.3s, transform 0.6s ease 0.3s;
        }
        .palm-hero.visible { opacity: 1; transform: translateY(0); }

        .palm-hero-inner {
            position: relative;
            padding: 32px 20px 28px;
            background: rgba(255,255,255,0.35);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.4);
            border-radius: 24px;
            text-align: center;
            overflow: hidden;
        }

        .palm-hero-glow {
            position: absolute; top: 50%; left: 50%;
            width: 200px; height: 200px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.5;
            pointer-events: none;
            animation: glowPulse 4s ease-in-out infinite;
        }
        @keyframes glowPulse {
            0%, 100% { opacity: 0.35; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 0.55; transform: translate(-50%, -50%) scale(1.15); }
        }

        .palm-hero-svg-wrap {
            position: relative;
            width: 180px; height: 180px;
            margin: 0 auto 20px;
            z-index: 1;
        }
        .palm-hero-svg-wrap svg {
            width: 100%; height: 100%;
            filter: drop-shadow(0 0 12px var(--hero-glow-color, rgba(192,214,232,0.4)));
        }

        .palm-hero-label {
            position: relative; z-index: 1;
            font-size: 20px; font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 6px;
        }
        .palm-hero-sub {
            position: relative; z-index: 1;
            font-size: 12px; opacity: 0.7;
            letter-spacing: 1px;
        }

        /* --- Philosopher (long) --- */
        .palm-hero.type-long { --hero-glow-color: rgba(180, 210, 240, 0.5); }
        .palm-hero.type-long .palm-hero-inner {
            background: linear-gradient(160deg, rgba(230,240,252,0.45) 0%, rgba(210,225,245,0.3) 100%);
            border-color: rgba(200,220,245,0.5);
        }
        .palm-hero.type-long .palm-hero-glow {
            background: radial-gradient(circle, rgba(180,210,245,0.7), rgba(200,180,240,0.3), transparent);
        }
        .palm-hero.type-long .palm-hero-label { color: #4A6A8A; }
        .palm-hero.type-long .palm-hero-sub { color: #6A8AAA; }

        /* --- Practical (square) --- */
        .palm-hero.type-square { --hero-glow-color: rgba(210, 180, 140, 0.5); }
        .palm-hero.type-square .palm-hero-inner {
            background: linear-gradient(160deg, rgba(250,240,225,0.45) 0%, rgba(240,225,200,0.3) 100%);
            border-color: rgba(220,200,170,0.5);
        }
        .palm-hero.type-square .palm-hero-glow {
            background: radial-gradient(circle, rgba(220,190,140,0.7), rgba(200,170,120,0.3), transparent);
        }
        .palm-hero.type-square .palm-hero-label { color: #8A6A3A; }
        .palm-hero.type-square .palm-hero-sub { color: #A08050; }

        /* --- Balanced --- */
        .palm-hero.type-balanced { --hero-glow-color: rgba(190, 210, 190, 0.5); }
        .palm-hero.type-balanced .palm-hero-inner {
            background: linear-gradient(160deg, rgba(235,245,235,0.45) 0%, rgba(225,240,235,0.3) 100%);
            border-color: rgba(200,225,210,0.5);
        }
        .palm-hero.type-balanced .palm-hero-glow {
            background: radial-gradient(circle, rgba(170,210,180,0.7), rgba(200,220,190,0.3), transparent);
        }
        .palm-hero.type-balanced .palm-hero-label { color: #4A7A5A; }
        .palm-hero.type-balanced .palm-hero-sub { color: #6A9A7A; }

        /* SVG animation keyframes */
        @keyframes heroSpin { to { transform: rotate(360deg); } }
        @keyframes heroSpinReverse { to { transform: rotate(-360deg); } }
        @keyframes heroBreathe {
            0%, 100% { transform: scale(1); opacity: 0.85; }
            50% { transform: scale(1.04); opacity: 1; }
        }
        @keyframes heroFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        @keyframes heroWave {
            0% { d: path("M20,100 C50,85 80,115 110,100 C140,85 170,115 200,100"); }
            50% { d: path("M20,100 C50,115 80,85 110,100 C140,115 170,85 200,100"); }
            100% { d: path("M20,100 C50,85 80,115 110,100 C140,85 170,115 200,100"); }
        }
        @keyframes heroWave2 {
            0% { d: path("M10,110 C45,125 75,95 110,110 C145,125 175,95 210,110"); }
            50% { d: path("M10,110 C45,95 75,125 110,110 C145,95 175,125 210,110"); }
            100% { d: path("M10,110 C45,125 75,95 110,110 C145,125 175,95 210,110"); }
        }
        @keyframes heroWave3 {
            0% { d: path("M0,120 C40,105 70,135 110,120 C150,105 180,135 220,120"); }
            50% { d: path("M0,120 C40,135 70,105 110,120 C150,135 180,105 220,120"); }
            100% { d: path("M0,120 C40,105 70,135 110,120 C150,105 180,135 220,120"); }
        }
        @keyframes heroDotOrbit {
            0% { transform: rotate(0deg) translateX(58px) rotate(0deg); opacity: 0.6; }
            50% { opacity: 1; }
            100% { transform: rotate(360deg) translateX(58px) rotate(-360deg); opacity: 0.6; }
        }
        @keyframes centerPulse {
            0%, 100% { r: 3; opacity: 0.5; }
            50% { r: 5; opacity: 0.9; }
        }
    </style>
</head>
<body>

    <script type="module">
        // ==========================================
        // DOM refs
        // ==========================================
        const sectionHome = document.getElementById('sectionHome');
        const sectionCamera = document.getElementById('sectionCamera');
        const sectionScan = document.getElementById('sectionScan');
        const sectionResult = document.getElementById('sectionResult');
        const sections = [sectionHome, sectionCamera, sectionScan, sectionResult];
        const app = document.querySelector('.app');

        const closeBtn = document.getElementById('closeBtn');
        const cameraVideo = document.getElementById('cameraVideo');
        const cameraPlaceholder = document.getElementById('cameraPlaceholder');
        const handGuide = document.getElementById('handGuide');
        const detectionStatus = document.getElementById('detectionStatus');
        const uploadSection = document.getElementById('uploadSection');
        const fileInput = document.getElementById('fileInput');

        const scanImage = document.getElementById('scanImage');
        const scanText = document.getElementById('scanText');
        const progressFill = document.getElementById('progressFill');

        const palmThumbCanvas = document.getElementById('palmThumbCanvas');
        const keywordsGrid = document.getElementById('keywordsGrid');
        const linesSection = document.getElementById('linesSection');
        const traitsContainer = document.getElementById('traitsContainer');
        const resultHeroImg = document.getElementById('resultHeroImg');
        const posterTitle = document.getElementById('posterTitle');
        const posterSubtitle = document.getElementById('posterSubtitle');
        const posterLabel1 = document.getElementById('posterLabel1');
        const posterLabel2 = document.getElementById('posterLabel2');
        const posterLabel3 = document.getElementById('posterLabel3');
        const posterReadingText = document.getElementById('posterReadingText');

        // ==========================================
        // Section transition
        // ==========================================
        let currentSection = sectionHome;

        function switchTo(target) {
            if (target === currentSection) return;
            const prev = currentSection;
            currentSection = target;

            prev.classList.remove('active');
            prev.classList.add('exiting');

            void target.offsetWidth;
            target.classList.remove('exiting');
            target.classList.add('active');

            setTimeout(() => prev.classList.remove('exiting'), 0);

            if (target === sectionHome) app.classList.add('home-active');
            else app.classList.remove('home-active');
            if (target === sectionCamera) app.classList.add('camera-active');
            else app.classList.remove('camera-active');
            if (target === sectionScan) app.classList.add('scan-active');
            else app.classList.remove('scan-active');
            if (target === sectionResult) app.classList.add('result-active');
            else app.classList.remove('result-active');
        }

        // ==========================================
        // Camera state
        // ==========================================
        let stream = null;
        let cameraHandLandmarker = null;
        let isDetecting = false;
        let palmDetectedCount = 0;
        let isFrontCamera = false;
        let lastPalmCenter = null;
        const DETECTION_THRESHOLD = 18;
        const STABILITY_THRESHOLD = 0.015;

        let uploadedImage = null;
        let handLandmarkerInstance = null;

        // ==========================================
        // Navigation handlers
        // ==========================================
        function goToRecognition() {
            if (currentSection !== sectionHome) return;
            switchTo(sectionCamera);
            initCamera();
        }

        sectionHome.addEventListener('click', goToRecognition);
        sectionHome.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                goToRecognition();
            }
        });

        closeBtn.addEventListener('click', () => {
            stopCamera();
            if (currentSection !== sectionHome) {
                switchTo(sectionHome);
                resetState();
            } else {
                history.back();
            }
        });

        uploadSection.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) processUploadedFile(file);
        });

        function resetState() {
            palmDetectedCount = 0;
            lastPalmCenter = null;
            isDetecting = false;
            progressFill.style.width = '0%';
            scanText.textContent = '正在分析掌纹...';
            traitsContainer.innerHTML = '';
            keywordsGrid.innerHTML = '';
            linesSection.innerHTML = '';
            if (posterTitle) posterTitle.textContent = '';
            if (posterSubtitle) posterSubtitle.textContent = '';
            if (posterLabel1) posterLabel1.textContent = '';
            if (posterLabel2) posterLabel2.textContent = '';
            if (posterLabel3) posterLabel3.textContent = '';
            if (posterReadingText) posterReadingText.textContent = '';
            document.getElementById('palmHero').classList.remove('visible');
            document.getElementById('palmHeroSvg').innerHTML = '';
            handGuide.classList.remove('detected');
            detectionStatus.classList.remove('visible', 'success');
            cameraPlaceholder.style.display = 'flex';
            cameraPlaceholder.querySelector('.camera-placeholder-text').textContent = '正在启动相机...';
        }

        // ==========================================
        // Camera
        // ==========================================
        async function initCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1440 } },
                    audio: false
                });
                const track = stream.getVideoTracks()[0];
                const settings = track.getSettings();
                isFrontCamera = settings.facingMode === 'user';
                if (isFrontCamera) cameraVideo.classList.add('front-camera');
                else cameraVideo.classList.remove('front-camera');

                cameraVideo.srcObject = stream;
                cameraVideo.onloadedmetadata = () => {
                    cameraPlaceholder.style.display = 'none';
                    initCameraHandDetection();
                };
            } catch (err) {
                console.error('Camera error:', err);
                try {
                    stream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: 'user', width: { ideal: 1920 }, height: { ideal: 1440 } },
                        audio: false
                    });
                    isFrontCamera = true;
                    cameraVideo.classList.add('front-camera');
                    cameraVideo.srcObject = stream;
                    cameraVideo.onloadedmetadata = () => {
                        cameraPlaceholder.style.display = 'none';
                        initCameraHandDetection();
                    };
                } catch (fallbackErr) {
                    console.error('Fallback camera error:', fallbackErr);
                    cameraPlaceholder.querySelector('.camera-placeholder-text').textContent = '无法访问相机，请上传图片';
                }
            }
        }

        async function initCameraHandDetection() {
            try {
                const { HandLandmarker, FilesetResolver } = await import(
                    'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm'
                );
                const fileset = await FilesetResolver.forVisionTasks(
                    'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
                );
                cameraHandLandmarker = await HandLandmarker.createFromOptions(fileset, {
                    baseOptions: {
                        modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
                        delegate: 'GPU'
                    },
                    runningMode: 'VIDEO',
                    numHands: 1
                });
                isDetecting = true;
                palmDetectedCount = 0;
                lastPalmCenter = null;
                detectLoop();
            } catch (err) {
                console.warn('Hand detection init failed:', err);
            }
        }

        function detectLoop() {
            if (!isDetecting || !cameraHandLandmarker || !cameraVideo.videoWidth) {
                if (isDetecting) requestAnimationFrame(detectLoop);
                return;
            }
            try {
                const result = cameraHandLandmarker.detectForVideo(cameraVideo, performance.now());
                if (result.landmarks && result.landmarks.length > 0) {
                    const landmarks = result.landmarks[0];
                    if (isPalmOpen(landmarks)) {
                        const palmCenter = getPalmCenter(landmarks);
                        const isStable = isPalmStable(palmCenter);
                        lastPalmCenter = palmCenter;
                        if (isStable) {
                            palmDetectedCount++;
                            handGuide.classList.add('detected');
                            detectionStatus.textContent = `手掌已识别，保持不动 (${palmDetectedCount}/${DETECTION_THRESHOLD})`;
                            detectionStatus.classList.add('visible', 'success');
                            if (palmDetectedCount >= DETECTION_THRESHOLD) {
                                captureAndProcess();
                                return;
                            }
                        } else {
                            palmDetectedCount = Math.max(0, palmDetectedCount - 2);
                            handGuide.classList.add('detected');
                            detectionStatus.textContent = '请保持手掌稳定';
                            detectionStatus.classList.add('visible');
                            detectionStatus.classList.remove('success');
                        }
                    } else {
                        palmDetectedCount = Math.max(0, palmDetectedCount - 1);
                        lastPalmCenter = null;
                        handGuide.classList.remove('detected');
                        detectionStatus.textContent = '请张开手掌';
                        detectionStatus.classList.add('visible');
                        detectionStatus.classList.remove('success');
                    }
                } else {
                    palmDetectedCount = Math.max(0, palmDetectedCount - 1);
                    lastPalmCenter = null;
                    handGuide.classList.remove('detected');
                    detectionStatus.textContent = '未检测到手掌';
                    detectionStatus.classList.add('visible');
                    detectionStatus.classList.remove('success');
                }
            } catch (err) { console.warn('Detection error:', err); }
            requestAnimationFrame(detectLoop);
        }

        function getPalmCenter(landmarks) {
            const w = landmarks[0], m = landmarks[9], i = landmarks[5], p = landmarks[17];
            return { x: (w.x + m.x + i.x + p.x) / 4, y: (w.y + m.y + i.y + p.y) / 4 };
        }

        function isPalmStable(currentCenter) {
            if (!lastPalmCenter) return true;
            const dx = currentCenter.x - lastPalmCenter.x;
            const dy = currentCenter.y - lastPalmCenter.y;
            return Math.sqrt(dx * dx + dy * dy) < STABILITY_THRESHOLD;
        }

        function isPalmOpen(landmarks) {
            if (!landmarks || landmarks.length < 21) return false;
            const wrist = landmarks[0], middleMcp = landmarks[9];
            const palmToMiddle = Math.hypot(middleMcp.x - wrist.x, middleMcp.y - wrist.y);
            const indexExtended = Math.hypot(landmarks[8].x - wrist.x, landmarks[8].y - wrist.y) > palmToMiddle * 1.3;
            const middleExtended = Math.hypot(landmarks[12].x - wrist.x, landmarks[12].y - wrist.y) > palmToMiddle * 1.3;
            const ringExtended = Math.hypot(landmarks[16].x - wrist.x, landmarks[16].y - wrist.y) > palmToMiddle * 1.3;
            const pinkyExtended = Math.hypot(landmarks[20].x - wrist.x, landmarks[20].y - wrist.y) > palmToMiddle * 1.2;
            const thumbExtended = Math.hypot(landmarks[4].x - landmarks[2].x, landmarks[4].y - landmarks[2].y) > palmToMiddle * 0.4;
            return [indexExtended, middleExtended, ringExtended, pinkyExtended, thumbExtended].filter(Boolean).length >= 4;
        }

        async function captureAndProcess() {
            isDetecting = false;
            detectionStatus.textContent = '已锁定，正在对焦...';
            detectionStatus.classList.add('visible', 'success');

            await new Promise(r => setTimeout(r, 800));

            const canvas = document.createElement('canvas');
            canvas.width = cameraVideo.videoWidth;
            canvas.height = cameraVideo.videoHeight;
            const ctx = canvas.getContext('2d');
            if (isFrontCamera) { ctx.translate(canvas.width, 0); ctx.scale(-1, 1); }
            ctx.drawImage(cameraVideo, 0, 0);

            const imageData = canvas.toDataURL('image/jpeg', 0.92);

            stopCamera();

            scanImage.src = imageData;
            uploadedImage = new Image();
            uploadedImage.onload = () => {
                switchTo(sectionScan);
                startScanProcess();
            };
            uploadedImage.src = imageData;
        }

        function processUploadedFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const imageData = e.target.result;
                stopCamera();
                scanImage.src = imageData;
                uploadedImage = new Image();
                uploadedImage.onload = () => {
                    switchTo(sectionScan);
                    startScanProcess();
                };
                uploadedImage.src = imageData;
            };
            reader.readAsDataURL(file);
        }

        function stopCamera() {
            isDetecting = false;
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
        }

        // ==========================================
        // API
        // ==========================================
        function getPalmApiBase() {
            const params = new URLSearchParams(location.search);
            let fromQuery = params.get('api');
            if (fromQuery) { try { fromQuery = decodeURIComponent(fromQuery.trim()); localStorage.setItem('palmApiBase', fromQuery); } catch (_) {} }
            if (!fromQuery && location.hash && location.hash.startsWith('#api=')) { try { fromQuery = decodeURIComponent(location.hash.slice(5).split('&')[0].trim()); if (fromQuery.startsWith('http')) localStorage.setItem('palmApiBase', fromQuery); } catch (_) {} }
            if (fromQuery) { try { const u = new URL(fromQuery); return u.origin + u.pathname.replace(/\/$/, ''); } catch (_) { return null; } }
            try { const saved = localStorage.getItem('palmApiBase'); if (saved) { const u = new URL(saved.trim()); return u.origin + u.pathname.replace(/\/$/, ''); } } catch (_) {}
            const { protocol, hostname, port } = location;
            const local = hostname === 'localhost' || hostname === '127.0.0.1';
            if (local && port === '5050') return '';
            if (protocol === 'file:') return 'http://127.0.0.1:5050';
            if (protocol === 'http:' && local) return 'http://127.0.0.1:5050';
            if (protocol === 'https:') return null;
            return 'http://127.0.0.1:5050';
        }

        function hasBackendResult(seg) {
            return seg && seg.success && !!(seg.features || seg.roi_image);
        }

        // ==========================================
        // MediaPipe IMAGE mode (for scan phase)
        // ==========================================
        async function detectHandLandmarks(imgEl) {
            if (!imgEl || !imgEl.naturalWidth) return null;
            if (!handLandmarkerInstance) {
                const { HandLandmarker, FilesetResolver } = await import(
                    'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm'
                );
                const fileset = await FilesetResolver.forVisionTasks(
                    'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
                );
                handLandmarkerInstance = await HandLandmarker.createFromOptions(fileset, {
                    baseOptions: {
                        modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
                        delegate: 'CPU'
                    },
                    runningMode: 'IMAGE',
                    numHands: 1
                });
            }
            const result = handLandmarkerInstance.detect(imgEl);
            const lm = result.landmarks && result.landmarks[0];
            if (!lm || lm.length < 21) return null;
            return lm.map(p => ({ x: p.x, y: p.y }));
        }

        // ==========================================
        // Scan process
        // ==========================================
        const scanTexts = [
            '加载手部关键点模型...', '检测 21 个手部关键点...',
            '旋转矫正图像...', '分割手部前景...',
            '定位掌心 ROI 区域...', '增强掌纹纹理...',
            '提取掌纹线条...', '分析感情线结构...',
            '分析头脑线结构...', '分析生命线结构...', '生成分析报告...'
        ];

        async function startScanProcess() {
            let progress = 0;
            progressFill.style.width = '0%';
            const progressInterval = setInterval(() => {
                progress = Math.min(progress + 1, 85);
                progressFill.style.width = progress + '%';
            }, 60);

            scanText.textContent = scanTexts[0];

            let segResult = null;
            const apiBase = getPalmApiBase();
            if (apiBase !== null) {
                try {
                    scanText.textContent = '正在调用 AI 掌纹识别...';
                    const canvas = document.createElement('canvas');
                    canvas.width = uploadedImage.naturalWidth;
                    canvas.height = uploadedImage.naturalHeight;
                    canvas.getContext('2d').drawImage(uploadedImage, 0, 0);
                    const b64 = canvas.toDataURL('image/jpeg', 0.85);
                    const resp = await fetch((apiBase || '') + '/analyze', {
                        method: 'POST', mode: 'cors', credentials: 'omit',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ image: b64 })
                    });
                    segResult = await resp.json();
                    if (!resp.ok) segResult = { ...segResult, success: false };
                } catch (e) { console.warn('[palm] API fail:', e); }
            }

            let landmarks = null;
            try {
                scanText.textContent = '检测手掌关键点...';
                landmarks = await detectHandLandmarks(uploadedImage);
                console.log('[palm] landmarks detected:', !!landmarks);
            } catch (e) { console.warn('[palm] hand detection fail:', e); }

            for (let i = 1; i < scanTexts.length; i++) {
                await new Promise(r => setTimeout(r, 400));
                scanText.textContent = scanTexts[i];
                progress = 30 + (i / scanTexts.length) * 70;
                progressFill.style.width = progress + '%';
            }

            clearInterval(progressInterval);
            progressFill.style.width = '100%';
            await new Promise(r => setTimeout(r, 400));

            showResult(segResult, landmarks);
        }

        // ==========================================
        // Palm analysis
        // ==========================================
        function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

        function analyzePalm(lm) {
            if (!lm || lm.length < 21) return null;
            const palmWidth = dist(lm[5], lm[17]);
            const palmHeight = dist(lm[0], lm[9]);
            const palmRatio = palmHeight / palmWidth;
            const indexLen = dist(lm[5], lm[6]) + dist(lm[6], lm[7]) + dist(lm[7], lm[8]);
            const middleLen = dist(lm[9], lm[10]) + dist(lm[10], lm[11]) + dist(lm[11], lm[12]);
            const ringLen = dist(lm[13], lm[14]) + dist(lm[14], lm[15]) + dist(lm[15], lm[16]);
            const pinkyLen = dist(lm[17], lm[18]) + dist(lm[18], lm[19]) + dist(lm[19], lm[20]);
            const thumbLen = dist(lm[1], lm[2]) + dist(lm[2], lm[3]) + dist(lm[3], lm[4]);
            const fingerTopalm = middleLen / palmHeight;
            const indexToRing = indexLen / ringLen;
            const pinkyToIndex = pinkyLen / indexLen;
            const thumbToIndex = thumbLen / indexLen;
            const heartY = (lm[5].y + lm[17].y) / 2;
            const headY = (lm[5].y + lm[0].y) * 0.45;
            const lifeArc = dist(lm[1], lm[0]);
            const seed = Math.round((palmRatio * 1000 + indexToRing * 1000 + pinkyToIndex * 1000 + fingerTopalm * 1000) % 100);
            const idxSpan = lm[12].x - lm[8].x;
            const heartEndT = Math.abs(idxSpan) > 1e-4 ? (lm[13].x - lm[8].x) / idxSpan : 0.5;
            const palmMidY = (lm[5].y + lm[17].y) / 2;
            const heartLift = (palmMidY - lm[13].y) / Math.max(palmHeight, 1e-6);
            const headIndep = dist(lm[2], lm[5]) / Math.max(palmWidth, 1e-6);
            const headSlump = (lm[13].y - (lm[5].y + lm[0].y) * 0.45) / Math.max(palmHeight, 1e-6);
            const fateVert = 1 - Math.min(1, Math.abs(lm[9].x - lm[0].x) / (palmWidth * 0.35 + 1e-6));
            return {
                palmRatio, fingerTopalm, indexToRing, pinkyToIndex, thumbToIndex, palmWidth, palmHeight,
                heartY, headY, lifeArc, seed, indexLen, middleLen, ringLen, pinkyLen, thumbLen,
                heartEndT, heartLift, headIndep, headSlump, fateVert
            };
        }

        /** 3 种结果手型（与视觉稿一致） */
        const PALM_ARCHETYPES = [
            {
                title: '抓钱不松手',
                titleSemibold: true,
                subtitle: '消费降级大师 / 铁公鸡ProMax',
                labels: ['只想搞钱', '消费陷阱\n绝缘体', '行走的\n计算器'],
                posterReading: '生命线弧度饱满，指缝严丝合缝，天然克制一切冲动消费，理财高手'
            },
            {
                title: '灵魂捕手',
                subtitle: '消费降级大师 / 铁公鸡ProMax',
                labels: ['洞察力', '理想主义', '创造力'],
                posterReading: '长宽比例1:41，修长型。主思辨和长线规划，直觉和抽象理解能力突出。'
            },
            {
                title: '禅意佛手',
                subtitle: '零内耗圣体 / 情绪北冰洋',
                labels: ['自动过滤\n情绪噪音', '拒绝内耗\n能量满格', '爱河不进\n焦虑不沾'],
                posterReading: '掌丘内敛分布，指节修长。天然免疫世俗焦虑与内耗 精神地基极度稳固。'
            }
        ];

        function pickArchetypeIndex(analysis) {
            if (!analysis) return 0;
            const a = analysis;
            const palmBucket = a.palmRatio > 1.15 ? 2 : a.palmRatio < 0.95 ? 0 : 1;
            const fingerBucket = a.fingerTopalm > 0.85 ? 1 : a.fingerTopalm < 0.7 ? 0 : 2;
            const n = a.seed * 17 + palmBucket * 11 + fingerBucket * 13
                + Math.round(a.heartEndT * 59) + Math.round(a.fateVert * 31)
                + Math.round(a.heartLift * 100) + (a.indexToRing > 1.02 ? 5 : 0) + (a.pinkyToIndex > 0.7 ? 9 : 0);
            return ((n % 3) + 3) % 3;
        }

        /** 联调：?archetype=0..2 或 #archetype=1 强制指定结果手型（覆盖算法） */
        function getArchetypeDebugIndex() {
            try {
                const p = new URLSearchParams(location.search);
                let v = p.get('archetype');
                if ((v == null || v === '') && location.hash && location.hash.startsWith('#archetype=')) {
                    v = decodeURIComponent(location.hash.slice('#archetype='.length).split('&')[0].trim());
                }
                if (v == null || v === '') return null;
                const n = parseInt(String(v).trim(), 10);
                if (!Number.isFinite(n) || n < 0 || n > 2) return null;
                return n;
            } catch (_) {
                return null;
            }
        }

        function resolveArchetypeIndex(analysis) {
            const dbg = getArchetypeDebugIndex();
            if (dbg !== null) return dbg;
            if (!analysis) return 0;
            return pickArchetypeIndex(analysis);
        }

        const READING_CHARS_PER_LINE = 34;

        function clampTwoLines(text, charsPerLine = READING_CHARS_PER_LINE) {
            const normalized = String(text).replace(/\s+/g, ' ').trim();
            const max = charsPerLine * 2;
            if (normalized.length <= max) return normalized;
            let slice = normalized.slice(0, max);
            const punct = Math.max(slice.lastIndexOf('。'), slice.lastIndexOf('，'), slice.lastIndexOf('；'));
            if (punct >= Math.floor(max * 0.55)) slice = slice.slice(0, punct + 1);
            else slice = slice.slice(0, max - 1) + '…';
            return slice;
        }

        function buildHeartDesc(a) {
            let t;
            if (a.heartEndT > 0.62) {
                t = '感情线上扬收向食指，重精神契合与承诺，热情不失分寸。';
            } else if (a.heartEndT < 0.38) {
                t = '感情线收向中指下，内敛稳健，投入深而表达克制。';
            } else {
                t = '感情线弧度均衡，热情与理智并存，关系更易长久。';
            }
            if (a.heartLift > 0.06) {
                t = '感情线略带上扬，重契合也保留新鲜感，关系有温度。';
            } else if (a.heartLift < -0.04) {
                t = '感情线走势偏平，情绪不外露，爱得稳而含蓄。';
            }
            return clampTwoLines(t);
        }

        function buildHeadDesc(a) {
            if (a.headIndep > 0.2 && a.fingerTopalm > 0.85) {
                return clampTwoLines('头脑线分流明显且延伸较长，独立思考强，联想与叙事感突出。');
            }
            if (a.headIndep > 0.2 && a.fingerTopalm < 0.7) {
                return clampTwoLines('头脑线分流明显且偏短直，决断利落，重结果与执行效率。');
            }
            if (a.headIndep > 0.2) {
                return clampTwoLines('头脑线与生命线分流明显，主独立思考，逻辑清晰不盲从。');
            }
            if (a.fingerTopalm > 0.85) {
                return clampTwoLines('头脑线贴近生命线但延伸较长，审慎中带创意，善发散也善落地。');
            }
            if (a.fingerTopalm < 0.7) {
                return clampTwoLines('头脑线偏短直，思维直接，习惯先想清楚再行动。');
            }
            return clampTwoLines('头脑线长度适中，逻辑与直觉均衡，擅长结构化解决问题。');
        }

        function buildFateDesc(a, segResult) {
            let t;
            if (a.fateVert > 0.55) {
                t = '命运线较直，目标感集中，适合在一两条主赛道持续深耕。';
            } else if (a.fateVert > 0.35) {
                t = '命运线略有偏侧，路径更灵活，机会常来自协作与跨界。';
            } else {
                t = '命运线较浅或发散，外在变数大，靠适应力与自选方向取胜。';
            }
            if (segResult && segResult.features != null) {
                const tail = typeof segResult.features === 'string' && segResult.features.trim()
                    ? segResult.features.trim().slice(0, 12)
                    : '';
                if (tail) t = clampTwoLines(`${t.replace(/。$/, '')}，${tail}。`);
            }
            return clampTwoLines(t);
        }

        function briefHeartLine(desc) {
            if (/内敛|克制|含蓄|稳而/.test(desc)) return '感情稳而深';
            if (/上扬|契合|热情|新鲜/.test(desc)) return '感情重契合';
            return '感情理性';

        function briefHeadLine(desc) {
            if (/创意|联想|叙事|发散/.test(desc)) return '思维偏创意';
            if (/决断|短直|执行|利落/.test(desc)) return '思维果断';
            if (/独立|清晰/.test(desc)) return '思维独立';
            if (/沉静|审慎/.test(desc)) return '思维沉静';
            return '思维务实';
        }

        function briefFateLine(desc) {
            if (/深耕|较直|集中|稳定/.test(desc)) return '运程求稳';
            if (/灵活|协作|跨界|偏侧/.test(desc)) return '运程灵活';
            return '运程多变';
        }

        /** 玄学解读：两行完整结论，无省略号，不写「关键词」 */
        function buildPosterSummary(archIdx, arch, heartDesc, headDesc, fateDesc) {
            const h = briefHeartLine(heartDesc);
            const hd = briefHeadLine(headDesc);
            const f = briefFateLine(fateDesc);
            const conclusions = [
                '只想搞钱、能守财、少冲动。',

        }

        function generateReading(analysis, segResult) {
            if (!analysis) return getDefaultReading();
            const a = analysis, s = a.seed;
            const palmType = a.palmRatio > 1.15 ? 'long' : a.palmRatio < 0.95 ? 'square' : 'balanced';
            const fingerType = a.fingerTopalm > 0.85 ? 'long' : a.fingerTopalm < 0.7 ? 'short' : 'medium';
            const archIdx = resolveArchetypeIndex(analysis);
            const arch = PALM_ARCHETYPES[archIdx];
            const personaMain = arch.title;
            const personaSub = arch.subtitle;
            const heroMain = arch.title;
            const kwPool = {
                long: { long: ['洞察力', '理想主义', '创造力'], medium: ['方向感', '直觉力', '深度'], short: ['内省力', '坚韧', '感受力'] },

            };
            const keywords = kwPool[palmType][fingerType] || ['方向感', '毅力', '创造力'];

            const ratioTxt = a.palmRatio.toFixed(2);
            const heartDesc = buildHeartDesc(a);

            const traits = [{ icon: '🖐', title: '掌型与比例', desc: palmShapeDesc }];
            traits.push({

            });
            if (a.indexToRing > 1.02) {

            } else if (a.pinkyToIndex > 0.7) {
                traits.push({ icon: '🗣️', title: '社交型人格', desc: '小指比例较长，主沟通与商业直觉，表达能力出色，善于察言观色和建立人际关系，在社交和商业场合如鱼得水。' });
            } else {
                traits.push({ icon: '🎯', title: '专注型人格', desc: '手指比例均衡紧凑，主专注与执行力，能够长时间沉浸在一件事中，精益求精，适合需要深度钻研的专业领域。' });
            }

                desc: s % 2 === 0 ? '你的感情线形态表明你对感情慢热但极其忠诚，一旦建立深度信任便会全力以赴，重视长期关系的稳定与成长。'
                    : '你的感情线形态表明你情感表达直接而真诚，容易被新鲜事物和有趣的灵魂吸引，在关系中追求激情与精神共鸣并存。'
            });

                { icon: '💼', title: '事业运势：上升期', desc: '当前掌纹显示你正处于事业积累的关键阶段，近期可能会遇到重要的转折机遇，建议大胆尝试新方向，主动争取展示自己的机会。' },
                { icon: '💼', title: '事业运势：稳定期', desc: '掌纹显示你的事业根基扎实，当前适合深耕现有领域，积累核心竞争力，不宜贸然转型，稳中求进方为上策。' },
                { icon: '💼', title: '事业运势：突破期', desc: '掌纹中事业线的走向表明你即将进入一个全新阶段，旧有模式可能被打破，拥抱变化将带来意想不到的收获。' }
            ];
            traits.push(careerPool[s % 3]);
            const posterSummary = buildPosterSummary(archIdx, arch, heartDesc, headDesc, fateDesc);
            return {
                keywords, personaMain, personaSub, heartDesc, headDesc, lifeDesc, fateDesc, traits, palmType,
                heroMain, archetypeIndex: archIdx, posterSummary
            };
        }

        function getDefaultReading() {
            const archIdx = resolveArchetypeIndex(null);
            const arch = PALM_ARCHETYPES[archIdx];
            const keywords = ['方向感', '毅力', '创造力'];

        // ==========================================
        // Keywords card: palm ROI + glowing line overlay
        // ==========================================
        function drawPalmThumbWithLines(img, landmarks, _palmType) {
            const ctx = palmThumbCanvas.getContext('2d');
            const w = img.naturalWidth, h = img.naturalHeight;
            let sx, sy, sw, sh;
            if (landmarks && landmarks.length >= 21) {
                const palmPts = [0, 1, 2, 5, 9, 13, 17];
                let minX = Infinity, minY = Infinity, maxX = 0, maxY = 0;
                for (const i of palmPts) {
                    const px = landmarks[i].x * w, py = landmarks[i].y * h;
                    if (px < minX) minX = px; if (py < minY) minY = py;
                    if (px > maxX) maxX = px; if (py > maxY) maxY = py;
                }
                const padX = (maxX - minX) * 0.28, padY = (maxY - minY) * 0.28;
                minX = Math.max(0, minX - padX); minY = Math.max(0, minY - padY);
                maxX = Math.min(w, maxX + padX); maxY = Math.min(h, maxY + padY);
                const rw = maxX - minX, rh = maxY - minY;
                const side = Math.max(rw, rh);
                const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
                sx = Math.max(0, cx - side / 2); sy = Math.max(0, cy - side / 2);
                sw = Math.min(side, w - sx); sh = Math.min(side, h - sy);
            } else {
                const side = Math.min(w, h) * 0.45;
                sx = (w - side) / 2; sy = h * 0.25; sw = side; sh = side;
            }
            const displayPx = 120;
            const dpr = window.devicePixelRatio || 2;
            const cw = Math.round(displayPx * dpr), ch = Math.round(displayPx * dpr);
            palmThumbCanvas.width = cw;
            palmThumbCanvas.height = ch;
            palmThumbCanvas.style.width = displayPx + 'px';
            palmThumbCanvas.style.height = displayPx + 'px';
            ctx.drawImage(img, sx, sy, sw, sh, 0, 0, cw, ch);

            if (!landmarks || landmarks.length < 21) return;

            const lm = landmarks;
            /** 拇指在画面右侧 ≈ 右手（图1）；拇指在左侧 ≈ 左手（图2），对路径做水平镜像 */
            const thumbOnRight = lm[4].x > lm[9].x;

            const toC = (i) => ({
                x: (lm[i].x * w - sx) / sw * cw,
                y: (lm[i].y * h - sy) / sh * ch
            });
            const L = (i) => ({ x: lm[i].x * w, y: lm[i].y * h });

            const LINE_WHITE = { main: 'rgba(255,255,255,0.92)', glow: 'rgba(255,255,255,0.34)' };
            const LINE_LIFE = { main: 'rgba(255,213,78,0.96)', glow: 'rgba(255,185,40,0.45)' };

            function drawGlowLine(points, width, colors) {
                if (points.length < 2) return;
                const col = colors;
                ctx.save();
                ctx.strokeStyle = col.glow;
                ctx.lineWidth = width + 4;
                ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                ctx.filter = 'blur(3px)';
                ctx.beginPath();
                ctx.moveTo(points[0].x, points[0].y);
                for (let i = 1; i < points.length; i++) {
                    const prev = points[i - 1], curr = points[i];
                    const mx = (prev.x + curr.x) / 2, my = (prev.y + curr.y) / 2;
                    ctx.quadraticCurveTo(prev.x, prev.y, mx, my);
                }
                ctx.lineTo(points[points.length - 1].x, points[points.length - 1].y);
                ctx.stroke();
                ctx.restore();
                ctx.save();
                ctx.strokeStyle = col.main;
                ctx.lineWidth = width;
                ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                ctx.shadowColor = col.main;
                ctx.shadowBlur = 6;
                ctx.beginPath();
                ctx.moveTo(points[0].x, points[0].y);
                for (let i = 1; i < points.length; i++) {
                    const prev = points[i - 1], curr = points[i];
                    const mx = (prev.x + curr.x) / 2, my = (prev.y + curr.y) / 2;
                    ctx.quadraticCurveTo(prev.x, prev.y, mx, my);
                }
                ctx.lineTo(points[points.length - 1].x, points[points.length - 1].y);
                ctx.stroke();
                ctx.restore();
            }

            const lineCx = cw * 0.5, lineCy = ch * 0.5;
            const LINE_COMPACT = 0.85;
            const compact = (p) => ({
                x: lineCx + (p.x - lineCx) * LINE_COMPACT,
                y: lineCy + (p.y - lineCy) * LINE_COMPACT
            });
            const compactPoly = (pts) => pts.map(compact);
            const mirrorX = (pts) => pts.map((p) => ({ x: cw - p.x, y: p.y }));
            const orient = (pts) => (thumbOnRight ? pts : mirrorX(pts));

            const mapPt = (p) => ({
                x: (p.x - sx) / sw * cw,
                y: (p.y - sy) / sh * ch
            });

            let heartPts = [5, 9, 13, 17].map(i => toC(i));
            heartPts[1].y -= ch * 0.024;
            heartPts[1].x += cw * 0.028;
            heartPts[2].y -= ch * 0.012;
            drawGlowLine(orient(compactPoly(heartPts)), 1.65, LINE_WHITE);

            const headStart = {
                x: (L(5).x + L(1).x) / 2, y: (L(5).y + L(0).y) * 0.48
            };
            const headMid1 = { x: (L(5).x + L(9).x) / 2, y: (L(5).y + L(0).y) * 0.50 };
            const headMid2 = { x: (L(9).x + L(13).x) / 2, y: (L(9).y + L(0).y) * 0.52 };
            const headEnd = {
                x: L(13).x + (L(17).x - L(13).x) * 0.4,
                y: (L(13).y + L(0).y) * 0.54
            };
            drawGlowLine(orient(compactPoly([
                mapPt(headStart), mapPt(headMid1), mapPt(headMid2), mapPt(headEnd)
            ])), 1.45, LINE_WHITE);

            const lifeStart = {
                x: (L(5).x + L(1).x) / 2 - (L(5).x - L(1).x) * 0.1,
                y: (L(5).y + L(0).y) * 0.46
            };
            const lifeMid1 = {
                x: L(1).x + (L(0).x - L(1).x) * 0.3,
                y: L(1).y + (L(0).y - L(1).y) * 0.4
            };
            const lifeMid2 = {
                x: L(1).x + (L(0).x - L(1).x) * 0.15,
                y: L(1).y + (L(0).y - L(1).y) * 0.7
            };
            const lifeEnd = {
                x: L(0).x + (L(1).x - L(0).x) * 0.1,
                y: L(0).y - (L(0).y - L(1).y) * 0.05
            };
            drawGlowLine(orient(compactPoly([
                mapPt(lifeStart), mapPt(lifeMid1), mapPt(lifeMid2), mapPt(lifeEnd)
            ])), 1.75, LINE_LIFE);
        }

                    palmThumbCanvas.height = ch;
                    palmThumbCanvas.style.width = displayPx + 'px';
                    palmThumbCanvas.style.height = displayPx + 'px';
                    const rw = roiImg.naturalWidth, rh = roiImg.naturalHeight;
                    ctx.drawImage(roiImg, 0, 0, rw, rh, 0, 0, cw, ch);
                };
                roiImg.src = segResult.roi_image;
            } else if (uploadedImage) {
                drawPalmThumbWithLines(uploadedImage, null, pt);
            }

            keywordsGrid.innerHTML = reading.keywords.map((kw) =>
                `<span class="keyword-pill">${kw}</span>`
            ).join('');

            const lines = [
                { icon: '❤️', name: '感情线', desc: reading.heartDesc },
                { icon: '🧠', name: '头脑线', desc: reading.headDesc },
                { icon: '✨', name: '命运线', desc: reading.fateDesc }
            ];
            linesSection.innerHTML = lines.map(l =>
                `<div class="result-detail-item">
                    <div class="result-detail-icon" aria-hidden="true">${l.icon}</div>
                    <div class="result-detail-body">
                        <div class="result-detail-label">${l.name}</div>
                        <p class="result-detail-text">${l.desc}</p>
                    </div>
                </div>`
            ).join('');

            reading.traits.forEach((item, index) => {
                const row = document.createElement('div');
                row.className = 'trait-item';
                row.innerHTML = `
                    <div class="trait-icon">${item.icon}</div>
                    <div>
                        <div class="trait-title">${item.title}</div>
                        <div class="trait-desc">${item.desc}</div>
                    </div>`;
                traitsContainer.appendChild(row);
                setTimeout(() => row.classList.add('visible'), 80 + index * 120);
            });
        }

        document.getElementById('shareBtn').addEventListener('click', () => {
            if (navigator.share) {
                navigator.share({ title: '手相解码', text: '我刚完成了手相解码分析！', url: location.href }).catch(() => {});
            } else {
                alert('报告已保存！长按图片即可分享给好友');
            }
        });

        app.classList.add('home-active');
    </script>
</body>
</html>
