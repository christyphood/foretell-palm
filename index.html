<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>手相解码</title>
    <style>
        @font-face {
            font-family: 'MFSongHe';
            src: url('fonts/MFSongHe-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'MFSongHe', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'PingFang TC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(197deg, #EEDFBA 5.46%, #EFDCD0 71.37%);
            min-height: 100vh;
            overflow: hidden;
        }
        .app { max-width: 414px; margin: 0 auto; height: 100vh; position: relative; display: flex; flex-direction: column; }
        .app.home-active {
            border-radius: 34px;
            overflow: hidden;
            background: #0a0c11;
        }
        .app.camera-active .header h1 { color: #fff; }
        .app.camera-active .header p { color: rgba(255,255,255,0.9); }
        .app.camera-active .close-btn {
            background: rgba(255,255,255,0.07);
            border-color: rgba(255,255,255,0.18);
            color: #fff;
        }
        .app.camera-active {
            background: linear-gradient(161.58deg, #0c0c0c 6.66%, #727272 150.26%);
        }
        .app.scan-active {
            background: linear-gradient(161.58deg, #0c0c0c 6.66%, #727272 150.26%);
        }
        .app.scan-active .header h1 { color: #fff; }
        .app.scan-active .header p { color: rgba(255,255,255,0.9); }
        .app.scan-active .close-btn {
            background: rgba(255,255,255,0.07);
            border-color: rgba(255,255,255,0.18);
            color: #fff;
        }
        .app.home-active .header {
            opacity: 0;
            pointer-events: none;
            transform: translateY(-8px);
            position: absolute;
            inset: 0 0 auto 0;
            z-index: 1;
        }
        .app.home-active .sections-wrap {
            height: 100vh;
        }

        .header {
            padding: 60px 24px 20px;
            display: flex; justify-content: space-between; align-items: flex-start;
            flex-shrink: 0; position: relative; z-index: 10;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }
        .header h1 { font-size: 21px; font-weight: 700; color: #000; line-height: 1.2; margin-bottom: 4px; }
        .header p { font-size: 11px; color: #4a4a4a; }
        .close-btn {
            width: 34px; height: 34px; border-radius: 50%;
            background: rgba(255,255,255,0.55);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            border: 1.7px solid rgba(255,255,255,0.1);
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            transition: transform 0.2s;
        }
        .close-btn:active { transform: scale(0.92); }

        .sections-wrap {
            flex: 1; position: relative; overflow: hidden;
        }

        .section {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            opacity: 0; transform: translateY(24px);
            pointer-events: none;
            transition: opacity 0.55s cubic-bezier(.4,0,.2,1), transform 0.55s cubic-bezier(.4,0,.2,1);
            will-change: opacity, transform;
        }
        .section.active {
            opacity: 1; transform: translateY(0);
            pointer-events: auto;
        }
        .section.exiting {
            opacity: 0; transform: translateY(-24px);
            pointer-events: none;
        }

        /* ===== HOME ===== */
        .section-home {
            display: flex; flex-direction: column; align-items: center;
            justify-content: flex-end;
            padding-bottom: 70px;
            position: relative;
            min-height: 100vh;
            background:
                linear-gradient(161.58deg, #0c0c0c 6.66%, #727272 150.26%);
        }
        .home-bg {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: transparent;
            pointer-events: none;
        }
        .home-title-wrap {
            position: absolute;
            left: 24px;
            top: 110px;
            z-index: 2;
            color: #fff;
        }
        .home-title {
            font-size: 64px;
            line-height: 1.15;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: 1px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.25);
        }
        .home-subtitle {
            font-size: 16px;
            line-height: 1.45;
            color: rgba(255,255,255,0.9);
        }
        .home-close-btn {
            position: absolute;
            top: 34px;
            right: 24px;
            z-index: 2;
            width: 38px; height: 38px; border-radius: 50%;
            background: rgba(217,217,217,0.9);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            border: 1.7px solid rgba(255,255,255,0.18);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: transform 0.2s;
            font-size: 24px; color: #000;
        }
        .home-close-btn:active { transform: scale(0.92); }
        .start-btn {
            width: 154px; height: 154px; border-radius: 50%;
            background: #fff;
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.6);
            color: #000; font-size: 28px; font-weight: 700;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            letter-spacing: 1px;
            position: relative; z-index: 2;
        }
        .start-btn:active { transform: scale(0.93); box-shadow: 0 4px 16px rgba(0,0,0,0.08); }

        /* ===== CAMERA ===== */
        .section-camera {
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            background: linear-gradient(161.58deg, #0c0c0c 6.66%, #727272 150.26%);
        }
        .camera-container {
            position: relative;
            width: 100%; aspect-ratio: 674 / 982;
            margin: 14px auto 0;
            background: rgba(255,255,255,0.46);
            backdrop-filter: blur(7.8px); -webkit-backdrop-filter: blur(7.8px);
            border: 1px solid #e3ceee;
            border-radius: 20px; overflow: hidden;
        }
        .camera-video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; background: #000;
        }
        .camera-video.front-camera { transform: scaleX(-1); }
        .camera-placeholder {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #4a4a4a; z-index: 1;
        }
        .camera-placeholder-icon { width: 48px; height: 48px; margin-bottom: 12px; opacity: 0.5; }
        .camera-placeholder-text { font-size: 14px; opacity: 0.7; }
        .camera-frame {
            position: absolute; top: 8%; left: 8%; right: 8%; bottom: 8%;
            border: 2px dashed rgba(58,42,26,0.2);
            border-radius: 16px; pointer-events: none; z-index: 3;
        }
        .hand-guide {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 65%; max-width: 200px; height: auto; pointer-events: none; z-index: 2;
            transition: opacity 0.3s ease;
        }
        .hand-guide.detected { opacity: 0.1; }
        .detection-status {
            position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
            padding: 8px 16px; background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            border-radius: 20px; font-size: 12px; color: white; z-index: 10;
            opacity: 0; transition: opacity 0.25s; white-space: nowrap;
        }
        .detection-status.visible { opacity: 1; }
        .detection-status.success { background: rgba(76,175,80,0.85); }
        .camera-hint {
            text-align: center; margin-top: 24px;
            font-size: 18px; color: #fff; line-height: 1.5;
        }
        .upload-section {
            display: flex; align-items: center; justify-content: center;
            gap: 8px; margin-top: 20px; cursor: pointer; padding: 12px;
        }
        .upload-section:active { opacity: 0.7; }
        .upload-text { font-size: 16px; color: #fff; }
        .upload-icon { width: 18px; height: 18px; color: #fff; }
        #fileInput { display: none; }

        /* ===== SCAN ===== */
        .section-scan {
            padding: 0 20px;
            background: linear-gradient(161.58deg, #0c0c0c 6.66%, #727272 150.26%);
        }
        .scan-box {
            position: relative; width: 100%; aspect-ratio: 674 / 982;
            margin: 10px auto 0;
            background: rgba(255,255,255,0.46);
            backdrop-filter: blur(7.8px); -webkit-backdrop-filter: blur(7.8px);
            border: 1px solid rgba(255,255,255,0.19);
            border-radius: 20px; overflow: hidden;
        }
        .scan-box img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        .scan-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
        .scan-grid {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(201,169,110,0.12) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(201,169,110,0.12) 1px, transparent 1px);
            background-size: 25% 25%;
        }
        .scan-line {
            position: absolute; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, transparent, #C9A96E, transparent);
            animation: scanMove 2.5s ease-in-out infinite;
            box-shadow: 0 0 20px rgba(201,169,110,0.6);
        }
        @keyframes scanMove { 0% { top: 0; } 50% { top: 95%; } 100% { top: 0; } }
        .scan-dots { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
        .scan-dot {
            position: absolute; width: 12px; height: 12px; border-radius: 50%;
            background: #FFD700; animation: dotPulse 1.5s ease-in-out infinite;
            box-shadow: 0 0 8px rgba(255,215,0,0.6);
        }
        .scan-dot:nth-child(1) { top: 35%; left: 40%; }
        .scan-dot:nth-child(2) { top: 40%; left: 60%; animation-delay: .3s; }
        .scan-dot:nth-child(3) { top: 55%; left: 35%; animation-delay: .6s; }
        .scan-dot:nth-child(4) { top: 60%; left: 55%; animation-delay: .9s; }
        .scan-dot:nth-child(5) { top: 70%; left: 45%; animation-delay: 1.2s; }
        @keyframes dotPulse { 0%,100% { transform: scale(1); opacity: .8; } 50% { transform: scale(1.5); opacity: 1; } }
        .scan-progress { margin-top: 20px; text-align: center; }
        .scan-text { font-size: 16px; color: #fff; margin-bottom: 12px; }
        .progress-bar { width: 80%; height: 4px; background: #E8DED0; border-radius: 2px; margin: 0 auto; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #C9A96E, #FFD700); border-radius: 2px; width: 0%; transition: width 0.3s ease; }

        /* ===== RESULT ===== */
        .section-result { padding: 0 20px 40px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
        .result-hero-canvas {
            width: 100%; border-radius: 20px;
            margin-top: 6px; margin-bottom: 20px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            display: block;
        }
        .result-top-card {
            background: rgba(255,255,255,0.65);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 20px; padding: 20px; margin-top: 10px;
        }
        .result-top-row { display: flex; gap: 16px; align-items: flex-start; }
        .palm-thumb {
            width: 110px; height: 110px; border-radius: 14px;
            object-fit: cover; flex-shrink: 0;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            background: #f0e6d6;
        }
        .keywords-section { flex: 1; }
        .keywords-title { font-size: 16px; font-weight: 700; color: #2D2D2D; margin-bottom: 12px; }
        .keywords-grid { display: flex; gap: 16px; justify-content: flex-start; }
        .keyword-item { display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .keyword-icon {
            width: 40px; height: 40px; border-radius: 12px;
            background: rgba(255,255,255,0.8);
            display: flex; align-items: center; justify-content: center; font-size: 18px;
        }
        .keyword-label { font-size: 11px; color: #4a4a4a; }
        .lines-section { margin-top: 20px; padding-top: 16px; border-top: 1px solid rgba(0,0,0,0.06); }
        .line-row { display: flex; margin-bottom: 14px; gap: 12px; line-height: 1.6; }
        .line-row:last-child { margin-bottom: 0; }
        .line-name { font-size: 13px; font-weight: 600; color: #3a2a1a; min-width: 52px; flex-shrink: 0; padding-top: 1px; }
        .line-desc { font-size: 13px; color: #4a4a4a; }
        .traits-section { margin-top: 28px; }
        .traits-title { font-size: 20px; font-weight: 700; color: #2D2D2D; margin-bottom: 16px; padding-left: 4px; }
        .trait-card {
            background: rgba(255,255,255,0.65);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 16px; padding: 20px; margin-bottom: 12px;
            display: flex; gap: 14px; align-items: flex-start;
            opacity: 0; transform: translateY(20px);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        .trait-card.visible { opacity: 1; transform: translateY(0); }
        .trait-icon {
            width: 42px; height: 42px; border-radius: 12px;
            background: linear-gradient(135deg, #FDF5E6, #F5E6D3);
            display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0;
        }
        .trait-title { font-size: 16px; font-weight: 600; color: #2D2D2D; margin-bottom: 4px; }
        .trait-desc { font-size: 13px; color: #6B5E50; line-height: 1.6; }
        .share-section { margin-top: 28px; text-align: center; padding-bottom: 40px; }
        .share-btn {
            width: 100%; padding: 16px; border-radius: 28px;
            background: linear-gradient(135deg, #C9A96E 0%, #B8956A 100%);
            border: none; color: white; font-size: 16px; font-weight: 600;
            cursor: pointer; box-shadow: 0 8px 24px rgba(201,169,110,0.3);
        }
        .share-btn:active { transform: scale(0.98); }
        .disclaimer { margin-top: 16px; font-size: 11px; color: #BFAE9D; line-height: 1.6; }

        /* ===== PALM HERO GRAPHIC ===== */
        .palm-hero {
            position: relative;
            margin: 24px 0;
            border-radius: 24px;
            overflow: hidden;
            opacity: 0; transform: translateY(20px);
            transition: opacity 0.6s ease 0.3s, transform 0.6s ease 0.3s;
        }
        .palm-hero.visible { opacity: 1; transform: translateY(0); }

        .palm-hero-inner {
            position: relative;
            padding: 32px 20px 28px;
            background: rgba(255,255,255,0.35);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.4);
            border-radius: 24px;
            text-align: center;
            overflow: hidden;
        }

        .palm-hero-glow {
            position: absolute; top: 50%; left: 50%;
            width: 200px; height: 200px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.5;
            pointer-events: none;
            animation: glowPulse 4s ease-in-out infinite;
        }
        @keyframes glowPulse {
            0%, 100% { opacity: 0.35; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 0.55; transform: translate(-50%, -50%) scale(1.15); }
        }

        .palm-hero-svg-wrap {
            position: relative;
            width: 180px; height: 180px;
            margin: 0 auto 20px;
            z-index: 1;
        }
        .palm-hero-svg-wrap svg {
            width: 100%; height: 100%;
            filter: drop-shadow(0 0 12px var(--hero-glow-color, rgba(192,214,232,0.4)));
        }

        .palm-hero-label {
            position: relative; z-index: 1;
            font-size: 20px; font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 6px;
        }
        .palm-hero-sub {
            position: relative; z-index: 1;
            font-size: 12px; opacity: 0.7;
            letter-spacing: 1px;
        }

        /* --- Philosopher (long) --- */
        .palm-hero.type-long { --hero-glow-color: rgba(180, 210, 240, 0.5); }
        .palm-hero.type-long .palm-hero-inner {
            background: linear-gradient(160deg, rgba(230,240,252,0.45) 0%, rgba(210,225,245,0.3) 100%);
            border-color: rgba(200,220,245,0.5);
        }
        .palm-hero.type-long .palm-hero-glow {
            background: radial-gradient(circle, rgba(180,210,245,0.7), rgba(200,180,240,0.3), transparent);
        }
        .palm-hero.type-long .palm-hero-label { color: #4A6A8A; }
        .palm-hero.type-long .palm-hero-sub { color: #6A8AAA; }

        /* --- Practical (square) --- */
        .palm-hero.type-square { --hero-glow-color: rgba(210, 180, 140, 0.5); }
        .palm-hero.type-square .palm-hero-inner {
            background: linear-gradient(160deg, rgba(250,240,225,0.45) 0%, rgba(240,225,200,0.3) 100%);
            border-color: rgba(220,200,170,0.5);
        }
        .palm-hero.type-square .palm-hero-glow {
            background: radial-gradient(circle, rgba(220,190,140,0.7), rgba(200,170,120,0.3), transparent);
        }
        .palm-hero.type-square .palm-hero-label { color: #8A6A3A; }
        .palm-hero.type-square .palm-hero-sub { color: #A08050; }

        /* --- Balanced --- */
        .palm-hero.type-balanced { --hero-glow-color: rgba(190, 210, 190, 0.5); }
        .palm-hero.type-balanced .palm-hero-inner {
            background: linear-gradient(160deg, rgba(235,245,235,0.45) 0%, rgba(225,240,235,0.3) 100%);
            border-color: rgba(200,225,210,0.5);
        }
        .palm-hero.type-balanced .palm-hero-glow {
            background: radial-gradient(circle, rgba(170,210,180,0.7), rgba(200,220,190,0.3), transparent);
        }
        .palm-hero.type-balanced .palm-hero-label { color: #4A7A5A; }
        .palm-hero.type-balanced .palm-hero-sub { color: #6A9A7A; }

        /* SVG animation keyframes */
        @keyframes heroSpin { to { transform: rotate(360deg); } }
        @keyframes heroSpinReverse { to { transform: rotate(-360deg); } }
        @keyframes heroBreathe {
            0%, 100% { transform: scale(1); opacity: 0.85; }
            50% { transform: scale(1.04); opacity: 1; }
        }
        @keyframes heroFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        @keyframes heroWave {
            0% { d: path("M20,100 C50,85 80,115 110,100 C140,85 170,115 200,100"); }
            50% { d: path("M20,100 C50,115 80,85 110,100 C140,115 170,85 200,100"); }
            100% { d: path("M20,100 C50,85 80,115 110,100 C140,85 170,115 200,100"); }
        }
        @keyframes heroWave2 {
            0% { d: path("M10,110 C45,125 75,95 110,110 C145,125 175,95 210,110"); }
            50% { d: path("M10,110 C45,95 75,125 110,110 C145,95 175,125 210,110"); }
            100% { d: path("M10,110 C45,125 75,95 110,110 C145,125 175,95 210,110"); }
        }
        @keyframes heroWave3 {
            0% { d: path("M0,120 C40,105 70,135 110,120 C150,105 180,135 220,120"); }
            50% { d: path("M0,120 C40,135 70,105 110,120 C150,135 180,105 220,120"); }
            100% { d: path("M0,120 C40,105 70,135 110,120 C150,105 180,135 220,120"); }
        }
        @keyframes heroDotOrbit {
            0% { transform: rotate(0deg) translateX(58px) rotate(0deg); opacity: 0.6; }
            50% { opacity: 1; }
            100% { transform: rotate(360deg) translateX(58px) rotate(-360deg); opacity: 0.6; }
        }
        @keyframes centerPulse {
            0%, 100% { r: 3; opacity: 0.5; }
            50% { r: 5; opacity: 0.9; }
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="header">
            <div><h1>手相解码</h1><p>读懂掌心纹路，读懂你的天生底色</p></div>
            <button class="close-btn" id="closeBtn">✕</button>
        </div>

        <div class="sections-wrap">
            <!-- HOME -->
            <div class="section section-home active" id="sectionHome">
                <div class="home-bg"></div>
                <div class="home-title-wrap">
                    <h1 class="home-title">手相解码</h1>
                    <p class="home-subtitle">读懂掌心纹路，读懂你的天生底色</p>
                </div>
                <button class="home-close-btn" id="homeCloseBtn">×</button>
                <button class="start-btn" id="startBtn">开始</button>
            </div>

            <!-- CAMERA -->
            <div class="section section-camera" id="sectionCamera">
                <div class="camera-container">
                    <video id="cameraVideo" class="camera-video" autoplay playsinline muted></video>
                    <div class="camera-placeholder" id="cameraPlaceholder">
                        <svg class="camera-placeholder-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                            <circle cx="12" cy="13" r="4"></circle>
                        </svg>
                        <p class="camera-placeholder-text">正在启动相机...</p>
                    </div>
                    <div class="camera-frame"></div>
                    <svg id="handGuide" class="hand-guide" viewBox="0 0 200 280" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M100 260 C50 260 25 200 25 140 C25 100 35 70 50 50 C60 35 75 25 100 25 C125 25 140 35 150 50 C165 70 175 100 175 140 C175 200 150 260 100 260 Z"
                              stroke="#3a2a1a" stroke-width="1.5" fill="none" opacity="0.3"/>
                        <path d="M45 120 L45 90 C45 70 50 55 55 45 L55 20" stroke="#3a2a1a" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.3"/>
                        <path d="M70 100 L70 40 C70 25 75 15 80 10" stroke="#3a2a1a" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.3"/>

                        <ellipse cx="145" cy="18" rx="8" ry="10" stroke="#3a2a1a" stroke-width="1" fill="none" opacity="0.25"/>
                        <path d="M60 160 C75 155 85 145 100 145 C115 145 125 155 140 160" stroke="#3a2a1a" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.2" stroke-dasharray="4 4"/>
                        <path d="M55 180 C70 175 85 165 100 165 C115 165 130 175 145 180" stroke="#3a2a1a" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.2" stroke-dasharray="4 4"/>
                        <path d="M50 200 C65 195 80 185 100 185 C120 185 135 195 150 200" stroke="#3a2a1a" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.2" stroke-dasharray="4 4"/>

                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>

            <!-- SCAN -->
            <div class="section section-scan" id="sectionScan">

                        <div class="scan-line"></div>
                        <div class="scan-dots">
                            <div class="scan-dot"></div><div class="scan-dot"></div><div class="scan-dot"></div><div class="scan-dot"></div><div class="scan-dot"></div>
                        </div>
                    </div>
                </div>
                <div class="scan-progress">
                    <p class="scan-text" id="scanText">正在分析掌纹...</p>

            <!-- RESULT -->
            <div class="section section-result" id="sectionResult">
                <canvas id="resultHeroCanvas" class="result-hero-canvas"></canvas>
                <div class="result-top-card">
                    <div class="result-top-row">
                        <canvas id="palmThumbCanvas" class="palm-thumb" width="300" height="300"></canvas>
                        <div class="keywords-section">
                            <div class="keywords-title">关键词</div>
                            <div class="keywords-grid" id="keywordsGrid"></div>
                        </div>
                    </div>
                    <div class="lines-section" id="linesSection"></div>
                </div>
                <div class="palm-hero" id="palmHero">
                    <div class="palm-hero-inner">
                        <div class="palm-hero-glow"></div>
                        <div class="palm-hero-svg-wrap" id="palmHeroSvg"></div>
                        <div class="palm-hero-label" id="palmHeroLabel"></div>
                        <div class="palm-hero-sub" id="palmHeroSub"></div>

                    <h2 class="traits-title">你的基本特质</h2>
                    <div id="traitsContainer"></div>

    </div>

    <script type="module">
        // ==========================================
        // DOM refs
        // ==========================================
        const sectionHome = document.getElementById('sectionHome');
        const sectionCamera = document.getElementById('sectionCamera');
        const sectionScan = document.getElementById('sectionScan');
        const sectionResult = document.getElementById('sectionResult');
        const sections = [sectionHome, sectionCamera, sectionScan, sectionResult];
        const app = document.querySelector('.app');

        const startBtn = document.getElementById('startBtn');
        const closeBtn = document.getElementById('closeBtn');
        const homeCloseBtn = document.getElementById('homeCloseBtn');

        const cameraVideo = document.getElementById('cameraVideo');
        const cameraPlaceholder = document.getElementById('cameraPlaceholder');
        const handGuide = document.getElementById('handGuide');
        const detectionStatus = document.getElementById('detectionStatus');
        const uploadSection = document.getElementById('uploadSection');
        const fileInput = document.getElementById('fileInput');

        const scanImage = document.getElementById('scanImage');
        const scanText = document.getElementById('scanText');
        const progressFill = document.getElementById('progressFill');

        const palmThumbCanvas = document.getElementById('palmThumbCanvas');
        const keywordsGrid = document.getElementById('keywordsGrid');
        const linesSection = document.getElementById('linesSection');
        const traitsContainer = document.getElementById('traitsContainer');

        // ==========================================
        // Section transition
        // ==========================================
        let currentSection = sectionHome;

        function switchTo(target) {
            if (target === currentSection) return;
            const prev = currentSection;
            currentSection = target;

            prev.classList.remove('active');
            prev.classList.add('exiting');

            void target.offsetWidth;
            target.classList.remove('exiting');
            target.classList.add('active');

            setTimeout(() => prev.classList.remove('exiting'), 600);

            if (target === sectionHome) app.classList.add('home-active');
            else app.classList.remove('home-active');
            if (target === sectionCamera) app.classList.add('camera-active');
            else app.classList.remove('camera-active');
            if (target === sectionScan) app.classList.add('scan-active');
            else app.classList.remove('scan-active');

            if (target === sectionResult) {
                document.body.style.overflow = 'hidden';
            } else {
                document.body.style.overflow = 'hidden';
            }
        }

        // ==========================================
        // Camera state
        // ==========================================
        let stream = null;
        let cameraHandLandmarker = null;
        let isDetecting = false;
        let palmDetectedCount = 0;
        let isFrontCamera = false;
        let lastPalmCenter = null;
        const DETECTION_THRESHOLD = 18;
        const STABILITY_THRESHOLD = 0.015;

        let uploadedImage = null;
        let handLandmarkerInstance = null;

        // ==========================================
        // Navigation handlers
        // ==========================================
        startBtn.addEventListener('click', () => {
            switchTo(sectionCamera);
            initCamera();
        });

        homeCloseBtn.addEventListener('click', () => history.back());

        closeBtn.addEventListener('click', () => {
            stopCamera();
            if (currentSection !== sectionHome) {
                switchTo(sectionHome);
                resetState();
            } else {
                history.back();
            }
        });

        uploadSection.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) processUploadedFile(file);
        });

        function resetState() {
            palmDetectedCount = 0;
            lastPalmCenter = null;
            isDetecting = false;
            progressFill.style.width = '0%';
            scanText.textContent = '正在分析掌纹...';
            traitsContainer.innerHTML = '';
            keywordsGrid.innerHTML = '';
            linesSection.innerHTML = '';
            document.getElementById('palmHero').classList.remove('visible');
            document.getElementById('palmHeroSvg').innerHTML = '';
            handGuide.classList.remove('detected');
            detectionStatus.classList.remove('visible', 'success');
            cameraPlaceholder.style.display = 'flex';
            cameraPlaceholder.querySelector('.camera-placeholder-text').textContent = '正在启动相机...';
        }

        // ==========================================
        // Camera
        // ==========================================
        async function initCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1440 } },
                    audio: false
                });
                const track = stream.getVideoTracks()[0];
                const settings = track.getSettings();
                isFrontCamera = settings.facingMode === 'user';
                if (isFrontCamera) cameraVideo.classList.add('front-camera');
                else cameraVideo.classList.remove('front-camera');

                cameraVideo.srcObject = stream;
                cameraVideo.onloadedmetadata = () => {
                    cameraPlaceholder.style.display = 'none';
                    initCameraHandDetection();
                };
            } catch (err) {
                console.error('Camera error:', err);
                try {
                    stream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: 'user', width: { ideal: 1920 }, height: { ideal: 1440 } },
                        audio: false
                    });
                    isFrontCamera = true;
                    cameraVideo.classList.add('front-camera');
                    cameraVideo.srcObject = stream;
                    cameraVideo.onloadedmetadata = () => {
                        cameraPlaceholder.style.display = 'none';
                        initCameraHandDetection();
                    };
                } catch (fallbackErr) {
                    console.error('Fallback camera error:', fallbackErr);
                    cameraPlaceholder.querySelector('.camera-placeholder-text').textContent = '无法访问相机，请上传图片';
                }
            }
        }

        async function initCameraHandDetection() {
            try {
                const { HandLandmarker, FilesetResolver } = await import(
                    'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm'
                );
                const fileset = await FilesetResolver.forVisionTasks(
                    'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
                );
                cameraHandLandmarker = await HandLandmarker.createFromOptions(fileset, {
                    baseOptions: {
                        modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
                        delegate: 'GPU'
                    },
                    runningMode: 'VIDEO',
                    numHands: 1
                });
                isDetecting = true;
                palmDetectedCount = 0;
                lastPalmCenter = null;
                detectLoop();
            } catch (err) {
                console.warn('Hand detection init failed:', err);
            }
        }

        function detectLoop() {
            if (!isDetecting || !cameraHandLandmarker || !cameraVideo.videoWidth) {
                if (isDetecting) requestAnimationFrame(detectLoop);
                return;
            }
            try {
                const result = cameraHandLandmarker.detectForVideo(cameraVideo, performance.now());
                if (result.landmarks && result.landmarks.length > 0) {
                    const landmarks = result.landmarks[0];
                    if (isPalmOpen(landmarks)) {
                        const palmCenter = getPalmCenter(landmarks);
                        const isStable = isPalmStable(palmCenter);
                        lastPalmCenter = palmCenter;
                        if (isStable) {
                            palmDetectedCount++;
                            handGuide.classList.add('detected');
                            detectionStatus.textContent = `手掌已识别，保持不动 (${palmDetectedCount}/${DETECTION_THRESHOLD})`;
                            detectionStatus.classList.add('visible', 'success');
                            if (palmDetectedCount >= DETECTION_THRESHOLD) {
                                captureAndProcess();
                                return;
                            }
                        } else {
                            palmDetectedCount = Math.max(0, palmDetectedCount - 2);
                            handGuide.classList.add('detected');
                            detectionStatus.textContent = '请保持手掌稳定';
                            detectionStatus.classList.add('visible');
                            detectionStatus.classList.remove('success');
                        }
                    } else {
                        palmDetectedCount = Math.max(0, palmDetectedCount - 1);
                        lastPalmCenter = null;
                        handGuide.classList.remove('detected');
                        detectionStatus.textContent = '请张开手掌';
                        detectionStatus.classList.add('visible');
                        detectionStatus.classList.remove('success');
                    }
                } else {
                    palmDetectedCount = Math.max(0, palmDetectedCount - 1);
                    lastPalmCenter = null;
                    handGuide.classList.remove('detected');
                    detectionStatus.textContent = '未检测到手掌';
                    detectionStatus.classList.add('visible');
                    detectionStatus.classList.remove('success');
                }
            } catch (err) { console.warn('Detection error:', err); }
            requestAnimationFrame(detectLoop);
        }

        function getPalmCenter(landmarks) {
            const w = landmarks[0], m = landmarks[9], i = landmarks[5], p = landmarks[17];
            return { x: (w.x + m.x + i.x + p.x) / 4, y: (w.y + m.y + i.y + p.y) / 4 };
        }

        function isPalmStable(currentCenter) {
            if (!lastPalmCenter) return true;
            const dx = currentCenter.x - lastPalmCenter.x;
            const dy = currentCenter.y - lastPalmCenter.y;
            return Math.sqrt(dx * dx + dy * dy) < STABILITY_THRESHOLD;
        }

        function isPalmOpen(landmarks) {
            if (!landmarks || landmarks.length < 21) return false;
            const wrist = landmarks[0], middleMcp = landmarks[9];
            const palmToMiddle = Math.hypot(middleMcp.x - wrist.x, middleMcp.y - wrist.y);
            const indexExtended = Math.hypot(landmarks[8].x - wrist.x, landmarks[8].y - wrist.y) > palmToMiddle * 1.3;
            const middleExtended = Math.hypot(landmarks[12].x - wrist.x, landmarks[12].y - wrist.y) > palmToMiddle * 1.3;
            const ringExtended = Math.hypot(landmarks[16].x - wrist.x, landmarks[16].y - wrist.y) > palmToMiddle * 1.3;
            const pinkyExtended = Math.hypot(landmarks[20].x - wrist.x, landmarks[20].y - wrist.y) > palmToMiddle * 1.2;
            const thumbExtended = Math.hypot(landmarks[4].x - landmarks[2].x, landmarks[4].y - landmarks[2].y) > palmToMiddle * 0.4;
            return [indexExtended, middleExtended, ringExtended, pinkyExtended, thumbExtended].filter(Boolean).length >= 4;
        }

        async function captureAndProcess() {
            isDetecting = false;
            detectionStatus.textContent = '已锁定，正在对焦...';
            detectionStatus.classList.add('visible', 'success');

            await new Promise(r => setTimeout(r, 800));

            const canvas = document.createElement('canvas');
            canvas.width = cameraVideo.videoWidth;
            canvas.height = cameraVideo.videoHeight;
            const ctx = canvas.getContext('2d');
            if (isFrontCamera) { ctx.translate(canvas.width, 0); ctx.scale(-1, 1); }
            ctx.drawImage(cameraVideo, 0, 0);

            const imageData = canvas.toDataURL('image/jpeg', 0.92);

            stopCamera();

            scanImage.src = imageData;
            uploadedImage = new Image();
            uploadedImage.onload = () => {
                switchTo(sectionScan);
                startScanProcess();
            };
            uploadedImage.src = imageData;
        }

        function processUploadedFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const imageData = e.target.result;
                stopCamera();
                scanImage.src = imageData;
                uploadedImage = new Image();
                uploadedImage.onload = () => {
                    switchTo(sectionScan);
                    startScanProcess();
                };
                uploadedImage.src = imageData;
            };
            reader.readAsDataURL(file);
        }

        function stopCamera() {
            isDetecting = false;
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
        }

        // ==========================================
        // API
        // ==========================================
        function getPalmApiBase() {
            const params = new URLSearchParams(location.search);
            let fromQuery = params.get('api');
            if (fromQuery) { try { fromQuery = decodeURIComponent(fromQuery.trim()); localStorage.setItem('palmApiBase', fromQuery); } catch (_) {} }
            if (!fromQuery && location.hash && location.hash.startsWith('#api=')) { try { fromQuery = decodeURIComponent(location.hash.slice(5).split('&')[0].trim()); if (fromQuery.startsWith('http')) localStorage.setItem('palmApiBase', fromQuery); } catch (_) {} }
            if (fromQuery) { try { const u = new URL(fromQuery); return u.origin + u.pathname.replace(/\/$/, ''); } catch (_) { return null; } }
            try { const saved = localStorage.getItem('palmApiBase'); if (saved) { const u = new URL(saved.trim()); return u.origin + u.pathname.replace(/\/$/, ''); } } catch (_) {}
            const { protocol, hostname, port } = location;
            const local = hostname === 'localhost' || hostname === '127.0.0.1';
            if (local && port === '5050') return '';
            if (protocol === 'file:') return 'http://127.0.0.1:5050';
            if (protocol === 'http:' && local) return 'http://127.0.0.1:5050';
            if (protocol === 'https:') return null;
            return 'http://127.0.0.1:5050';
        }

        function hasBackendResult(seg) {
            return seg && seg.success && !!(seg.features || seg.roi_image);
        }

        // ==========================================
        // MediaPipe IMAGE mode (for scan phase)
        // ==========================================
        async function detectHandLandmarks(imgEl) {
            if (!imgEl || !imgEl.naturalWidth) return null;
            if (!handLandmarkerInstance) {
                const { HandLandmarker, FilesetResolver } = await import(
                    'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm'
                );
                const fileset = await FilesetResolver.forVisionTasks(
                    'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
                );
                handLandmarkerInstance = await HandLandmarker.createFromOptions(fileset, {
                    baseOptions: {
                        modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
                        delegate: 'CPU'
                    },
                    runningMode: 'IMAGE',
                    numHands: 1
                });
            }
            const result = handLandmarkerInstance.detect(imgEl);
            const lm = result.landmarks && result.landmarks[0];
            if (!lm || lm.length < 21) return null;
            return lm.map(p => ({ x: p.x, y: p.y }));
        }

        // ==========================================
        // Scan process
        // ==========================================
        const scanTexts = [
            '加载手部关键点模型...', '检测 21 个手部关键点...',
            '旋转矫正图像...', '分割手部前景...',
            '定位掌心 ROI 区域...', '增强掌纹纹理...',
            '提取掌纹线条...', '分析感情线结构...',
            '分析头脑线结构...', '分析生命线结构...', '生成分析报告...'
        ];

        async function startScanProcess() {
            let progress = 0;
            progressFill.style.width = '0%';
            const progressInterval = setInterval(() => {
                progress = Math.min(progress + 1, 85);
                progressFill.style.width = progress + '%';
            }, 60);

            scanText.textContent = scanTexts[0];

            let segResult = null;
            const apiBase = getPalmApiBase();
            if (apiBase !== null) {
                try {
                    scanText.textContent = '正在调用 AI 掌纹识别...';
                    const canvas = document.createElement('canvas');
                    canvas.width = uploadedImage.naturalWidth;
                    canvas.height = uploadedImage.naturalHeight;
                    canvas.getContext('2d').drawImage(uploadedImage, 0, 0);
                    const b64 = canvas.toDataURL('image/jpeg', 0.85);
                    const resp = await fetch((apiBase || '') + '/analyze', {
                        method: 'POST', mode: 'cors', credentials: 'omit',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ image: b64 })
                    });
                    segResult = await resp.json();
                    if (!resp.ok) segResult = { ...segResult, success: false };
                } catch (e) { console.warn('[palm] API fail:', e); }
            }

            let landmarks = null;
            try {
                scanText.textContent = '检测手掌关键点...';
                landmarks = await detectHandLandmarks(uploadedImage);
                console.log('[palm] landmarks detected:', !!landmarks);
            } catch (e) { console.warn('[palm] hand detection fail:', e); }

            for (let i = 1; i < scanTexts.length; i++) {
                await new Promise(r => setTimeout(r, 400));
                scanText.textContent = scanTexts[i];
                progress = 30 + (i / scanTexts.length) * 70;
                progressFill.style.width = progress + '%';
            }

            clearInterval(progressInterval);
            progressFill.style.width = '100%';
            await new Promise(r => setTimeout(r, 400));

            showResult(segResult, landmarks);
        }

        // ==========================================
        // Palm analysis
        // ==========================================
        function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

        function analyzePalm(lm) {
            if (!lm || lm.length < 21) return null;
            const palmWidth = dist(lm[5], lm[17]);
            const palmHeight = dist(lm[0], lm[9]);
            const palmRatio = palmHeight / palmWidth;
            const indexLen = dist(lm[5], lm[6]) + dist(lm[6], lm[7]) + dist(lm[7], lm[8]);
            const middleLen = dist(lm[9], lm[10]) + dist(lm[10], lm[11]) + dist(lm[11], lm[12]);
            const ringLen = dist(lm[13], lm[14]) + dist(lm[14], lm[15]) + dist(lm[15], lm[16]);
            const pinkyLen = dist(lm[17], lm[18]) + dist(lm[18], lm[19]) + dist(lm[19], lm[20]);
            const thumbLen = dist(lm[1], lm[2]) + dist(lm[2], lm[3]) + dist(lm[3], lm[4]);
            const fingerTopalm = middleLen / palmHeight;
            const indexToRing = indexLen / ringLen;
            const pinkyToIndex = pinkyLen / indexLen;
            const thumbToIndex = thumbLen / indexLen;
            const heartY = (lm[5].y + lm[17].y) / 2;
            const headY = (lm[5].y + lm[0].y) * 0.45;
            const lifeArc = dist(lm[1], lm[0]);
            const seed = Math.round((palmRatio * 1000 + indexToRing * 1000 + pinkyToIndex * 1000 + fingerTopalm * 1000) % 100);
            return { palmRatio, fingerTopalm, indexToRing, pinkyToIndex, thumbToIndex, palmWidth, palmHeight, heartY, headY, lifeArc, seed, indexLen, middleLen, ringLen, pinkyLen, thumbLen };
        }

        function generateReading(analysis) {
            if (!analysis) return getDefaultReading();
            const a = analysis, s = a.seed;
            const palmType = a.palmRatio > 1.15 ? 'long' : a.palmRatio < 0.95 ? 'square' : 'balanced';
            const fingerType = a.fingerTopalm > 0.85 ? 'long' : a.fingerTopalm < 0.7 ? 'short' : 'medium';
            const kwPool = {
                long: { long: ['洞察力', '理想主义', '创造力'], medium: ['方向感', '直觉力', '深度'], short: ['内省力', '坚韧', '感受力'] },
                square: { long: ['行动力', '领导力', '魄力'], medium: ['务实', '毅力', '稳重'], short: ['执行力', '专注', '踏实'] },
                balanced: { long: ['适应力', '沟通力', '创造力'], medium: ['方向感', '毅力', '平衡感'], short: ['协调力', '坚持', '洞察力'] }
            };
            const keywords = kwPool[palmType][fingerType] || ['方向感', '毅力', '创造力'];
            const heartDesc = a.indexToRing > 1.02
                ? '感情线延伸至食指下方，弧度优美，代表你对感情有极高的理想和标准，追求精神层面的深度连接，容易被有思想深度的人吸引。'
                : a.indexToRing > 0.97
                ? '感情线在食指与中指之间结束，线条清晰而稳定，说明你在感情中既有热情也有理智，懂得在付出与自我保护之间保持平衡。'

        // ==========================================
        // Result Hero: artistic palm with glowing lines
        // ==========================================
        const resultHeroCanvas = document.getElementById('resultHeroCanvas');

        function renderResultHero(img, landmarks, palmType) {
            const W = 750, H = 900;
            resultHeroCanvas.width = W;
            resultHeroCanvas.height = H;
            resultHeroCanvas.style.aspectRatio = W + '/' + H;
            const ctx = resultHeroCanvas.getContext('2d');

            const iw = img.naturalWidth, ih = img.naturalHeight;
            const scale = Math.max(W / iw, H / ih);
            const sw = W / scale, sh = H / scale;
            const sx = (iw - sw) / 2, sy = (ih - sh) / 2;
            ctx.drawImage(img, sx, sy, sw, sh, 0, 0, W, H);

            // Desaturate + tint based on palm type
            const imageData = ctx.getImageData(0, 0, W, H);
            const d = imageData.data;
            const tints = {
                long:     { r: 0.55, g: 0.60, b: 0.85, sat: 0.25 },
                square:   { r: 0.80, g: 0.65, b: 0.50, sat: 0.30 },
                balanced: { r: 0.60, g: 0.75, b: 0.70, sat: 0.28 }
            };
            const t = tints[palmType] || tints.balanced;
            for (let i = 0; i < d.length; i += 4) {
                const gray = d[i] * 0.299 + d[i+1] * 0.587 + d[i+2] * 0.114;
                const desatR = gray + (d[i] - gray) * t.sat;
                const desatG = gray + (d[i+1] - gray) * t.sat;
                const desatB = gray + (d[i+2] - gray) * t.sat;
                d[i]   = Math.min(255, desatR * (0.6 + t.r * 0.7));
                d[i+1] = Math.min(255, desatG * (0.6 + t.g * 0.7));
                d[i+2] = Math.min(255, desatB * (0.6 + t.b * 0.7));
            }
            ctx.putImageData(imageData, 0, 0);

            // Soft vignette overlay
            const vg = ctx.createRadialGradient(W/2, H*0.45, W*0.15, W/2, H*0.45, W*0.75);
            vg.addColorStop(0, 'rgba(255,255,255,0)');
            vg.addColorStop(0.7, 'rgba(255,255,255,0.05)');
            vg.addColorStop(1, 'rgba(245,240,230,0.55)');
            ctx.fillStyle = vg;
            ctx.fillRect(0, 0, W, H);

            // Fade edges to background color
            const edgeFade = ctx.createLinearGradient(0, H - 120, 0, H);
            edgeFade.addColorStop(0, 'rgba(240,225,210,0)');
            edgeFade.addColorStop(1, 'rgba(240,225,210,0.95)');
            ctx.fillStyle = edgeFade;
            ctx.fillRect(0, H - 120, W, 120);

            const topFade = ctx.createLinearGradient(0, 0, 0, 80);
            topFade.addColorStop(0, 'rgba(240,225,210,0.6)');
            topFade.addColorStop(1, 'rgba(240,225,210,0)');
            ctx.fillStyle = topFade;
            ctx.fillRect(0, 0, W, 80);

            if (!landmarks || landmarks.length < 21) return;

            const lm = landmarks.map(p => ({ x: p.x * iw, y: p.y * ih }));
            const toCanvas = (pt) => ({
                x: (pt.x - sx) * scale,
                y: (pt.y - sy) * scale
            });

            const glowColors = {
                long:     { main: 'rgba(180,210,255,0.85)', glow: 'rgba(140,180,255,0.3)' },
                square:   { main: 'rgba(255,210,140,0.85)', glow: 'rgba(230,180,100,0.3)' },
                balanced: { main: 'rgba(180,230,200,0.85)', glow: 'rgba(150,210,180,0.3)' }
            };
            const gc = glowColors[palmType] || glowColors.balanced;

            function drawGlowLine(points, width) {
                if (points.length < 2) return;
                // Outer glow
                ctx.save();
                ctx.strokeStyle = gc.glow;
                ctx.lineWidth = width + 8;
                ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                ctx.filter = 'blur(6px)';
                ctx.beginPath();
                ctx.moveTo(points[0].x, points[0].y);
                for (let i = 1; i < points.length; i++) {
                    const prev = points[i - 1], curr = points[i];
                    const mx = (prev.x + curr.x) / 2, my = (prev.y + curr.y) / 2;
                    ctx.quadraticCurveTo(prev.x, prev.y, mx, my);
                }
                ctx.lineTo(points[points.length - 1].x, points[points.length - 1].y);
                ctx.stroke();
                ctx.restore();
                // Main line
                ctx.save();
                ctx.strokeStyle = gc.main;
                ctx.lineWidth = width;
                ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                ctx.shadowColor = gc.main;
                ctx.shadowBlur = 12;
                ctx.beginPath();
                ctx.moveTo(points[0].x, points[0].y);
                for (let i = 1; i < points.length; i++) {
                    const prev = points[i - 1], curr = points[i];
                    const mx = (prev.x + curr.x) / 2, my = (prev.y + curr.y) / 2;
                    ctx.quadraticCurveTo(prev.x, prev.y, mx, my);
                }
                ctx.lineTo(points[points.length - 1].x, points[points.length - 1].y);
                ctx.stroke();
                ctx.restore();
            }

            // Heart line: index MCP (5) → ring MCP area (13) → pinky MCP (17)
            const heartPts = [5, 9, 13, 17].map(i => toCanvas(lm[i]));
            // Curve it upward
            heartPts.forEach((p, i) => {
                if (i === 1) { p.y -= 15; p.x += 10; }
                if (i === 2) { p.y -= 8; }
            });
            drawGlowLine(heartPts, 2.5);

            // Head line: between index MCP and thumb, across to below pinky
            const headStart = toCanvas({
                x: (lm[5].x + lm[1].x) / 2,
                y: (lm[5].y + lm[0].y) * 0.48
            });
            const headMid1 = toCanvas({
                x: (lm[5].x + lm[9].x) / 2,
                y: (lm[5].y + lm[0].y) * 0.50
            });
            const headMid2 = toCanvas({
                x: (lm[9].x + lm[13].x) / 2,
                y: (lm[9].y + lm[0].y) * 0.52
            });
            const headEnd = toCanvas({
                x: lm[13].x + (lm[17].x - lm[13].x) * 0.4,
                y: (lm[13].y + lm[0].y) * 0.54
            });
            drawGlowLine([headStart, headMid1, headMid2, headEnd], 2.2);

            // Life line: arc from near index base curving around thumb
            const lifeStart = toCanvas({
                x: (lm[5].x + lm[1].x) / 2 - (lm[5].x - lm[1].x) * 0.1,
                y: (lm[5].y + lm[0].y) * 0.46
            });
            const lifeMid1 = toCanvas({
                x: lm[1].x + (lm[0].x - lm[1].x) * 0.3,
                y: lm[1].y + (lm[0].y - lm[1].y) * 0.4
            });
            const lifeMid2 = toCanvas({
                x: lm[1].x + (lm[0].x - lm[1].x) * 0.15,
                y: lm[1].y + (lm[0].y - lm[1].y) * 0.7
            });
            const lifeEnd = toCanvas({
                x: lm[0].x + (lm[1].x - lm[0].x) * 0.1,
                y: lm[0].y - (lm[0].y - lm[1].y) * 0.05
            });
            drawGlowLine([lifeStart, lifeMid1, lifeMid2, lifeEnd], 2.2);

            // Fate line (vertical from wrist up)
            const fateStart = toCanvas({
                x: (lm[0].x + lm[9].x) / 2,
                y: lm[0].y - (lm[0].y - lm[9].y) * 0.05
            });
            const fateMid = toCanvas({
                x: (lm[0].x + lm[9].x) / 2 + (lm[9].x - lm[0].x) * 0.05,
                y: (lm[0].y + lm[9].y) / 2
            });
            const fateEnd = toCanvas({
                x: lm[9].x,
                y: lm[9].y + (lm[0].y - lm[9].y) * 0.1
            });
            drawGlowLine([fateStart, fateMid, fateEnd], 1.8);

            // Landmark dots at key points
            const dotPts = [0, 5, 9, 13, 17, 4, 8, 12, 16, 20];
            ctx.save();
            dotPts.forEach(i => {
                const p = toCanvas(lm[i]);
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3.5, 0, Math.PI * 2);
                ctx.fillStyle = gc.main;
                ctx.shadowColor = gc.main;
                ctx.shadowBlur = 10;
                ctx.fill();
            });
            ctx.restore();
        }

        // ==========================================
        // Thumbnail
        // ==========================================
        function drawPalmThumb(img, landmarks) {
            const ctx = palmThumbCanvas.getContext('2d');
            const w = img.naturalWidth, h = img.naturalHeight;
            let sx, sy, sw, sh;
            if (landmarks && landmarks.length >= 21) {
                const palmPts = [0, 1, 2, 5, 9, 13, 17];
                let minX = Infinity, minY = Infinity, maxX = 0, maxY = 0;
                for (const i of palmPts) {
                    const px = landmarks[i].x * w, py = landmarks[i].y * h;
                    if (px < minX) minX = px; if (py < minY) minY = py;
                    if (px > maxX) maxX = px; if (py > maxY) maxY = py;
                }
                const padX = (maxX - minX) * 0.25, padY = (maxY - minY) * 0.25;
                minX = Math.max(0, minX - padX); minY = Math.max(0, minY - padY);
                maxX = Math.min(w, maxX + padX); maxY = Math.min(h, maxY + padY);
                const rw = maxX - minX, rh = maxY - minY;
                const side = Math.max(rw, rh);
                const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
                sx = Math.max(0, cx - side / 2); sy = Math.max(0, cy - side / 2);
                sw = Math.min(side, w - sx); sh = Math.min(side, h - sy);
            } else {
                const side = Math.min(w, h) * 0.45;
                sx = (w - side) / 2; sy = h * 0.25; sw = side; sh = side;
            }
            const dpr = window.devicePixelRatio || 2;
            palmThumbCanvas.width = 110 * dpr; palmThumbCanvas.height = 110 * dpr;
            palmThumbCanvas.style.width = '110px'; palmThumbCanvas.style.height = '110px';
            ctx.drawImage(img, sx, sy, sw, sh, 0, 0, 110 * dpr, 110 * dpr);
        }

                balanced: {

            const data = heroData[palmType] || heroData.balanced;
            palmHeroSvg.innerHTML = data.svg;
            palmHeroLabel.textContent = data.label;
            palmHeroSub.textContent = data.sub;

            requestAnimationFrame(() => palmHero.classList.add('visible'));

        // ==========================================
        // Result
        // ==========================================
        function showResult(segResult, landmarks) {
            traitsContainer.innerHTML = '';
            switchTo(sectionResult);

            if (segResult && segResult.roi_image) {
                const roiImg = new Image();
                roiImg.onload = () => {
                    const ctx = palmThumbCanvas.getContext('2d');
                    const dpr = window.devicePixelRatio || 2;
                    palmThumbCanvas.width = 110 * dpr; palmThumbCanvas.height = 110 * dpr;
                    palmThumbCanvas.style.width = '110px'; palmThumbCanvas.style.height = '110px';
                    ctx.drawImage(roiImg, 0, 0, 110 * dpr, 110 * dpr);
                };
                roiImg.src = segResult.roi_image;
            } else {
                drawPalmThumb(uploadedImage, landmarks);
            }

            const analysis = analyzePalm(landmarks);
            const reading = generateReading(analysis);

            const pt = reading.palmType || 'balanced';
            renderResultHero(uploadedImage, landmarks, pt);
            renderPalmHero(pt);

            keywordsGrid.innerHTML = reading.keywords.map((kw, i) =>
                `<div class="keyword-item">
                    <div class="keyword-icon">${reading.kwIcons[i]}</div>
                    <span class="keyword-label">${kw}</span>
                </div>`
            ).join('');

            const lines = [
                { name: '感情线', desc: reading.heartDesc },
                { name: '头脑线', desc: reading.headDesc },
                { name: '命运线', desc: reading.lifeDesc }
            ];
            linesSection.innerHTML = lines.map(l =>
                `<div class="line-row">
                    <span class="line-name">${l.name}</span>
                    <span class="line-desc">${l.desc}</span>
                </div>`
            ).join('');

            reading.traits.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'trait-card';
                card.innerHTML = `
                    <div class="trait-icon">${item.icon}</div>
                    <div>
                        <div class="trait-title">${item.title}</div>
                        <div class="trait-desc">${item.desc}</div>
                    </div>`;
                traitsContainer.appendChild(card);
                setTimeout(() => card.classList.add('visible'), 80 + index * 120);
            });
        }

        document.getElementById('shareBtn').addEventListener('click', () => {
            if (navigator.share) {
                navigator.share({ title: '手相解码', text: '我刚完成了手相解码分析！', url: location.href }).catch(() => {});
            } else {
                alert('报告已保存！长按图片即可分享给好友');
            }
        });

        app.classList.add('home-active');
    </script>
