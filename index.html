<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>手相解码 - 读懂掌心纹路，读懂你的天生底色</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(180deg, #FDF5E6 0%, #F5E6D3 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .page {
            max-width: 414px;
            margin: 0 auto;
            min-height: 100vh;
            position: relative;
        }

        /* 头部 */
        .header {
            padding: 60px 24px 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .header-left h1 {
            font-size: 28px;
            font-weight: 700;
            color: #2D2D2D;
            margin-bottom: 8px;
        }

        .header-left p {
            font-size: 14px;
            color: #8C7B6B;
        }

        .close-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #F5F0EB;
            border: none;
            font-size: 18px;
            color: #666;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        /* 首页 - 拍照页面 */
        .page-home {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-top: 120px;
        }

        .photo-btn {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: linear-gradient(135deg, #C9A96E 0%, #B8956A 100%);
            border: none;
            color: white;
            font-size: 24px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 12px 40px rgba(201, 169, 110, 0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .photo-btn:active {
            transform: scale(0.95);
            box-shadow: 0 8px 24px rgba(201, 169, 110, 0.3);
        }

        .photo-hint {
            margin-top: 24px;
            font-size: 13px;
            color: #A89580;
        }

        /* 扫描页面 */
        .page-scan {
            display: none;
            padding: 0 20px;
        }

        .scan-container {
            position: relative;
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            margin-top: 10px;
        }

        .scan-container img {
            width: 100%;
            display: block;
        }

        .scan-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        .scan-line {
            position: absolute;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, #C9A96E, transparent);
            animation: scanMove 2.5s ease-in-out infinite;
            box-shadow: 0 0 20px rgba(201, 169, 110, 0.6);
        }

        @keyframes scanMove {
            0% { top: 0%; }
            50% { top: 95%; }
            100% { top: 0%; }
        }

        .scan-grid {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                linear-gradient(rgba(201, 169, 110, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(201, 169, 110, 0.1) 1px, transparent 1px);
            background-size: 25% 25%;
        }

        .scan-dots {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        .scan-dot {
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #FFD700;
            animation: dotPulse 1.5s ease-in-out infinite;
            box-shadow: 0 0 8px rgba(255, 215, 0, 0.6);
        }

        .scan-dot:nth-child(1) { top: 35%; left: 40%; animation-delay: 0s; }
        .scan-dot:nth-child(2) { top: 40%; left: 60%; animation-delay: 0.3s; }
        .scan-dot:nth-child(3) { top: 55%; left: 35%; animation-delay: 0.6s; }
        .scan-dot:nth-child(4) { top: 60%; left: 55%; animation-delay: 0.9s; }
        .scan-dot:nth-child(5) { top: 70%; left: 45%; animation-delay: 1.2s; }

        @keyframes dotPulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.5); opacity: 1; }
        }

        .scan-progress {
            margin-top: 20px;
            text-align: center;
        }

        .scan-text {
            font-size: 16px;
            color: #2D2D2D;
            margin-bottom: 12px;
        }

        .progress-bar {
            width: 80%;
            height: 4px;
            background: #E8DED0;
            border-radius: 2px;
            margin: 0 auto;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #C9A96E, #FFD700);
            border-radius: 2px;
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-secondary {
            position: absolute;
            top: 0;
            right: 0;
            height: 100%;
            background: #E8DED0;
            width: 100%;
        }

        /* 结果页面 */
        .page-result {
            display: none;
            padding: 0 20px 40px;
        }

        .result-image-section {
            position: relative;
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            margin-top: 10px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .result-image-section img {
            width: 100%;
            display: block;
        }

        .palm-annotation {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        .palm-line {
            position: absolute;
            pointer-events: none;
        }

        .palm-line svg {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        .line-label {
            position: absolute;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            padding: 3px 10px;
            font-size: 11px;
            font-weight: 600;
            color: #2D2D2D;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            white-space: nowrap;
        }

        .line-label .num {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #C9A96E;
            color: white;
            font-size: 10px;
            margin-right: 4px;
        }

        /* 标签区域 */
        .tags-section {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .tag-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            background: white;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            color: #2D2D2D;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .tag-item .tag-num {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #C9A96E;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
        }

        .tags-desc {
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
            color: #6B5E50;
            line-height: 1.8;
        }

        /* 分析卡片 */
        .analysis-section {
            margin-top: 32px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            color: #2D2D2D;
            margin-bottom: 20px;
            padding-left: 4px;
        }

        .analysis-card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 16px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
        }

        .analysis-card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .analysis-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, #FDF5E6, #F5E6D3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .analysis-card-title {
            font-size: 17px;
            font-weight: 600;
            color: #2D2D2D;
        }

        .analysis-card-subtitle {
            font-size: 12px;
            color: #A89580;
            margin-top: 2px;
        }

        .analysis-detail {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #F5F0EB;
        }

        .detail-row {
            display: flex;
            margin-bottom: 10px;
            line-height: 1.6;
        }

        .detail-label {
            font-size: 12px;
            color: #A89580;
            min-width: 70px;
            flex-shrink: 0;
            padding-top: 2px;
        }

        .detail-content {
            font-size: 14px;
            color: #4A4A4A;
        }

        /* 底部分享 */
        .share-section {
            margin-top: 32px;
            text-align: center;
            padding-bottom: 40px;
        }

        .share-btn {
            width: 100%;
            padding: 16px;
            border-radius: 28px;
            background: linear-gradient(135deg, #C9A96E 0%, #B8956A 100%);
            border: none;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(201, 169, 110, 0.3);
        }

        .share-btn:active {
            transform: scale(0.98);
        }

        .disclaimer {
            margin-top: 16px;
            font-size: 11px;
            color: #BFAE9D;
            line-height: 1.6;
        }

        /* 隐藏的文件输入 */
        #cameraInput {
            display: none;
        }

        /* 动画 */
        .fade-in {
            animation: fadeIn 0.6s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .slide-up {
            animation: slideUp 0.5s ease forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

                interpretation: '神秘十字纹在手相学中极为少见，主第六感敏锐。月丘饱满者想象力丰富，常有灵感涌现。',
                trend: '适合从事创意、艺术、心理或灵性相关领域。梦境中可能获得有价值的启示。',
                action: '建议在床头放一本笔记本，记录梦境和突发灵感，定期整理可能发现有价值的洞察。'
            },
            {
                icon: '⚖️',
                title: '内外平衡与成长',
                subtitle: '掌纹综合评估',
                feature: '三大主线（生命线、智慧线、感情线）间距匀称，掌心纹路细密但不杂乱。',
                interpretation: '三线均衡代表身、心、情的协调发展。细密纹路表示内心世界丰富，对生活有细腻的感知力。',
                trend: '当前处于人生上升期，内外兼修是未来3-5年的主旋律。需要注意工作与生活的平衡。',
                action: '建议建立"身心平衡"日程表：工作日专注效率，周末留给家人和自我滋养，动静结合。'
            }
        ];

        // 拍照按钮点击
        photoBtn.addEventListener('click', () => {
            cameraInput.click();
        });

        // 文件选择后
        cameraInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                const imageUrl = event.target.result;
                scanImage.src = imageUrl;
                resultImage.src = imageUrl;
                startScan();
            };
            reader.readAsDataURL(file);
        });

        // 开始扫描
        function startScan() {
            pageHome.style.display = 'none';
            pageScan.style.display = 'block';
            pageScan.classList.add('fade-in');

            let progress = 0;
            let textIndex = 0;

            const interval = setInterval(() => {
                progress += 2;
                progressFill.style.width = progress + '%';

                if (progress % 20 === 0 && textIndex < scanTexts.length) {
                    scanText.textContent = scanTexts[textIndex];
                    textIndex++;
                }

                if (progress >= 100) {
                    clearInterval(interval);
                    setTimeout(showResult, 500);
                }
            }, 80);
        }

        // 显示结果
        function showResult() {
            pageScan.style.display = 'none';
            pageResult.style.display = 'block';
            pageResult.classList.add('fade-in');

            // 逐步加载分析卡片
            renderAnalysisCards();
        }

        // 渲染分析卡片
        function renderAnalysisCards() {
            const titleEl = analysisSection.querySelector('.section-title');
            
            analysisData.forEach((item, index) => {
                setTimeout(() => {
                    const card = document.createElement('div');
                    card.className = 'analysis-card slide-up';
                    card.innerHTML = `
                        <div class="analysis-card-header">
                            <div class="analysis-icon">${item.icon}</div>
                            <div>
                                <div class="analysis-card-title">${item.title}</div>
                                <div class="analysis-card-subtitle">${item.subtitle}</div>
                            </div>
                        </div>
                        <div class="analysis-detail">
                            <div class="detail-row">
                                <span class="detail-label">可见特征</span>
                                <span class="detail-content">${item.feature}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">玄学解释</span>
                                <span class="detail-content">${item.interpretation}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">趋势提示</span>
                                <span class="detail-content">${item.trend}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">行动建议</span>
                                <span class="detail-content">${item.action}</span>
                            </div>
                        </div>
                    `;
                    analysisSection.appendChild(card);
                }, index * 150);
            });
        }

        // 分享按钮
        document.getElementById('shareBtn').addEventListener('click', () => {
            if (navigator.share) {
                navigator.share({
                    title: '手相解码 - 我的掌纹分析报告',
                    text: '我刚完成了手相解码分析，来看看你的掌纹密码吧！',
                    url: window.location.href
                }).catch(() => {});
            } else {
                alert('报告已保存！长按图片即可分享给好友');
            }
        });
    </script>
</body>
</html>
