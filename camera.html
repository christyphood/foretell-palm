<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>手相解码 - 拍照识别</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'PingFang TC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(197deg, #EEDFBA 5.46%, #EFDCD0 71.37%);
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        
        .page {
            max-width: 750px;
            margin: 0 auto;
            min-height: 100vh;
            position: relative;
            padding: 0 22px;
        }
        
        .status-bar {
            height: 45px;
            padding: 12px 20px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
            font-weight: 600;
            color: #0c0b0b;
        }
        
        .status-time {
            font-weight: 600;
        }
        
        .status-icons {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .header {
            padding: 24px 22px 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        
        .header-content {
            flex: 1;
        }
        
        .header-title {
            font-family: 'PingFang SC', -apple-system, sans-serif;
            font-size: 21px;
            font-weight: 700;
            color: #000;
            line-height: 1.2;
            margin-bottom: 6px;
        }
        
        .header-subtitle {
            font-size: 11px;
            color: #4a4a4a;
            line-height: 1.5;
        }
        
        .close-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1.7px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        
        .close-btn:active {
            transform: scale(0.95);
        }
        
        .close-btn svg {
            width: 18px;
            height: 18px;
            color: #000;
        }
        
        .camera-container {
            position: relative;
            width: calc(100% - 38px);
            max-width: 337px;
            aspect-ratio: 674 / 982;
            margin: 10px auto 0;
            background: rgba(255, 255, 255, 0.46);
            backdrop-filter: blur(7.8px);
            -webkit-backdrop-filter: blur(7.8px);
            border: 1px solid rgba(255, 255, 255, 0.19);
            border-radius: 20px;
            overflow: hidden;
        }
        
        .camera-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .camera-video.front-camera {
            transform: scaleX(-1);
        }
        
        .hand-guide {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 65%;
            max-width: 200px;
            height: auto;
            pointer-events: none;
            z-index: 2;
            transition: opacity 0.3s ease;
        }
        
        .hand-guide.detected {
            opacity: 0.1;
        }
        
        .camera-frame {
            position: absolute;
            top: 8%;
            left: 8%;
            right: 8%;
            bottom: 8%;
            border: 2px dashed rgba(58, 42, 26, 0.2);
            border-radius: 16px;
            pointer-events: none;
            z-index: 3;
        }
        
        .camera-placeholder {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #4a4a4a;
            z-index: 1;
        }
        
        .camera-placeholder-icon {
            width: 48px;
            height: 48px;
            margin-bottom: 12px;
            opacity: 0.5;
        }
        
        .camera-placeholder-text {
            font-size: 14px;
            opacity: 0.7;
        }
        
        .detection-status {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 16px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 20px;
            font-size: 12px;
            color: white;
            z-index: 10;
            display: none;
            white-space: nowrap;
        }
        
        .detection-status.visible {
            display: block;
        }
        
        .detection-status.success {
            background: rgba(76, 175, 80, 0.85);
        }
        
        .hint-text {
            text-align: center;
            margin-top: 24px;
            font-size: 16px;
            color: #3a2a1a;
            line-height: 1.5;
        }
        
        .upload-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 20px;
            cursor: pointer;
            padding: 12px;
        }
        
        .upload-section:active {
            opacity: 0.7;
        }
        
        .upload-text {
            font-size: 16px;
            color: #3a2a1a;
        }
        
        .upload-icon {
            width: 18px;
            height: 18px;
            color: #3a2a1a;
        }
        
        .processing-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        
        .processing-overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }
        
        .processing-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: #C9A96E;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .processing-text {
            margin-top: 16px;
            color: white;
            font-size: 16px;
        }
        
        #fileInput {
            display: none;
        }
        
        .fade-in {
            animation: fadeIn 0.4s ease forwards;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="status-bar">
            <span class="status-time">10:00</span>
            <div class="status-icons">
                <svg width="17" height="12" viewBox="0 0 17 12" fill="none">
                    <path d="M1 9H3V12H1V9Z" fill="#0c0b0b"/>
                    <path d="M5 6H7V12H5V6Z" fill="#0c0b0b"/>
                    <path d="M9 3H11V12H9V3Z" fill="#0c0b0b"/>
                    <path d="M13 0H15V12H13V0Z" fill="#0c0b0b"/>
                </svg>
                <svg width="16" height="12" viewBox="0 0 16 12" fill="none">
                    <path d="M8 2.5C10.5 2.5 12.7 3.5 14.3 5.1L16 3.4C14 1.3 11.1 0 8 0C4.9 0 2 1.3 0 3.4L1.7 5.1C3.3 3.5 5.5 2.5 8 2.5ZM8 5.5C9.4 5.5 10.7 6 11.7 6.9L13.4 5.2C12 3.9 10.1 3 8 3C5.9 3 4 3.9 2.6 5.2L4.3 6.9C5.3 6 6.6 5.5 8 5.5ZM8 8.5C7.2 8.5 6.5 8.8 5.9 9.3L8 12L10.1 9.3C9.5 8.8 8.8 8.5 8 8.5Z" fill="#0c0b0b"/>
                </svg>
                <svg width="25" height="12" viewBox="0 0 25 12" fill="none">
                    <rect x="0.5" y="0.5" width="21" height="11" rx="2.5" stroke="#0c0b0b"/>
                    <rect x="2" y="2" width="18" height="8" rx="1" fill="#0c0b0b"/>
                    <path d="M23 4V8C24.1 7.5 24.1 4.5 23 4Z" fill="#0c0b0b"/>
                </svg>
            </div>
        </div>
        
        <div class="header fade-in">
            <div class="header-content">
                <h1 class="header-title">手相解码</h1>
                <p class="header-subtitle">读懂掌心纹路，读懂你的天生底色</p>
            </div>
            <button class="close-btn" id="closeBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
        
        <div class="camera-container fade-in">
            <video id="cameraVideo" class="camera-video" autoplay playsinline muted></video>
            
            <div class="camera-placeholder" id="cameraPlaceholder">
                <svg class="camera-placeholder-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                    <circle cx="12" cy="13" r="4"></circle>
                </svg>
                <p class="camera-placeholder-text">正在启动相机...</p>
            </div>
            
            <div class="camera-frame"></div>
            
            <svg id="handGuide" class="hand-guide" viewBox="0 0 200 280" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M100 260 C50 260 25 200 25 140 C25 100 35 70 50 50 C60 35 75 25 100 25 C125 25 140 35 150 50 C165 70 175 100 175 140 C175 200 150 260 100 260 Z" 
                      stroke="#3a2a1a" stroke-width="1.5" fill="none" opacity="0.3"/>
                <path d="M45 120 L45 90 C45 70 50 55 55 45 L55 20" stroke="#3a2a1a" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.3"/>
                <path d="M70 100 L70 40 C70 25 75 15 80 10" stroke="#3a2a1a" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.3"/>
                <path d="M100 95 L100 30 C100 15 100 8 100 5" stroke="#3a2a1a" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.3"/>
                <path d="M130 100 L130 40 C130 25 125 15 120 10" stroke="#3a2a1a" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.3"/>
                <path d="M155 120 L155 90 C155 70 150 55 145 45 L145 20" stroke="#3a2a1a" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.3"/>
                <ellipse cx="55" cy="18" rx="8" ry="10" stroke="#3a2a1a" stroke-width="1" fill="none" opacity="0.25"/>
                <ellipse cx="80" cy="8" rx="8" ry="10" stroke="#3a2a1a" stroke-width="1" fill="none" opacity="0.25"/>
                <ellipse cx="100" cy="5" rx="8" ry="10" stroke="#3a2a1a" stroke-width="1" fill="none" opacity="0.25"/>
                <ellipse cx="120" cy="8" rx="8" ry="10" stroke="#3a2a1a" stroke-width="1" fill="none" opacity="0.25"/>
                <ellipse cx="145" cy="18" rx="8" ry="10" stroke="#3a2a1a" stroke-width="1" fill="none" opacity="0.25"/>
                <path d="M60 160 C75 155 85 145 100 145 C115 145 125 155 140 160" stroke="#3a2a1a" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.2" stroke-dasharray="4 4"/>
                <path d="M55 180 C70 175 85 165 100 165 C115 165 130 175 145 180" stroke="#3a2a1a" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.2" stroke-dasharray="4 4"/>
                <path d="M50 200 C65 195 80 185 100 185 C120 185 135 195 150 200" stroke="#3a2a1a" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.2" stroke-dasharray="4 4"/>
            </svg>
            
            <div class="detection-status" id="detectionStatus">检测中...</div>
        </div>
        
        <p class="hint-text fade-in">手掌张开，对准手型</p>
        
        <div class="upload-section fade-in" id="uploadSection">
            <span class="upload-text">上传图片</span>
            <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
        </div>
        
        <input type="file" id="fileInput" accept="image/*">
    </div>
    
    <div class="processing-overlay" id="processingOverlay">
        <div class="processing-spinner"></div>
        <p class="processing-text">正在识别手掌...</p>
    </div>
    
    <script type="module">
        const cameraVideo = document.getElementById('cameraVideo');
        const cameraPlaceholder = document.getElementById('cameraPlaceholder');
        const handGuide = document.getElementById('handGuide');
        const detectionStatus = document.getElementById('detectionStatus');
        const closeBtn = document.getElementById('closeBtn');
        const uploadSection = document.getElementById('uploadSection');
        const fileInput = document.getElementById('fileInput');
        const processingOverlay = document.getElementById('processingOverlay');
        
        let stream = null;
        let handLandmarker = null;
        let isDetecting = false;
        let palmDetectedCount = 0;
        let isFrontCamera = false;
        let lastPalmCenter = null;
        const DETECTION_THRESHOLD = 10;
        const STABILITY_THRESHOLD = 0.02;
        
        closeBtn.addEventListener('click', () => {
            stopCamera();
            window.location.href = 'index.html';
        });
        
        uploadSection.addEventListener('click', () => fileInput.click());
        
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                processUploadedImage(file);
            }
        });
        
        async function initCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: { ideal: 'environment' },
                        width: { ideal: 1280 },
                        height: { ideal: 960 }
                    },
                    audio: false
                });
                
                const track = stream.getVideoTracks()[0];
                const settings = track.getSettings();
                isFrontCamera = settings.facingMode === 'user';
                
                if (isFrontCamera) {
                    cameraVideo.classList.add('front-camera');
                }
                
                cameraVideo.srcObject = stream;
                cameraVideo.onloadedmetadata = () => {
                    cameraPlaceholder.style.display = 'none';
                    initHandDetection();
                };
            } catch (err) {
                console.error('Camera error:', err);
                try {
                    stream = await navigator.mediaDevices.getUserMedia({
                        video: {
                            facingMode: 'user',
                            width: { ideal: 1280 },
                            height: { ideal: 960 }
                        },
                        audio: false
                    });
                    isFrontCamera = true;
                    cameraVideo.classList.add('front-camera');
                    cameraVideo.srcObject = stream;
                    cameraVideo.onloadedmetadata = () => {
                        cameraPlaceholder.style.display = 'none';
                        initHandDetection();
                    };
                } catch (fallbackErr) {
                    console.error('Fallback camera error:', fallbackErr);
                    cameraPlaceholder.querySelector('.camera-placeholder-text').textContent = '无法访问相机，请上传图片';
                }
            }
        }
        
        async function initHandDetection() {
            try {
                const { HandLandmarker, FilesetResolver } = await import(
                    'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm'
                );
                
                const wasmPath = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm';
                const fileset = await FilesetResolver.forVisionTasks(wasmPath);
                
                handLandmarker = await HandLandmarker.createFromOptions(fileset, {
                    baseOptions: {
                        modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
                        delegate: 'GPU'
                    },
                    runningMode: 'VIDEO',
                    numHands: 1
                });
                
                isDetecting = true;
                detectLoop();
                
            } catch (err) {
                console.warn('Hand detection init failed:', err);
            }
        }
        
        function detectLoop() {
            if (!isDetecting || !handLandmarker || !cameraVideo.videoWidth) {
                if (isDetecting) requestAnimationFrame(detectLoop);
                return;
            }
            
            try {
                const result = handLandmarker.detectForVideo(cameraVideo, performance.now());
                
                if (result.landmarks && result.landmarks.length > 0) {
                    const landmarks = result.landmarks[0];
                    
                    if (isPalmOpen(landmarks)) {
                        const palmCenter = getPalmCenter(landmarks);
                        const isStable = isPalmStable(palmCenter);
                        lastPalmCenter = palmCenter;
                        
                        if (isStable) {
                            palmDetectedCount++;
                            handGuide.classList.add('detected');
                            detectionStatus.textContent = `手掌已识别，保持不动 (${palmDetectedCount}/${DETECTION_THRESHOLD})`;
                            detectionStatus.classList.add('visible', 'success');
                            
                            if (palmDetectedCount >= DETECTION_THRESHOLD) {
                                captureAndProcess();
                                return;
                            }
                        } else {
                            palmDetectedCount = Math.max(0, palmDetectedCount - 2);
                            handGuide.classList.add('detected');
                            detectionStatus.textContent = '请保持手掌稳定';
                            detectionStatus.classList.add('visible');
                            detectionStatus.classList.remove('success');
                        }
                    } else {
                        palmDetectedCount = Math.max(0, palmDetectedCount - 1);
                        lastPalmCenter = null;
                        handGuide.classList.remove('detected');
                        detectionStatus.textContent = '请张开手掌';
                        detectionStatus.classList.add('visible');
                        detectionStatus.classList.remove('success');
                    }
                } else {
                    palmDetectedCount = Math.max(0, palmDetectedCount - 1);
                    lastPalmCenter = null;
                    handGuide.classList.remove('detected');
                    detectionStatus.textContent = '未检测到手掌';
                    detectionStatus.classList.add('visible');
                    detectionStatus.classList.remove('success');
                }
            } catch (err) {
                console.warn('Detection error:', err);
            }
            
            requestAnimationFrame(detectLoop);
        }
        
        function getPalmCenter(landmarks) {
            const wrist = landmarks[0];
            const middleMcp = landmarks[9];
            const indexMcp = landmarks[5];
            const pinkyMcp = landmarks[17];
            return {
                x: (wrist.x + middleMcp.x + indexMcp.x + pinkyMcp.x) / 4,
                y: (wrist.y + middleMcp.y + indexMcp.y + pinkyMcp.y) / 4
            };
        }
        
        function isPalmStable(currentCenter) {
            if (!lastPalmCenter) return true;
            const dx = currentCenter.x - lastPalmCenter.x;
            const dy = currentCenter.y - lastPalmCenter.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            return distance < STABILITY_THRESHOLD;
        }
        
        function isPalmOpen(landmarks) {
            if (!landmarks || landmarks.length < 21) return false;
            
            const wrist = landmarks[0];
            const middleMcp = landmarks[9];
            const indexTip = landmarks[8];
            const middleTip = landmarks[12];
            const ringTip = landmarks[16];
            const pinkyTip = landmarks[20];
            const thumbTip = landmarks[4];
            
            const palmToMiddle = Math.hypot(middleMcp.x - wrist.x, middleMcp.y - wrist.y);
            
            const indexExtended = Math.hypot(indexTip.x - wrist.x, indexTip.y - wrist.y) > palmToMiddle * 1.3;
            const middleExtended = Math.hypot(middleTip.x - wrist.x, middleTip.y - wrist.y) > palmToMiddle * 1.3;
            const ringExtended = Math.hypot(ringTip.x - wrist.x, ringTip.y - wrist.y) > palmToMiddle * 1.3;
            const pinkyExtended = Math.hypot(pinkyTip.x - wrist.x, pinkyTip.y - wrist.y) > palmToMiddle * 1.2;
            const thumbExtended = Math.hypot(thumbTip.x - landmarks[2].x, thumbTip.y - landmarks[2].y) > palmToMiddle * 0.4;
            
            const extendedCount = [indexExtended, middleExtended, ringExtended, pinkyExtended, thumbExtended].filter(Boolean).length;
            
            return extendedCount >= 4;
        }
        
        function captureAndProcess() {
            isDetecting = false;
            processingOverlay.classList.add('visible');
            
            const canvas = document.createElement('canvas');
            canvas.width = cameraVideo.videoWidth;
            canvas.height = cameraVideo.videoHeight;
            const ctx = canvas.getContext('2d');
            
            if (isFrontCamera) {
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
            }
            ctx.drawImage(cameraVideo, 0, 0);
            
            const imageData = canvas.toDataURL('image/jpeg', 0.9);
            
            stopCamera();
            
            localStorage.setItem('palmImage', imageData);
            
            setTimeout(() => {
                window.location.href = 'index.html?captured=true';
            }, 500);
        }
        
        function processUploadedImage(file) {
            processingOverlay.classList.add('visible');
            
            const reader = new FileReader();
            reader.onload = (e) => {
                localStorage.setItem('palmImage', e.target.result);
                stopCamera();
                setTimeout(() => {
                    window.location.href = 'index.html?captured=true';
                }, 500);
            };
            reader.readAsDataURL(file);
        }
        
        function stopCamera() {
            isDetecting = false;
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
        }
        
        window.addEventListener('beforeunload', stopCamera);
        
        initCamera();
    </script>
</body>
</html>
