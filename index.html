<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>手相解码</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'PingFang TC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(197deg, #EEDFBA 5.46%, #EFDCD0 71.37%);
            min-height: 100vh;
            overflow-x: hidden;
        }
        .page { max-width: 414px; margin: 0 auto; min-height: 100vh; position: relative; }

        /* Header */
        .header {
            padding: 60px 24px 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .header h1 { font-size: 21px; font-weight: 700; color: #000; line-height: 1.2; margin-bottom: 4px; }
        .header p { font-size: 11px; color: #4a4a4a; }
        .close-btn {
            width: 34px; height: 34px; border-radius: 50%;
            background: rgba(255,255,255,0.55);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            border: 1.7px solid rgba(255,255,255,0.1);
            display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .close-btn:active { transform: scale(0.95); }

        /* ========== Page 1: Home ========== */
        .page-home {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; padding-top: 28vh;
        }
        .start-btn {
            width: 180px; height: 180px; border-radius: 50%;
            background: linear-gradient(135deg, #C9A96E 0%, #B8956A 100%);
            border: none; color: white; font-size: 20px; font-weight: 600;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 12px 40px rgba(201,169,110,0.4);
            transition: transform 0.3s ease;
            letter-spacing: 1px;
        }
        .start-btn:active { transform: scale(0.95); }

        /* ========== Page 2: Scan ========== */
        .page-scan { display: none; padding: 0 20px; }
        .scan-box {
            position: relative; width: 100%;
            aspect-ratio: 674 / 982;
            margin: 10px auto 0;
            background: rgba(255,255,255,0.46);
            backdrop-filter: blur(7.8px); -webkit-backdrop-filter: blur(7.8px);
            border: 1px solid rgba(255,255,255,0.19);
            border-radius: 20px; overflow: hidden;
        }
        .scan-box img {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; object-fit: cover;
        }
        .scan-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
        .scan-grid {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background:
                linear-gradient(rgba(201,169,110,0.12) 1px, transparent 1px),
                linear-gradient(90deg, rgba(201,169,110,0.12) 1px, transparent 1px);
            background-size: 25% 25%;
        }
        .scan-line {
            position: absolute; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, transparent, #C9A96E, transparent);
            animation: scanMove 2.5s ease-in-out infinite;
            box-shadow: 0 0 20px rgba(201,169,110,0.6);
        }
        @keyframes scanMove { 0% { top: 0%; } 50% { top: 95%; } 100% { top: 0%; } }
        .scan-dots { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
        .scan-dot {
            position: absolute; width: 12px; height: 12px; border-radius: 50%;
            background: #FFD700; animation: dotPulse 1.5s ease-in-out infinite;
            box-shadow: 0 0 8px rgba(255,215,0,0.6);
        }
        .scan-dot:nth-child(1) { top: 35%; left: 40%; animation-delay: 0s; }
        .scan-dot:nth-child(2) { top: 40%; left: 60%; animation-delay: 0.3s; }
        .scan-dot:nth-child(3) { top: 55%; left: 35%; animation-delay: 0.6s; }
        .scan-dot:nth-child(4) { top: 60%; left: 55%; animation-delay: 0.9s; }
        .scan-dot:nth-child(5) { top: 70%; left: 45%; animation-delay: 1.2s; }
        @keyframes dotPulse { 0%,100% { transform: scale(1); opacity: .8; } 50% { transform: scale(1.5); opacity: 1; } }
        .scan-progress { margin-top: 20px; text-align: center; }
        .scan-text { font-size: 16px; color: #3a2a1a; margin-bottom: 12px; }
        .progress-bar { width: 80%; height: 4px; background: #E8DED0; border-radius: 2px; margin: 0 auto; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #C9A96E, #FFD700); border-radius: 2px; width: 0%; transition: width 0.3s ease; }

        /* ========== Page 3: Result ========== */
        .page-result { display: none; padding: 0 20px 40px; }

        .result-top-card {
            background: rgba(255,255,255,0.65);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 20px; padding: 20px; margin-top: 10px;
        }
        .result-top-row { display: flex; gap: 16px; align-items: flex-start; }
        .palm-thumb {
            width: 100px; height: 130px; border-radius: 14px;
            object-fit: cover; flex-shrink: 0;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }
        .keywords-section { flex: 1; }
        .keywords-title { font-size: 16px; font-weight: 700; color: #2D2D2D; margin-bottom: 12px; }
        .keywords-grid { display: flex; gap: 16px; justify-content: flex-start; }
        .keyword-item { display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .keyword-icon {
            width: 40px; height: 40px; border-radius: 12px;
            background: rgba(255,255,255,0.8);
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
        }
        .keyword-label { font-size: 11px; color: #4a4a4a; }

        .lines-section { margin-top: 20px; padding-top: 16px; border-top: 1px solid rgba(0,0,0,0.06); }
        .line-row { display: flex; margin-bottom: 14px; gap: 12px; line-height: 1.6; }
        .line-row:last-child { margin-bottom: 0; }
        .line-name {
            font-size: 13px; font-weight: 600; color: #3a2a1a;
            min-width: 52px; flex-shrink: 0; padding-top: 1px;
        }
        .line-desc { font-size: 13px; color: #4a4a4a; }

        .traits-section { margin-top: 28px; }
        .traits-title { font-size: 20px; font-weight: 700; color: #2D2D2D; margin-bottom: 16px; padding-left: 4px; }
        .trait-card {
            background: rgba(255,255,255,0.65);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 16px; padding: 20px; margin-bottom: 12px;
            display: flex; gap: 14px; align-items: flex-start;
        }
        .trait-icon {
            width: 42px; height: 42px; border-radius: 12px;
            background: linear-gradient(135deg, #FDF5E6, #F5E6D3);
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; flex-shrink: 0;
        }
        .trait-title { font-size: 16px; font-weight: 600; color: #2D2D2D; margin-bottom: 4px; }
        .trait-desc { font-size: 13px; color: #6B5E50; line-height: 1.6; }

        .share-section { margin-top: 28px; text-align: center; padding-bottom: 40px; }
        .share-btn {
            width: 100%; padding: 16px; border-radius: 28px;
            background: linear-gradient(135deg, #C9A96E 0%, #B8956A 100%);
            border: none; color: white; font-size: 16px; font-weight: 600;
            cursor: pointer; box-shadow: 0 8px 24px rgba(201,169,110,0.3);
        }
        .share-btn:active { transform: scale(0.98); }
        .disclaimer { margin-top: 16px; font-size: 11px; color: #BFAE9D; line-height: 1.6; }

        /* Animations */
        .fade-in { animation: fadeIn 0.6s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .slide-up { animation: slideUp 0.5s ease forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        #cameraInput { display: none; }
    </style>
</head>
<body>
    <div class="page">
        <div class="header">
            <div>
                <h1>手相解码</h1>
                <p>读懂掌心纹路，读懂你的天生底色</p>
            </div>
            <button class="close-btn" onclick="history.back()">✕</button>
        </div>

        <!-- Page 1: Home -->
        <div class="page-home" id="pageHome">
            <button class="start-btn" id="startBtn">开始手相占卜</button>
        </div>

        <!-- Page 2: Scanning -->
        <div class="page-scan" id="pageScan">
            <div class="scan-box">
                <img id="scanImage" src="" alt="手掌照片">
                <div class="scan-overlay">
                    <div class="scan-grid"></div>
                    <div class="scan-line"></div>
                    <div class="scan-dots">
                        <div class="scan-dot"></div>
                        <div class="scan-dot"></div>
                        <div class="scan-dot"></div>
                        <div class="scan-dot"></div>
                        <div class="scan-dot"></div>
                    </div>
                </div>
            </div>
            <div class="scan-progress">
                <p class="scan-text" id="scanText">正在分析掌纹...</p>
                <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
            </div>
        </div>

        <!-- Page 3: Result -->
        <div class="page-result" id="pageResult">
            <div class="result-top-card fade-in">
                <div class="result-top-row">
                    <img id="palmThumb" class="palm-thumb" src="" alt="掌纹">
                    <div class="keywords-section">
                        <div class="keywords-title">关键词</div>
                        <div class="keywords-grid" id="keywordsGrid"></div>
                    </div>
                </div>
                <div class="lines-section" id="linesSection"></div>
            </div>

            <div class="traits-section">
                <h2 class="traits-title">你的基本特质</h2>
                <div id="traitsContainer"></div>
            </div>

            <div class="share-section">
                <button class="share-btn" id="shareBtn">保存报告 · 分享给好友</button>
                <p class="disclaimer">* 本结果仅供娱乐参考，不构成任何医学或命理建议</p>
            </div>
        </div>

        <input type="file" id="cameraInput" accept="image/*" capture="environment">
    </div>

    <script>
        const pageHome = document.getElementById('pageHome');
        const pageScan = document.getElementById('pageScan');
        const pageResult = document.getElementById('pageResult');
        const startBtn = document.getElementById('startBtn');
        const scanImage = document.getElementById('scanImage');
        const scanText = document.getElementById('scanText');
        const progressFill = document.getElementById('progressFill');
        const palmThumb = document.getElementById('palmThumb');
        const keywordsGrid = document.getElementById('keywordsGrid');
        const linesSection = document.getElementById('linesSection');
        const traitsContainer = document.getElementById('traitsContainer');

        let uploadedImage = null;

        // ==========================================
        // API base
        // ==========================================
        function getPalmApiBase() {
            const params = new URLSearchParams(location.search);
            let fromQuery = params.get('api');
            if (fromQuery) {
                try { fromQuery = decodeURIComponent(fromQuery.trim()); localStorage.setItem('palmApiBase', fromQuery); } catch (_) {}
            }
            if (!fromQuery && location.hash && location.hash.startsWith('#api=')) {
                try { fromQuery = decodeURIComponent(location.hash.slice(5).split('&')[0].trim()); if (fromQuery.startsWith('http')) localStorage.setItem('palmApiBase', fromQuery); } catch (_) {}
            }
            if (fromQuery) {
                try { const u = new URL(fromQuery); if (u.protocol !== 'https:' && u.protocol !== 'http:') return null; return u.origin + u.pathname.replace(/\/$/, ''); } catch (_) { return null; }
            }
            try { const saved = localStorage.getItem('palmApiBase'); if (saved) { const u = new URL(saved.trim()); return u.origin + u.pathname.replace(/\/$/, ''); } } catch (_) {}
            const { protocol, hostname, port } = location;
            const local = hostname === 'localhost' || hostname === '127.0.0.1';
            if (local && port === '5050') return '';
            if (protocol === 'file:') return 'http://127.0.0.1:5050';
            if (protocol === 'http:' && local) return 'http://127.0.0.1:5050';
            if (protocol === 'https:') return null;
            return 'http://127.0.0.1:5050';
        }

        function hasBackendAiResult(seg) {
            if (!seg || !seg.success) return false;
            return !!(seg.features || seg.heart_line || seg.head_line || seg.life_line || seg.roi_image || seg.annotated_image || seg.rotated_image);
        }

        // ==========================================
        // Scan animation text
        // ==========================================
        const scanTexts = [
            '加载手部关键点模型...',
            '检测 21 个手部关键点...',
            '旋转矫正图像...',
            '分割手部前景...',
            '定位掌心 ROI 区域...',
            '增强掌纹纹理...',
            '提取掌纹线条...',
            '分析感情线结构...',
            '分析头脑线结构...',
            '分析生命线结构...',
            '生成分析报告...'
        ];

        // ==========================================
        // Analysis data
        // ==========================================
        const keywordsData = [
            { icon: '🧭', label: '方向感' },
            { icon: '💪', label: '毅力' },
            { icon: '✨', label: '创造力' }
        ];

        const linesData = [
            { name: '感情线', desc: '线条清晰，微微上扬，情感细腻但理性，在关系中追求真诚与稳定' },
            { name: '头脑线', desc: '起点与生命线略分开，独立思考，线条较长且向下延伸，想象力丰富，适合创意、策划、语言或心理相关领域。' },
            { name: '命运线', desc: '线条清晰，微微上扬，情感细腻但理性，在关系中追求真诚与稳定' }
        ];

        const traitsData = [
            { icon: '🧠', title: '独立而自信', desc: '手指修长舒展，掌型偏长，象征独立思考与自我驱动，做事有主见。' },
            { icon: '🔮', title: '理性与直觉并重', desc: '头脑线清晰且略向下，代表逻辑与想象力兼具，擅长分析与创造' },
            { icon: '❤️', title: '情感细腻深沉', desc: '感情线弧度柔和上扬，情感丰富且理性兼具，追求精神层面的契合。' },
            { icon: '🌿', title: '生命力稳健绵长', desc: '生命线弧度饱满，精力充沛、体质良好，生活热情高涨。' },
            { icon: '💼', title: '事业稳步上升', desc: '事业线明晰，方向感明确，适合拓展新领域或承担更大责任。' },
            { icon: '💰', title: '财运渐入佳境', desc: '太阳线显现，理财意识逐渐觉醒，容易通过个人能力获取财富。' }
        ];

        // ==========================================
        // Navigation: Home → Camera
        // ==========================================
        startBtn.addEventListener('click', () => {
            window.location.href = 'camera.html';
        });

        // ==========================================
        // Return from camera with captured image
        // ==========================================
        function checkCapturedImage() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('captured') === 'true') {
                const imageData = localStorage.getItem('palmImage');
                if (imageData) {
                    localStorage.removeItem('palmImage');
                    history.replaceState(null, '', window.location.pathname);
                    scanImage.src = imageData;
                    uploadedImage = new Image();
                    uploadedImage.onload = () => startProcess();
                    uploadedImage.src = imageData;
                }
            }
        }
        checkCapturedImage();

        // ==========================================
        // Scan process
        // ==========================================
        async function startProcess() {
            pageHome.style.display = 'none';
            pageScan.style.display = 'block';
            pageScan.classList.add('fade-in');

            let progress = 0;
            const progressInterval = setInterval(() => {
                progress = Math.min(progress + 1, 85);
                progressFill.style.width = progress + '%';
            }, 60);

            scanText.textContent = scanTexts[0];

            let segResult = null;
            const apiBase = getPalmApiBase();
            if (apiBase !== null) {
                try {
                    scanText.textContent = '正在调用 AI 掌纹识别...';
                    const canvas = document.createElement('canvas');
                    canvas.width = uploadedImage.naturalWidth;
                    canvas.height = uploadedImage.naturalHeight;
                    canvas.getContext('2d').drawImage(uploadedImage, 0, 0);
                    const b64 = canvas.toDataURL('image/jpeg', 0.85);
                    const url = (apiBase || '') + '/analyze';
                    const resp = await fetch(url, {
                        method: 'POST', mode: 'cors', credentials: 'omit',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ image: b64 })
                    });
                    segResult = await resp.json();
                    if (!resp.ok) segResult = { ...segResult, success: false };
                } catch (e) {
                    console.warn('[palm] API fail:', e);
                }
            }

            for (let i = 1; i < scanTexts.length; i++) {
                await new Promise(r => setTimeout(r, 400));
                scanText.textContent = scanTexts[i];
                progress = 30 + (i / scanTexts.length) * 70;
                progressFill.style.width = progress + '%';
            }

            clearInterval(progressInterval);
            progressFill.style.width = '100%';
            await new Promise(r => setTimeout(r, 400));

            showResult(segResult);
        }

        // ==========================================
        // Result page
        // ==========================================
        function showResult(segResult) {
            pageScan.style.display = 'none';
            pageResult.style.display = 'block';
            pageResult.classList.add('fade-in');

            // Palm thumbnail
            if (uploadedImage) {
                const thumbCanvas = document.createElement('canvas');
                const thumbSize = 300;
                const img = uploadedImage;
                const ratio = img.naturalWidth / img.naturalHeight;
                let sx = 0, sy = 0, sw = img.naturalWidth, sh = img.naturalHeight;
                if (ratio > 100/130) {
                    sw = img.naturalHeight * (100/130);
                    sx = (img.naturalWidth - sw) / 2;
                } else {
                    sh = img.naturalWidth / (100/130);
                    sy = (img.naturalHeight - sh) / 2;
                }
                thumbCanvas.width = thumbSize;
                thumbCanvas.height = thumbSize * 1.3;
                thumbCanvas.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, thumbCanvas.width, thumbCanvas.height);
                palmThumb.src = thumbCanvas.toDataURL('image/jpeg', 0.85);
            }

            // Keywords
            let kw = keywordsData;
            if (segResult && segResult.features) {
                const cls = segResult.classification || {};
                kw = [
                    { icon: '🧭', label: cls.palm_type || '方向感' },
                    { icon: '💪', label: '毅力' },
                    { icon: '✨', label: '创造力' }
                ];
            }
            keywordsGrid.innerHTML = kw.map(k =>
                `<div class="keyword-item">
                    <div class="keyword-icon">${k.icon}</div>
                    <span class="keyword-label">${k.label}</span>
                </div>`
            ).join('');

            // Lines
            let lines = linesData;
            if (hasBackendAiResult(segResult) && segResult.features) {
                const f = segResult.features;
                lines = [
                    { name: '感情线', desc: `线条清晰，长度 ${f.heart_length}px，曲率 ${f.heart_curvature}，情感细腻但理性，在关系中追求真诚与稳定` },
                    { name: '头脑线', desc: `起点与生命线略分开，长度 ${f.head_length}px，曲率 ${f.head_curvature}，独立思考，想象力丰富` },
                    { name: '命运线', desc: `线条清晰，生命线长度 ${f.life_length}px，曲率 ${f.life_curvature}，精力充沛，生活热情高涨` }
                ];
            }
            linesSection.innerHTML = lines.map(l =>
                `<div class="line-row">
                    <span class="line-name">${l.name}</span>
                    <span class="line-desc">${l.desc}</span>
                </div>`
            ).join('');

            // Traits
            traitsData.forEach((item, index) => {
                setTimeout(() => {
                    const card = document.createElement('div');
                    card.className = 'trait-card slide-up';
                    card.innerHTML = `
                        <div class="trait-icon">${item.icon}</div>
                        <div>
                            <div class="trait-title">${item.title}</div>
                            <div class="trait-desc">${item.desc}</div>
                        </div>`;
                    traitsContainer.appendChild(card);
                }, index * 120);
            });
        }

        // ==========================================
        // Share
        // ==========================================
        document.getElementById('shareBtn').addEventListener('click', () => {
            if (navigator.share) {
                navigator.share({ title: '手相解码', text: '我刚完成了手相解码分析！', url: location.href }).catch(() => {});
            } else {
                alert('报告已保存！长按图片即可分享给好友');
            }
        });
    </script>
</body>
</html>
